# ---- Added in 1.0.36: Cataclysm's arm-pose event only when a listener can act
# ----------------------------------------------------------------------------------------------
# Cataclysm's arm-pose event only when a listener can act
# Target: L_Ender's Cataclysm 3.16 | side: CLIENT | since 1.0.36
# Cataclysm builds and posts an arm-pose event twice per humanoid model per frame. Its only listener in the pack
# moves the arms only while the entity uses an item with Annihilators or Immolators in both hands. While the bus
# holds only that listener and the entity is not using an item, the event is not built: posting it would change
# nothing. Any other listener on the bus, or an entity using an item, posts as before.
# Idea: Collections Of Optimizations (cataclysm.skipIdleArmPoseEvent), idea text only; live listener check: ours
# Measured: with citadel_pose_hand_events, 132.3 ns, 176 B -> 67.7 ns, 48 B per pair of arm poses; 60,001 checks
# identical, shadow 82,254 checks, 0 mismatches (Core Ultra 9 285K).
cataclysm_pose_hand_events=true

# ---- Added in 1.0.36: Citadel's arm-pose event only when a listener can act
# ----------------------------------------------------------------------------------------------
# Citadel's arm-pose event only when a listener can act
# Target: Citadel 2.6.1 with Alex's Caves 2.0.2 and Alex's Mobs 1.22.9 | side: CLIENT | since 1.0.36
# Citadel builds and posts its own arm-pose event twice per humanoid model per frame. Its listeners in the pack
# act only for Alex's Caves' shield, gauntlet, spear, raygun, shot gum and candy-cane items, its Subterranodon,
# nuclear bomb and gum worm rides and the Sugar Rush effect, and for a used Vine Lasso. While the bus holds only
# those two listeners and none of these applies, the event is not built. Off in packs without both Alex's mods
# (their listeners are fingerprinted).
# Idea: ours (extends Collections Of Optimizations' Cataclysm idea to Citadel's event)
# Measured: Alex's Caves' listener alone was 0.16% of the render thread (an earlier profile of this pack);
# together with the Cataclysm switch 132.3 ns, 176 B -> 67.7 ns, 48 B per pair; shadow 22,642 checks, 0
# mismatches (Core Ultra 9 285K).
citadel_pose_hand_events=true

# ---- Added in 1.0.36: Idle Cataclysm bosses skip their keyframe pass
# ----------------------------------------------------------------------------------------------
# Idle Cataclysm bosses skip their keyframe pass
# Target: L_Ender's Cataclysm 3.16 | side: CLIENT | since 1.0.36
# The animate methods of Ignis, the Leviathan, the Ancient Remnant, the Ender Guardian and the Amethyst Crab are
# too large for the JIT and run interpreted every frame: 1,500 to 6,700 keyframe calls that all do nothing while
# the boss plays no attack (read from the bytecode: no writes, every animation constant made fresh). Right after
# the animator is reset, the rest of the method is skipped while no animation plays; idle movement after it is
# untouched.
# Idea: Collections Of Optimizations (cataclysm.skipIdleAnimate), idea text only
# Measured: idle animate 55.9 / 57.7 / 62.4 / 24.8 / 24.0 us -> 0.2-0.4 us per call; no change while attacking;
# 7,505 checks identical (Core Ultra 9 285K).
cataclysm_idle_animate_skip=true

# ---- Added in 1.0.36: Cataclysm shield layers reuse the pose just computed
# ----------------------------------------------------------------------------------------------
# Cataclysm shield layers reuse the pose just computed
# Target: L_Ender's Cataclysm 3.16, Lionfish API 2.8 | side: CLIENT | since 1.0.36
# Every frame the Ignis and the Ignited Revenant are drawn, their shield layer poses a second copy of the model
# with the same arguments the renderer just used (for the Ignis that is its 56 KB animation code, run
# interpreted), and the powered Harbinger's shield layer poses the renderer's own model a second time. These
# poses depend only on the entity, the frame and those arguments, and nothing in between touches the renderer's
# model, so when the renderer's model was just posed for this entity with the same arguments, the layer copies
# that pose (or keeps it, for the Harbinger) instead.
# Idea: Collections Of Optimizations (cataclysm.reuseLayerPose), idea text only; argument check and copy: ours
# Measured: shield layer per frame: Ignis attacking 81.3 us -> 0.9 us, idle 4.3-4.8 -> 2.7-3.4 us; Harbinger
# 3.2-3.4 -> 0.15-0.9 us; Ignited Revenant attacking 2.3 -> 0.7 us, idle 2.5-2.8 us -> 1.2-3.5 us (noisy);
# 30,000 frames with bit-identical poses (Ryzen 9 3900X).
cataclysm_shield_layer_pose=true

# ---- Added in 1.0.36: Fix: Cataclysm's lightning and sound caches let go of old worlds
# ----------------------------------------------------------------------------------------------
# Fix: Cataclysm's lightning and sound caches let go of old worlds
# Target: L_Ender's Cataclysm 3.16 | side: CLIENT | since 1.0.36
# Fix: five lightning effects (Boltstrike, the death laser, Maledictus' circle, the Scylla's anchor and eye
# sparks) and the sandstorm / Meat Shredder sounds keep every entity they ever drew or played in client caches,
# and through those entities the world they were in, until the next resource reload. When an entity leaves the
# client world its entries are now dropped, and when the client world unloads the caches are cleared.
# Differences you could notice: a lightning entity that leaves view and comes back within seconds starts with
# fresh bolts, and after a world change a new storm never inherits an old storm's sound.
# Idea: Collections Of Optimizations (cataclysm.pruneLightningRenders, cataclysm.sandstormSoundCleanup), idea
# text only
# Measured: bug reproduced on the real classes: with the switch off the old world stays reachable after it
# unloads; with it on it is collected (Ryzen 9 3900X).
cataclysm_client_leaks=true

# ---- Added in 1.0.36: Lionfish models keep their part list and found bones
# ----------------------------------------------------------------------------------------------
# Lionfish models keep their part list and found bones
# Target: Lionfish API 2.8 (L_Ender's Cataclysm 3.16 models) | side: CLIENT | since 1.0.36
# Every Lionfish model builds a new list of all its parts every frame to reset its pose, and keyframe animations
# build it again and stream it once per animated bone to find that bone by name. For the 79 Cataclysm models
# whose part list is made of final fields only (bytecode of each), the first list is kept and reused, and a
# found bone is kept while it still carries that name (no mod in the pack renames model parts). Other models run
# as before.
# Idea: Collections Of Optimizations (lionfishapi.cacheModelParts), idea text only; bone memo: ours
# Measured: one Wadjet idle keyframe pass 4,741 ns, 9,472 B -> 761 ns, 768 B; pose reset 175 ns, 592 B -> 123 ns, 0 B
# (74 parts); 13,183 checks identical, shadow 48,543 checks, 0 mismatches (Core Ultra 9 285K).
lionfish_model_parts=true

# ---- Added in 1.0.36: Lionfish keyframes reuse their maps and transforms
# ----------------------------------------------------------------------------------------------
# Lionfish keyframes reuse their maps and transforms
# Target: Lionfish API 2.8 | side: CLIENT | since 1.0.36
# While a Cataclysm boss attacks, every keyframe copies its map of part transforms into a second map and makes a new
# transform for every animated part. The two maps now trade places and dropped transforms, reset to zero, are reused:
# the same map contents and the same part positions after every keyframe.
# Idea: Collections Of Optimizations (lionfishapi.leanModelAnimator), idea text only
# Measured: allocation while attacking 3,570 -> 1,066 B (Ignis), 9,587 -> 2,915 B (Leviathan) per animate call, time
# unchanged; 30,001 checks identical over 6,000-frame sequences of five bosses (Core Ultra 9 285K).
lionfish_model_animator=true

# ---- Added in 1.0.36: Mekanism radiation checks visit only the chunks that hold a source
# ----------------------------------------------------------------------------------------------
# Mekanism radiation checks visit only the chunks that hold a source
# Target: Mekanism 1.20.1-10.4.13.69 | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.36
# About once a second for every living entity (and for players) Mekanism measures the radiation where it stands: it
# builds the 121 chunks around it with a set and a table view for each, almost always to find no source at all
# (sources exist only where radioactive gas was dumped or a reactor melted down). The check now looks only at chunks
# that hold a source: none in range gives the background level at once, exactly one is read as before; two or more, or
# a very large source table, run Mekanism's own walk. The numbers come out the same to the last bit, the radius-1
# setting keeps its "centre chunk only" behaviour, and the random draw per entity, shielding, decay and the client
# updates around the check are unchanged.
# Idea: Mekanism's own 1.20.4+ commit messages and Mekanism: Overclocked (radiation source index), idea text only
# Measured: 320,154 checks bit for bit identical, 0 differences (shadow mode 246,986 / 0), Valkyrien Skies' radiation
# hook applied alongside. Per check: no sources 4.7 us and 14.8 KB -> 19 ns and 56 B; 20 sources in the world
# 5.6 -> 0.16 us; 500 sources 6.0 -> 2.4 us (Ryzen 9 3900X, interleaved medians). Here Chunk3D.expand was 3.0% of
# the integrated server thread's allocation.
mekanism_radiation_source_range=true

# ---- Added in 1.0.36: Mekanism transporter items find their place on long routes by index
# ----------------------------------------------------------------------------------------------
# Mekanism transporter items find their place on long routes by index
# Target: Mekanism 1.20.1-10.4.13.69 | side: BOTH (acts on the server) | since 1.0.36
# An item travelling through logistical transporters looks up where the current transporter sits on its route
# several times per tick (next stop, previous stop, end of route, network updates), each time scanning the whole
# route. Routes of 16 or more transporters are now looked up in an index of the route, built once per route;
# shorter routes are scanned as before. Mekanism never changes a route in place (it only replaces it), so every
# answer is the one the scan gives, including routes that pass the same spot twice.
# Idea: Mekanism: Overclocked (cached path index), idea text only
# Measured: 144,001 route checks identical (next/previous/final, packet bytes, update NBT), shadow 936,001 / 0. Per
# trip along a route of 20 / 50 / 100 / 300 transporters 1.5x / 2.9x / 5.2x / 12.7x faster (Ryzen 9 3900X).
mekanism_transporter_path_index=true
