# ----------------------------------------------------------------------------------------------
# [FIX] Scuba Gear drowned equipment uses the generation region (structure lookup and random source)
# Target: Scuba Gear 1.0.6 | side: BOTH | since 1.0.12
# Scuba Gear equips drowned that spawn near ocean ruins and shipwrecks. Its Mob.finalizeSpawn
# mixin received the ServerLevelAccessor but dropped it, so ScubaEvents searched the live
# world's StructureManager (up to 21,144 structure queries at radius 15) and drew from the live
# world's random even while the drowned was being created inside a generation region. Under
# Distant Horizons that blocked the server on live chunk loads; under C2ME the live-world random
# was read from a worker thread and C2ME's CheckedThreadLocalRandom stopped generation with a
# ConcurrentModificationException. The mixin now passes its accessor to new overloads that bind
# the structure manager to the WorldGenRegion and use WorldGenRegion.getRandom during
# generation. The two parts depend on each other (the mixin passes the accessor to the new
# overloads) and share this one switch.
# Measured: Fixes a server freeze and a C2ME crash. Distant Horizons: the ocean-ruin baseline
# ran 424 ticks in 70 s (6.057 TPS) with eight zero-tick windows; fixed, 3,800 ticks in 189.997
# s (20 TPS); 626 fixture and 187 structural assertions. C2ME: 4,678 assertions including 2,000
# concurrent spawns; the exact 172-chunk ocean-ruin replay that crashed now completes (73.094 s)
# and saves nine drowned, four wearing Scuba gear.
scuba_gear_generation_context=true

# ----------------------------------------------------------------------------------------------
# [FIX] Alex's Caves Teletor spawn setup stays inside the generation region
# Target: Alex's Caves 2.0.2 | side: BOTH | since 1.0.12
# TeletorEntity.finalizeSpawn drew from the live world's random four times and added its
# floating weapon to the live Level even when it was handed a generation region. On a C2ME
# worker thread the random read stops generation with a ConcurrentModificationException, and the
# weapon insertion reaches into the live world from generation. The patch takes both the random
# and the weapon insertion from the supplied region.
# Measured: Fixes a C2ME crash. Twelve helper boundary/error cases and 2,000 concurrent
# operations pass; the actual Forge-transformed original fails on a worker thread, while the
# patched method passes 16 Teletors and 16 snails per native test with every weapon contained
# and linked. Together with scuba_gear_generation_context the exact 172-chunk C2ME ocean-ruin
# replay completes in 65.875 s.
alexscaves_teletor_generation_context=true

# ----------------------------------------------------------------------------------------------
# [FIX] Structure Gel lake hook checks structures inside the generation region
# Target: Structure Gel API 2.16.2 | side: BOTH | since 1.0.12
# Structure Gel's lake hook, which keeps lakes out of Structure Gel structures, had the same
# defect as Ice and Fire's lake guard: it took the live ServerLevel's structure manager while a
# lake was being placed in a generation region, so its checks could force live chunks to load on
# the server thread. The patch binds the structure manager to the supplied region with
# StructureManager.forWorldGenRegion when the lake is in the region's centre chunk (or the region
# is Distant Horizons'). Since 1.0.34 a lake placed off the centre chunk (jigsaw lakes with an
# offset, such as Strayed Fates: Forsaken's) asks the live level as before: the region lookup there
# could reach a structure start 9 chunks from the centre, outside the region, and stop generation.
# Measured: Fixes a server freeze; the second of the two independent lake guards in the
# 2026-09-09 freeze (12 Structure Gel workers were blocked once Ice and Fire's guard was fixed).
# Both fixed: 3,700 ticks in 185.001 s (20 TPS), zero live-chunk waits.
structure_gel_lake_guard_region=true


