# ---- Added in 1.0.30: Terrain draw commands are reused while nothing they come from changes
# ----------------------------------------------------------------------------------------------
# Terrain draw commands are reused while nothing they come from changes
# Target: Embeddium 0.3.31 (Minecraft 1.20.1) | side: CLIENT | since 1.0.30
# Every frame, and with Oculus shadows twice, Embeddium rebuilds each region's list of draw commands from its sections'
# mesh data. Each region pass now keeps the commands of its last two builds with everything they were built from: its
# mesh data's version (bumped by every upload, removal, resort and buffer move), the list of sections, the pass, the
# face-culling setting and the camera's position relative to the region's sections as Embeddium's face test sees it.
# When all of these are equal the kept commands are copied back instead of rebuilt; they are the same commands, byte
# for byte. A build whose inputs changed costs a little more than before (the copy that is kept).
# Idea: Sodium 0.7 draw-batch caching, idea text only
# Measured: 2,690,603 checks over 300,000 builds (uploads, removals, resorts, buffer moves, list and camera changes,
# both passes, switch toggles), 0 mismatches; unchanged regions 80-89% less time (hot 503 -> 58 us, cold 1,498 -> 262 us
# per frame for 432 regions), changed regions +14-28%; 2.0% of the render thread with a still camera (1.6% shadow pass)
