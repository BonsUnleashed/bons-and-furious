# from their own numbers only, which this switch's fingerprints confirm for Oculus 1.8.0, and the replay keys those
# numbers bit for bit. The shadow frustum follows the sun, which moves at most once per game tick, so with a still view
# the shadow search replays between ticks (two to four of every five frames at 60-100 FPS). Nothing in Oculus changes;
# with another Oculus build the shadow pass searches as before.
# Idea: Iris's draft to skip the shadow-pass search, idea text only
# Measured: in the embeddium_search_replay harness with all six Oculus shadow frusta, 0 mismatches; shadow pass 60-68%
# less time per still-view search (hot 65 -> 21 us, cold 193 -> 78 us)
oculus_shadow_search_replay=true

# ---- Added in 1.0.30: Translucent quad sort by packed keys
# ----------------------------------------------------------------------------------------------
# Translucent quad sort by packed keys
# Target: Embeddium 0.3.31 | side: CLIENT | since 1.0.30
# Embeddium orders every translucent quad buffer that is sorted on upload (translucent entities, items, beacon beams; with
# Oculus each batched segment) with a merge sort over an index array that compares squared distances through the index.
# For keys without NaN that is exactly the stable "farthest first" order. From 64 quads on, the switch packs each
# distance and its index into one long and sorts those with a byte-wise radix sort, which gives that same order; shorter
# buffers and any NaN key still go through Embeddium's own sort, and only the returned array is allocated.
# Idea: Sodium 0.7.0's faster vertex sorting (radix sort), idea text only
# Measured: 218,751 checks + 2 x 265,634 (both packed-sort paths), 0 mismatches; 1.5-1.7x at 96 quads, 2-2.8x at 256,
# 3-3.9x at 1,024, 3.5-5.8x at 16,384 (sort incl. distances, ParallelGC and ZGC), a third less allocation; below 64
# quads unchanged (one length test); 0.25% of the render thread in an entity-heavy scene before, near 0 elsewhere
embeddium_entity_sort_radix=true

