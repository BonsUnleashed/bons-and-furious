# ---- Added in 1.0.30: Packet bursts are flushed once instead of once per packet
# ----------------------------------------------------------------------------------------------
# Packet bursts are flushed once instead of once per packet
# Target: Minecraft 1.20.1 (Forge 47.4.16, Netty 4.1.82) | side: BOTH (acts on the server thread) | since 1.0.30
# Every packet the server sends is handed to the network thread as its own task, which wakes that thread up and then
# writes and flushes the packet on its own, one socket write per packet. The entity tracker and the block/light change
# broadcast send hundreds of small packets per tick in one burst, and a player's own tick (chunks, inventory) another.
# Inside those bursts the same tasks are queued in the same order without waking the network thread, each writes its
# packet without flushing, and every connection is flushed once when the burst ends, still within the tick. The packets,
# their order and every byte on the wire stay the same (compression and encryption see the same sequence). Packets with a
# send listener, keep-alives, protocol switches and packets from other threads take Minecraft's usual path. A connection
# that is closed during a burst is flushed first, so a message sent just before the close still arrives (1.0.34; in
# 1.0.30-1.0.33 a player refused at login for a ban, the whitelist, a full server or a slow login saw a generic
# disconnect without the reason).
# Fix (1.0.36): a connection's own burst is now always flushed by this switch. Up to 1.0.35 it counted on
# Minecraft's flush at the end of that connection's tick, which HariPlayer 2.0 (a VMP port) removes; with both
# mods every login stalled at the loading screen until "Took too long to log in" (with Connectivity's longer
# login timeout: an endless 100% screen). Next to a mod that moves connections between network threads
# (HariPlayer's eventloops), where a burst's flush could run before writes still queued on the old thread, the
# switch now stands down (one log line) and every packet takes Minecraft's path.
# Idea: Krypton (flush consolidation), VMP (avoid network wakeups) and Paper's connection patch title, idea text only
# Measured: 40 randomized runs over a real encrypted socket and 4 over the integrated server's local channel:
# identical byte streams and send-listener order. 300-packet bursts: 300 socket flushes -> 1, network thread CPU
# 8.7 -> 2.6 us per packet, server thread 235 -> 161 ns per send when other work runs between sends. 1.0.36: 182
# game and login ticks through Connection.tick, with and without a mod that removes the tick's flush: identical
# bytes, and every tick's packets leave before the tick ends (1.0.35 next to that mod: 17 of 20 ticks stalled).
vanilla_connection_flush_batching=true

# ---- Added in 1.0.30: Shader shadow pass outline discard
# ----------------------------------------------------------------------------------------------
# Shader shadow pass outline discard
# Target: Oculus 1.8.0 (with or without ImmediatelyFast 1.5.5) | side: CLIENT | since 1.0.30
# Fix: Oculus renders the shadow pass with its own render buffers, and nothing ever ends their outline batch. Armor
# renderers that pick the outline buffer themselves (GeckoLib 4.8.4 and AzureLib armor: Ars Nouveau, Mowzie's Mobs,
# Fantasy Armor, Goblin's Tyranny and more) write a glowing wearer's outline into it on every shadow pass, so it grows
# without limit (with ImmediatelyFast) or is later drawn into the shadow buffers (without it). The switch ends that
# pending outline batch at the end of each shadow pass without drawing it: what ending the batch does, minus the draw.
# The main pass, which draws the real glow outline from its own buffers, is untouched.
# Idea: ImmediatelyFast 1.6.9 / 1.8.5 (shadow pass outline buffer clearing), idea text only
# Measured: reproduced offline (600 outline quads per pass: 144,000 vertices and 2 MB -> 4 MB after 60 passes, on both
# the vanilla and the ImmediatelyFast buffer source); with the switch the buffer stays at its first-pass size and the next
# pass writes the same bytes as a fresh buffer (925 checks, 0 failures)
oculus_shadow_outline_discard=true

# ---- Added in 1.0.30: Pipez pipes stop re-sorting an unchanged pipe network on every transfer
# ----------------------------------------------------------------------------------------------
# Pipez pipes stop re-sorting an unchanged pipe network on every transfer
# Target: Pipez 1.20.1-1.2.26 | side: BOTH (pipe logic on the server, incl. the integrated server) | since 1.0.30
# Every item transfer, every fluid and gas pipe tick and every energy push into a pipe asks for the network's
# destinations in distribution order, and Pipez sorts the connection list again through a stream each time, although the
# list only changes when pipes change. Each pipe now keeps the order of its last sorted list and hands out a new copy
# while the list is the same object with the same entries in the same order and the distribution is the same. The order
# is the original's: both sorts are stable and use the same distance; random distribution still shuffles as before, and
# any unusual entry (a missing or modded connection) runs the original. Not in our pack: public value.
# Idea: our own finding (found while reading Pipez for the Pipez Optimizer idea, idea text only)
# Measured: public value; not visible in this pack. Offline on the real classes (untransformed classes as the baseline,
# 11 interleaved rounds, median): 53 -> 12 ns per call with 1 connection, 114-135 -> 37 ns with 4, 490-500 -> 100 ns with
# 16, and 330-600 -> 48-128 B; 60 random scenarios (29,857 calls incl. list replacements, in-place edits, all
# distributions, missing levels, null and modded entries) gave the original's lists.
pipez_sorted_connections_memo=true

# ---- Added in 1.0.30: Pipez pipes without filters stop building filter lists for every slot they try
# ----------------------------------------------------------------------------------------------
# Pipez pipes without filters stop building filter lists for every slot they try
# Target: Pipez 1.20.1-1.2.26 | side: BOTH (pipe logic on the server, incl. the integrated server) | since 1.0.30
# Item, fluid and gas pipes check their filters for every slot or tank they try for every destination (in round-robin
# mode for every single item), and the check builds two filtered lists through streams even when no filter is set,
# which is the usual case. With no filter the check is now answered at once: over an empty filter list the original
# cannot refuse, so the answer is the same; pipes with filters run the original check. Not in our pack: public value.
# Idea: our own finding (found while reading Pipez for the Pipez Optimizer idea, idea text only)
# Measured: public value; not visible in this pack. Offline on the real classes (untransformed classes as the baseline,
# 11 interleaved rounds, median): item check 133 -> 3.6 ns and 880 -> 0 B per call, fluid check 120 -> 4.9 ns and
# 816 -> 0 B; 5,803 random checks (empty, missing and filled filter lists of all kinds) answered like the original.
pipez_empty_filter_fast_path=true

# ---- Added in 1.0.30: Fix: Radium: block entities keep following world border changes after /worldborder damage or warning
# ----------------------------------------------------------------------------------------------
# Fix: Radium: block entities keep following world border changes after /worldborder damage or warning
# Target: Radium Re-Reforged 0.14.3 | side: BOTH | since 1.0.30
# Fix: Radium remembers for every ticking block entity whether it is inside the world border and updates that when the
# border moves. A border change that does not move it (/worldborder damage amount or buffer, warning distance or time)
# made Radium drop every block entity's subscription while keeping the remembered answer, so after the next real border
# change, block entities now outside kept ticking and ones the border grew over never ticked again. Those four changes
# now keep the subscriptions, so the remembered answer always equals vanilla's border test. Our worlds use the default
# border, so this matters only once the border is made smaller.
# Idea: Lithium 0.14.5 release notes, idea text only
# Measured: offline on Radium's own classes (real block-entity tickers, real border): 40 random sequences of 60 border
# changes with 441 block entities: without the fix 158,315 of 546,763 answers differed from vanilla, with it 0; sequences
# without those four changes behave identically with the switch on and off.
radium_world_border_keep_listeners=true

# ---- Added in 1.0.30: Fix: Radium: solid body parts of multipart mobs can be bumped into again
# ----------------------------------------------------------------------------------------------
# Fix: Radium: solid body parts of multipart mobs can be bumped into again
# Target: Radium Re-Reforged 0.14.3 | side: BOTH | since 1.0.30
# Fix: some mobs are built from several part entities. When a player or mob moves, Forge also checks the level's part
# entities for solid boxes; Radium's faster lookup reads only the normal entity lists, so solid parts could be walked
# through: Untamed Wilds' whale shark, baleen whale and anaconda bodies, Cataclysm's old Netherite Monstrosity, Alex's
# Mobs' giant squid and Unusual Prehistory's Brachiosaurus. The switch adds the solid part entities in reach to Radium's
# result with the same tests and in the same order as Forge's lookup, so moving and "is there room" checks see them as
# in vanilla Forge. Turn it off to keep Radium's walk-through bodies.
# Idea: Lithium 0.25.2 release notes, idea text only
# Measured: offline on Radium's own classes with a real entity store and Forge's part-entity list, 300 random scenes x
# 40 lookups: without the fix 522 of 12,000 collision lists and 463 of 12,000 "is there room" answers differed from
# Forge, with it 0 and 0; scenes without part entities identical. Cost like Forge's own loop: one box test per part
# entity of the level per lookup (about 5-8 ns each), nothing measurable with no part entities, no extra allocation.
radium_part_entity_collisions=true

# ---- Added in 1.0.30: Fix: Radium: copied chunk sections take new blocks correctly
# ----------------------------------------------------------------------------------------------
# Fix: Radium: copied chunk sections take new blocks correctly
# Target: Radium Re-Reforged 0.14.3 | side: BOTH | since 1.0.30
# Fix: Radium keeps the block and biome lists of chunk sections in its own palette. A COPY of that palette lost the
# marker for "not in the list yet", so writing a new block into a copied section silently stored the list's first
# entry (usually air) instead. The copy now keeps the marker and works exactly like the original and like vanilla. In
# this pack only render snapshots copy sections and they never write into the copy, so nothing visible changes here;
# it protects mods that edit copied sections.
# Idea: Lithium 0.14.8 release notes, idea text only
# Measured: 4,000 random palettes of 3-8 bits: index sequences on copies differed from vanilla's palette in 2,953 cases
# without the fix and in 0 with it; a copied section given an oak sign read back air without the fix and the oak sign
# with it. copy() costs the same within noise (about 0.8-0.9 us and 880 bytes either way).
radium_hash_palette_copy=true

# ---- Added in 1.0.30: Saved data and player files are written by a background writer
# ----------------------------------------------------------------------------------------------
# Saved data and player files are written by a background writer
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server thread of a running server) | since 1.0.30
# An autosave makes the server thread gzip and write every changed saved-data file (data/*.dat of every dimension) and
# every player's .dat, advancements and stats file before the tick can go on. The server thread still builds each file's
# content at the same moment as before (the same NBT and text); one background writer then compresses and writes it with
# the same streams, the same temporary file and the same replace, strictly in order, so the files end up byte for byte the
# same. Bytes reach disk a moment later; a hard crash in that window loses the newest copy that vanilla would have written.
# Reads of these files through Minecraft's loaders and file readers, /save-all flush, world close, server stop and world
# backups wait for the writer first; a mod that opens such a file with its own stream can still see the previous copy in
# that moment. With /save-all flush, Forge's level-save event runs after the files are written (1.0.34); after an
# ordinary autosave it can run while they are still being written. Mods whose saved data writes its own file format
# (Mekanism, Create, Refined Storage, Structure Gel here) stay synchronous, so does saved data with its own text form (its
# own toString or hashCode, none here; until 1.0.33 that text was built on every save), and so do player .dat files while
# any mod listens to Forge's player-save event (none in this pack).
# Idea: BetterAutoSave, Fast Async World Save and Paper's incremental saving, idea text only
# Measured: 289 saved-data files from 0 bytes to 3 MB, 150 player saves, 40 advancement and 40 stats files came out byte
# for byte identical, also for unwritable files and broken tags (761 checks). All 500 data files of a reference server at once: the server
# thread 4.9 s -> 0.9 s. A real autosave of the reference server spent about 175 of its 588 ms in this compression and writing.
vanilla_background_saves=true

# ---- Added in 1.0.30: level.dat is written by the same background writer
# ----------------------------------------------------------------------------------------------
# level.dat is written by the same background writer
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server thread of a running server) | since 1.0.30
# Every autosave also rewrites level.dat (world settings plus Forge's registry snapshot, about 1.2 MB compressed on the reference server)
# on the server thread. The server thread still builds its content as before; the background writer of the switch above
# compresses it, writes the temporary file and replaces level.dat (keeping level.dat_old), in order with the other files.
# Bytes reach disk a moment later; a hard crash in that window loses the newest copy that vanilla would have written.
# /save-all flush, world close, server stop, backups and every read of level.dat wait for the writer first.
# Idea: BetterAutoSave and Paper's incremental saving, idea text only
# Measured: the same writer and proof as above; on the reference server the compression and writing of level.dat took about 80 ms of every
# autosave.
vanilla_background_level_dat=false

# ---- Added in 1.0.30: SlashBlade player animations stop recomputing the same pose up to 20 times per frame
# ----------------------------------------------------------------------------------------------
# SlashBlade player animations stop recomputing the same pose up to 20 times per frame
# Target: SlashBlade: Resharped 1.9.65 | side: CLIENT | since 1.0.30
# SlashBlade animates sword attacks through PlayerAnimator with an MMD model of the player (12,824 vertices). PlayerAnimator
# asks for the pose of every body part and transform separately, about 20 times per frame per animated player, and each
# request recomputes the whole model for the same moment: bones, keyframes, IK and every vertex. A request that would
# repeat the last update of the same model with the same motion and time now keeps that result. The update writes only
# absolute values, so a repeat writes the same bits again; a motion with face morphs (they blend cumulatively), the
# look-at mode and any listener on the model's event bus always run the original, and every update clears the model's
# record, so a model shared by two players never answers for the other. Not in our pack: public value.
# Idea: VMD Animation Cache (SlashBlade animation cache), idea text only
# Measured: public value; not visible in this pack. Offline on the real classes (untransformed classes as the baseline,
# 11 interleaved rounds, median): an animated player's frame 1.52 -> 0.076 ms (76.2 -> 3.8 us per pose request, 20x),
# idle blade wielders sharing one time 17.6x per update; single updates and all-different times unchanged (1.01x, 1.03x);
# 40 random scenarios (39,283 updates incl. shared models, subclasses, listeners, look-at, face morphs, exceptions) left
# every bone, matrix and vertex bit-identical to the original.
slashblade_motion_update_memo=true

# ---- Added in 1.0.30: Ticking chunks remember their spawning gate
# ----------------------------------------------------------------------------------------------
# Ticking chunks remember their spawning gate
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Every server tick asks, for each ticking chunk, whether natural spawning is allowed there: a lookup of the chunk in
# the entity manager's map of every loaded chunk, usually two cache misses per chunk. Each chunk now remembers its last
# answer. The map changes in one place only (a chunk's status change), and that change marks its 8x8-chunk region as
# changed, so every chunk of the region asks the map again; saves mark everything as changed. While nothing changes
# around a chunk, the answer comes from the chunk itself and is always the map's answer.
# Steps aside when ServerCore is installed, because ServerCore changes the same call.
# Idea: our own (found in the 1.0.26 profile while measuring the natural-spawning census).
# Measured: offline on the real classes, 1,000 ticking chunks among 6,000 loaded ones: 30.0 -> 10.5 ns per chunk warm,
# 251.7 -> 119.6 ns with the caches emptied (2.1x); 1.3 million answers identical over 250,000 status changes, saves and
# a moving player (80% of answers remembered while 24 edge chunks per tick change). In-game JFR before: the lookup was
# 1.8-2.8% of the integrated server thread (Bons and Furious 1.0.26).
vanilla_spawn_gate_visibility_memo=true

# ---- Added in 1.0.30: Particular: chests remember whether their block state is waterlogged
# ----------------------------------------------------------------------------------------------
# Particular: chests remember whether their block state is waterlogged
# Target: Particular 1.2.7 | side: CLIENT | since 1.0.30
# Particular's soul-sand bubbles check every chest and ender chest in loaded chunks on every client tick, and the first
# thing they ask is whether the chest's block state is waterlogged. Nearly every chest is dry, so that one question is
# the whole cost, and with FerriteCore it goes through a hash lookup of the state's properties each time. A block state
# never changes, so the answer is now remembered per state (the few chest states in use) and the remembered answer is
# the very value the state gives. Everything else Particular does is unchanged.
# Idea: our own (found in our own 1.0.26 profile: Particular's chest handler, 0.20-0.48% of the client main thread).
# Measured: offline on the real classes with FerriteCore's state map and Particular's handlers: 9.6 -> 4.7 ns per chest
# (2.0x), 254 -> 238 ns when other block-state work runs in between (1.06x), no allocation; 3.7 million answers identical
# over every block state of the game, also from six threads at once and for states without the property.
particular_chest_waterlogged_memo=true

# ---- Added in 1.0.30: Spawn: sea-life decorations remember whether their block state is waterlogged
# ----------------------------------------------------------------------------------------------
# Spawn: sea-life decorations remember whether their block state is waterlogged
# Target: Spawn 4.0.7 | side: BOTH | since 1.0.30
# Spawn's sea bunnies, sea stars, sea urchins and other sea-life decorations tick on both sides for every decoration in
# loaded chunks, and each tick first asks whether the block state is waterlogged (with FerriteCore a hash lookup of the
# state's properties). The answer is now remembered per block state, as for Particular's chests above (one shared table),
# and is always the very value the state gives. The rest of the tick is unchanged; spawn_sealife_tick's changes still
# apply. What else the tick costs is the read of each decoration's own target position, which any exact version must keep.
# Idea: our own (found in our own 1.0.26 profile: Spawn's sea-life ticker, 0.25-0.65% of the client main thread,
# 0.04-0.22% of it this check).
# Measured: offline on the real classes with FerriteCore's state map: 9.6 -> 4.7 ns per check (2.1x), 257 -> 240 ns with
# other block-state work in between (1.07x), no allocation; same exactness run as above.
spawn_sealife_waterlogged_memo=true

# ---- Added in 1.0.30: Tag tests compare tag numbers
# ----------------------------------------------------------------------------------------------
# Tag tests compare tag numbers
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH | since 1.0.30
# Every tag test of a block, item, entity type, fluid or biome ("is this block climbable", "is this item a sword") asks
# the holder's tag set, which hashes the tag key and compares it with the record's generated equals against colliding
# entries, touching each compared key, its name and both strings. Each tag key now carries a number for its content
# (equal keys always share a number), and each holder keeps the sorted numbers of its current tag set; a test compares
# numbers. The holder rebuilds its numbers whenever its tag set is another object (every tag load and reload), so the
# answer is always the set's own. Sets that are not the JDK's immutable sets keep the original call.
# Idea: Leaf ("Cache block state tags"), idea text only; our design at the holder level covers every registry.
# Measured: offline on the real classes, 3,000 holders: 41-55 -> 17-21 ns per test warm (2.1-2.6x), 106-185 -> 66-107 ns
# with the caches emptied (1.5-1.7x), no allocation; 561,200 tests identical over 29,900 tag rebinds, mutable and
# polluted sets and racing readers (577,000 checks). In-game JFR before: the tag set test was 2.5-2.9% of the integrated
# server thread (Bons and Furious 1.0.26), 90% of it in the key's equals.
vanilla_tag_membership_ids=true

# ---- Added in 1.0.30: Block-entity tickers remember whether their chunk ticks
# ----------------------------------------------------------------------------------------------
# Block-entity tickers remember whether their chunk ticks
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Every tick, each block entity in the level's ticking list asks whether its chunk is in block-ticking range: a lookup of
# the chunk in the ticket tracker's map. vanilla_block_ticking_range_memo answers a repeat of the same chunk, but most
# chunks hold one or two tickers and sculk sensors ask about other chunks in between, so the map lookups it leaves were
# still 3.6% of the integrated server thread. Each ticker now remembers its own last answer. The map changes in one place
# only, and every change advances the tracker's version and marks the 8x8-chunk region it touched, so a ticker asks the
# map again whenever its region may have changed. While nothing changes around it, the answer comes from the ticker
# itself and is always the map's answer. Other callers, and tickers of other mods, ask the map as before.
# Idea: our own (found in the 1.0.26 profile: the cost vanilla_block_ticking_range_memo leaves).
# Measured: offline on the real classes with vanilla_block_ticking_range_memo on: 30,000 tickers of 20 players
# 17.8 -> 10.0 ns per ticker (1.8x), 2,050 tickers of one player 10.5 -> 9.3 ns, the old memo's 11 bytes per ticker of
# garbage gone; 3.4 million loop answers identical with the switch on and off, over ticket changes during the loop,
# chunk unloads, other threads and other levels (93% remembered while a player moves). In-game JFR before: the lookup
# was 3.6-3.9% of the integrated server thread (Bons and Furious 1.0.26).
vanilla_ticker_range_memo=true

# ---- Added in 1.0.30: Maps in item frames stop scanning every player's inventory for every player
# ----------------------------------------------------------------------------------------------
# Maps in item frames stop scanning every player's inventory for every player
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Every half second each map in an item frame updates itself once for every player in the dimension, and each of those
# updates checks, for every player the map has seen, whether that player carries the map, by scanning the whole
# inventory (with Curios, the curio slots too). For a map in a frame the answer cannot change what happens next (the map
# counts as carried because it is framed), so that inner check now skips the scan. The first check of each update, whose
# answer matters, maps held in hands, and other mods' map additions (Moonlight, Better Nether Map, Vivecraft) are
# unchanged; markers, frames and the data sent to players stay the same.
# Idea: Lithium (framed map updates), Paper ("Improve Maps in item frames performance"), titles and idea text only
# Measured: public value; not visible in this pack (0.000% in our own recordings). Offline on the real classes, one
# framed map's update: 1 player 996 -> 765 ns (1.30x), 10 players 7.2 -> 5.1 us (1.40x), 30 players 21.8 -> 15.9 us
# (1.38x), without Curios' extra slot scan; 600 scenarios (50,400 updates with held maps, removed players and players
# carrying copies) left identical markers, frames and player states.
vanilla_framed_map_holder_scan=true

# ---- Added in 1.0.30: Game events skip chunk sections without listeners instead of creating empty registries
# ----------------------------------------------------------------------------------------------
# Game events skip chunk sections without listeners instead of creating empty registries
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Every game event (a step, a landing, a splash, eating, a block change, a door or chest...) is offered to the listener
# registry of every chunk section within 16 blocks, 27 sections. Asking a section for its registry creates an empty one
# when there is none, and the chunk keeps it for as long as it is loaded, so the next event visits it again. Events now
# read the registry a section already has and pass over sections that have none, without creating anything. An empty
# registry has no listener to tell, so the same listeners hear the same events in the same order; block entities and
# mods that register or remove listeners still use the original lookup, and Valkyrien Skies' handling of events on ships
# is unchanged.
# Idea: Lithium (game event dispatch without empty section dispatchers), idea text only
# Measured: public value; not visible in this pack (game event dispatch was 0-0.26% of the integrated server thread in
# Bons and Furious 1.0.26). Offline on the real classes: an event with no listener nearby 627 -> 213 ns and 888 -> 24 B
# (2.9x), with a listener in 4% / 30% of the sections 2.8x / 1.6x, a busy sculk area where every section has listeners
# unchanged; 300 scenarios with 129,000 events, listeners added and removed during events: identical deliveries, while
# vanilla kept 346,753 empty registries and the switch 1,202.
vanilla_game_event_registry_lookup=true

# ---- Added in 1.0.30: Goal selectors skip the disabled-flag loop when nothing is disabled
# ----------------------------------------------------------------------------------------------
# Goal selectors skip the disabled-flag loop when nothing is disabled
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH | since 1.0.30
# Every other tick each mob's goal selectors ask, for every goal, whether one of the goal's control flags (move, look,
# jump, target) is disabled: a loop over the goal's flags. Flags are only disabled while a rider steers the mob or it sits
# in a boat, so for nearly every mob the answer is no and the loop decides nothing. The goal's flags are still read once,
# as before; while nothing is disabled the loop gets an empty set and answers no straight away. Any disabled flag, or a
# goal without a flag set, runs the original loop.
# Idea: Paper (goal selector flag sets); idea text only
# Measured: GoalSelector's flag test is 0.08-0.35% of the integrated server thread (Bons and Furious 1.0.26). Offline on
# the real classes, 4-12 goals per selector, three runs: 1.06-1.22x per selector tick with Radium's goal set (e.g.
# 260 -> 229 ns), 1.05-1.26x with vanilla's; unchanged (0.94-1.06x) when a flag is disabled; 400,000 operations
# identical to vanilla incl. every goal call.
vanilla_goal_flags_none_disabled=true

# ---- Added in 1.0.30: Item merges leave out neighbours that cannot merge before the merge loop
# ----------------------------------------------------------------------------------------------
# Item merges leave out neighbours that cannot merge before the merge loop
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Every item entity looks for neighbours to merge with every 2 to 40 ticks: it collects every item entity in a small box
# around it and then tries each one, so in a pile it checks every entity of every other item twice and runs the merge
# test on it as well. The collection now leaves out the neighbours that the merge test would reject on its first two
# checks (another item, or both counts together above the stack size), using the same comparisons; everything else goes
# through vanilla's own checks in the same order. The count check is used only while every stack involved holds at most
# 64, where the merges themselves cannot change its answer, and items with their own stack-size code are never left out.
# Same merges in the same order, same capability and stack-size calls.
# Idea: Lithium (item entity merging grouped by item), idea text only
# Measured: public value; not visible in this pack (item merging was 0-0.06% of the integrated server thread in Bons and
# Furious 1.0.26). Offline on the real classes: a 500-entity pile of 50 item types 33.9 -> 17.8 us and 4,161 -> 566 B per
# merge attempt (1.9x), one item type over half full 1.8x, a 500-entity mob-farm pile with 60% full stacks 1.3x; with
# Tactical Fishing's merge check (as in this pack) 15.5 kB -> 0.6 kB per attempt. 400 random piles (56,384 merge attempts,
# 4,215 merges, capability stacks, stacks above 64, items with their own stack size) identical to vanilla.
vanilla_item_merge_candidates=true

# ---- Added in 1.0.30: Goats and frogs pick long-jump targets without walking the whole candidate list per pick
# ----------------------------------------------------------------------------------------------
# Goats and frogs pick long-jump targets without walking the whole candidate list per pick
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Before a long jump, a goat lists every block in an 11 x 11 x 11 box around it (1,330 candidates; a frog 404) and then
# draws them one at a time, weighted by distance, until one is a usable landing spot. Every draw adds up all remaining
# weights, walks the list to the drawn one and searches the list again to remove it, and on a steep slope a goat can go
# through hundreds of draws in one tick (a frog that wants lily pads empties its whole list in one go). The switch keeps
# running sums of the weights beside the list, so a draw finds its candidate directly. It makes the same random draw,
# picks the same candidate and leaves the same list, and checks the list against its sums before every pick (any other
# change to the list falls back to vanilla's own selection with the same draw). Only vanilla's goat and frog behaviours
# are handled; other mods' jumping mobs keep the original code.
# Idea: Lithium (long-jump weighted choice), idea text only
# Measured: public value; not visible in this pack (no goat jumped during our own recordings). Offline on the real
# classes: a goat's 1,330 candidates drawn to the end 1.88 ms -> 0.22 ms (8.6x, 1,412 -> 163 ns per draw), a frog's 404
# 3.5x, a frog draining its list for preferred blocks 2.4x; 600 scenarios (491,000 draws incl. replaced lists and removals
# behind its back) gave the same candidates, the same lists and the same random numbers.
vanilla_long_jump_weighted_pick=true

# ---- Added in 1.0.30: Raycasts that ignore fluids skip the fluid reads
# ----------------------------------------------------------------------------------------------
# Raycasts that ignore fluids skip the fluid reads
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH | since 1.0.30
# Every step of a raycast reads the fluid in the block it crosses, even when the ray ignores fluids (mobs' line of sight,
# projectile flight, explosion exposure): for those rays the fluid never matters, and the read is a second chunk lookup of
# the same position plus a section read. Level now runs such rays with Minecraft's own ray walk and makes every call of
# the original step except that read. Every other ray, and every level whose class has its own fluid lookup, runs the
# original code. Stands down whenever another mod gives Level its own raycast (Valkyrien Skies' ship raycasts, or any
# other mod's): that mod's raycast is kept.
# Idea: Lithium (raycast), Paper ("Don't lookup fluid state when raytracing"); idea text only
# Measured: public value; not visible in this pack (0.00% of the integrated server thread, Bons and Furious 1.0.26; and
# it stands down here because Valkyrien Skies is installed). Offline on the real classes, line-of-sight rays of 8-32
# blocks: 1,194 -> 919 ns per ray with vanilla's chunk cache, 1,078 -> 734 ns with Radium's (1.3-1.5x); other rays
# unchanged; 40,000 rays identical to vanilla incl. chunk lookups, chunk cache and load tickets.
vanilla_raycast_fluid_none=true

# ---- Added in 1.0.30: Turtle-egg searches skip sections that cannot hold the target
# ----------------------------------------------------------------------------------------------
# Turtle-egg searches skip sections that cannot hold the target
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Zombies, husks, drowned, zombie villagers and zombified piglins (and mod goals built on the same RemoveBlockGoal, such as
# Alex's Mobs' and Naturalist's egg goals) look for their target block every 5-10 seconds: about 15,500 positions, each a
# chunk lookup and two block reads. The search now visits the same positions in the same order and makes the same chunk
# lookups, but skips the block reads in chunk sections whose palette holds neither the target block nor a block with its
# own canEntityDestroy: there the test is a pure "no". Every other position runs the goal's own test. Applies only to
# goal and mob classes that keep vanilla's search, test and restriction methods (checked once per class).
# Idea: Lithium (non-POI block searches), Leaf, Mobtimizations; idea text only
# Measured: public value; not visible in this pack (0.00% of the integrated server thread, Bons and Furious 1.0.26).
# Offline on the real classes, natural terrain: 1,221 -> 673 us per search with vanilla's chunk cache, 925 -> 502 us with
# Radium's (1.8x; +332 bytes per search); 6,000 searches identical to vanilla incl. chunk lookups, chunk cache and every
# canEntityDestroy call.
vanilla_turtle_egg_search_sections=true

# ---- Added in 1.0.30: Piglin and hoglin repellent searches skip sections without a repellent
# ----------------------------------------------------------------------------------------------
# Piglin and hoglin repellent searches skip sections without a repellent
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.30
# Every piglin and hoglin sensor run (about once a second per mob) looks for the nearest repellent block (soul fire, soul
# lanterns, warped fungus, ...): 2,601 positions, each a block read and a tag test. The search now visits the same
# positions in the same order with the same chunk lookups, but skips the block reads in chunk sections whose palette holds
# no repellent; the first hit is the same position, returned the same way. Only when the whole search box is inside the
# build height and outside debug worlds; otherwise the original runs.
# Idea: Lithium (non-POI block searches), Leaf; idea text only
# Measured: public value; not visible in this pack (0.00% of the integrated server thread, Bons and Furious 1.0.26).
# Offline on the real classes, nether terrain: 144 -> 80 us per search with vanilla's chunk cache, 105 -> 68 us with
# Radium's (1.5-1.8x; +32 bytes per search); 6,000 searches identical to vanilla incl. chunk lookups, chunk cache and
# load tickets.
vanilla_repellent_search_sections=true

# ---- Added in 1.0.30: Formatting-code strip without a regex for plain text
# ----------------------------------------------------------------------------------------------
# Formatting-code strip without a regex for plain text
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.30
# Minecraft removes colour and style codes from a text by running a pattern search over it, even when the text has
# none. JEI does this for every tooltip line of every item while it builds its search index at world join. A formatting
# code always starts with the section sign, so a text without one comes back exactly as it went in: the very same
# text object. Such texts are now returned directly; texts with a section sign still go through the pattern search.
# Idea: JEIOptimizer (cheaper single-threaded JEI index build), idea text only; the fast path itself is ours
# Measured: offline on Minecraft's own class, 2,036,620 strings (159,459 item names and tooltip lines from this pack,
# every single character, random texts with real codes) gave the same result, the same object where the original
# returns its input; 235 -> 26 ns and 208 -> 0 bytes per call.
vanilla_strip_formatting_fast_path=true

# ---- Added in 1.0.30: aquifers rank their candidate cells from a small per-cell table
# ----------------------------------------------------------------------------------------------
# Minecraft: aquifers find the nearest water sources from a small table instead of recomputing them for every block
# Target: Minecraft 1.20.1 (Forge 47.4.16; with YUNG's Cave Biomes 2.0.5) | side: BOTH (world generation: dedicated and integrated server) | since 1.0.30
# Every block of new terrain that is not solid (the whole air column above the ground, water and caves) asks the
# aquifer what it holds. Each time the aquifer worked out the twelve candidate water sources around the block again
# (grid index, stored position, unpacking, distance) and looked the three nearest up again by position. It now keeps the
# twelve candidates of each grid cell in a small table, ranks their distances without branches (equal distances in the
# same order as before), and reads the nearest ones by index. Water levels are computed by the game's own code, in the
# same order and number as before (YUNG's Cave Biomes looks up a biome whenever one is computed, so that order matters),
# and a cell whose positions are not computed yet runs the original code. Only aquifers with no unknown mod code use it.
# Idea: C2ME (unmerged pull requests 557/558), idea text only
# Measured: offline on Minecraft's own class with YUNG's mixins applied: 60 whole chunks (384 and 768 high), 1,125 column
# queries and 520,000 direct calls gave identical blocks, flags, caches and the same sequence of water-level computations.
# At the pack's 768 height computeSubstance took 99-126 -> 73-86 ns of thread CPU per call (per-round ratio 0.67-0.71 over
# three runs; 0.63-0.83 at 384 high) and a chunk's noise fill 52-57 -> 44-47 ms CPU (ratio 0.78-0.85; busy machine,
# medians of 13 interleaved rounds). In this pack's pregeneration profile the method was 8.2% (self) of all samples.
vanilla_aquifer_candidate_cache=true

# ---- Added in 1.0.30: aquifers return air at once high above every nearby water level
# ----------------------------------------------------------------------------------------------
# Minecraft: blocks high above all nearby water levels skip the aquifer's pressure checks (needs the switch above)
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (world generation: dedicated and integrated server) | since 1.0.30
# Close to the border between two water sources the aquifer weighs their "pressure" before it decides a block is air.
# When the block is at least 5 above all three nearest water levels and the second and third sources are already known,
# that check can only end in air (every weight is zero or negative there), so the answer is given at once. It never
# computes a water level the game would not have computed at that moment, and never skips one it would have.
# Idea: C2ME (unmerged pull request 559), idea text only
# Measured: same proof as above (and 2.55 million shadow comparisons, 401,000 of them decided by this shortcut, no
# difference); 64-72% fewer bytes per call (9.6 -> 3.5 B at 768 high, 6.9 -> 1.9 B at 384: about 1.2 MB less garbage per
# 768-high chunk); thread CPU per call a further 0-6% at 768 high (inside the busy machine's noise) and 2-20% at 384.
vanilla_aquifer_high_air=true

# ---- Added in 1.0.30: structure terrain blending skips pieces that cannot reach the block
# ----------------------------------------------------------------------------------------------
# Minecraft: the terrain blending around structures only looks at the pieces that can reach each block
# Target: Minecraft 1.20.1 (Forge 47.4.16; with Integrated API, YUNG's API, Moog's Structure Lib, fdbosses, Lithostitched, Valhelsia) | side: BOTH (world generation) | since 1.0.30
# In a chunk near villages, ruins and other structures that blend into the terrain, every block (196,608 in a 768-high
# chunk) adds up a term for every structure piece and every jigsaw junction nearby, although a piece only reaches 5-12
# blocks around its box. Now each chunk's pieces are looked at once, and each block only adds the terms of the pieces
# whose reach holds it, in the same order. Every term it leaves out is exactly zero, so the sum is the same to the last
# bit. The other mods' terrain-adaptation code still runs as before; pieces of fdbosses' boss arenas keep the full list.
# It only acts where the Beardifier check of worldgen_empty_beardifier_marker trusts every mod's code in this class.
# Idea: C2ME (pull request 552; Mojang did the same in 26.1.2), idea text only
# Measured: offline on Minecraft's own class with the pack's ten Beardifier mixins: 300 random structure sets (7.1 million
# positions, subclassed and fdbosses boxes included) and 40 whole chunks gave bit-identical results; a shadow run checked
# 113.7 million left-out terms (all exactly zero). Per block: 24 pieces + 80 junctions 1,209 -> 58 ns (768 high, about
# 238 -> 11 ms per chunk), 6 pieces + 12 junctions 297 -> 38 ns, 1 piece 42 -> 31 ns. In this pack's pregeneration profile
# the blending was 3.0% of all samples (1.0.26, before the empty-chunk marker).
vanilla_beardifier_influence_bounds=true

# ---- Added in 1.0.30: biome lookups compute their border offsets with a bit mask
# ----------------------------------------------------------------------------------------------
# Minecraft: biome lookups work out their border blur offsets with a bit mask instead of a signed remainder
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH | since 1.0.30
# Every biome lookup at a block position (mob spawning, particles, snow and ice, feature placement, height queries of
# other mods, ...) blurs biome borders by giving each of the 8 surrounding biome cells three pseudo-random offsets. Each
# offset takes the remainder of a 64-bit number divided by 1024, rounded towards minus infinity, and the sign correction
# that needs is a branch the processor cannot predict, 24 times per lookup. For a divisor of 1024 that remainder is
# exactly the lowest 10 bits of the number, for negative numbers too, so it is now read with a bit mask. Every offset,
# distance and chosen biome is the same.
# Idea: Tpsum (its BiomeLookup notes), idea text only
# Measured: offline on Minecraft's own class: 200 million random numbers and 4 million lookups (64 seeds, positions up to
# 30 million blocks out) gave identical results; a lookup took 293 -> 172 ns of thread CPU (ratio 0.59, 15 interleaved
# rounds of 4 million lookups, busy machine). In this pack's profiles biome lookups were 0.17-0.69% of the client's samples
# and 0.92% of the server's during pregeneration.
vanilla_biome_fiddle_mask=true

# ---- Added in 1.0.30: Alex's Mobs crows' pumpkin search answered from the chunk's block lists
# ----------------------------------------------------------------------------------------------
# Alex's Mobs: crows' pumpkin search is answered from the chunk's block lists where nothing can be found
# Target: Alex's Mobs 1.22.9 | side: BOTH (the goal runs on the server) | since 1.0.30
# Every few seconds each wild crow looks for something it fears (pumpkins and the like) in a 39 x 11 x 39 box around
# it: 16,731 block reads, usually to find nothing. A 16x16x16 section of a chunk can only hold the blocks on its block
# list, so when no list in the box shows a feared block (and every chunk there is already fully loaded), the answer is
# known: nothing. The search then makes only the chunk lookups the reads would have made, in the same order, so chunk
# loading and bookkeeping stay exactly as before, and skips the block reads (consecutive lookups of the same chunk are
# made once, so the profiler's "getChunk" counter, counted only while /debug or /perf runs, shows fewer lookups;
# cache misses and tickets are unchanged). Anywhere a feared block could be, Alex's
# Mobs' own search runs. The crows' crop search is left alone (it uses vanilla's search, which another switch covers).
# Measured: offline on Alex's Mobs' own class, 20,000 searches (loaded and unloaded chunks, pumpkins near and far, old
# block-list entries, datapack tags) gave the same results, destinations and chunk bookkeeping; a search over open
# ground took half the time offline, where the chunk lookups dominate; in game the reads it skips cost more.
alexsmobs_crow_scan_palette_check=true

# ---- Added in 1.0.30: Model layers baked without streams
# ----------------------------------------------------------------------------------------------
# Vanilla: model layers are baked with plain loops
# Target: Minecraft 1.20.1 | side: CLIENT | since 1.0.30
# Turning a model layer definition into model parts built two stream pipelines for every part. Many armour mods
# (Clothing of the Lowlands, Terramity, Aquamirae and others built from the same template) bake their armour model again
# on every render call, three times per chestplate, for every entity wearing it. The same parts are now built with plain
# loops: children in the same order, the same map and list types, the same cubes, the same poses, and other mods' hooks on
# the bake still run.
# Runtime flag: none (it replaces a Minecraft method; switch it off here, which takes effect at the next start).
# Measured: offline, all 204 vanilla layers and the 53 armour layers that installed armour mods bake per render call give
# trees identical to vanilla's own bake; against the unchanged game code with ModernFix in the same run, 6.9 -> 6.2 us and
# 11.5 -> 7.6 KB per layer bake (median of 7 rounds). A chestplate of these mods bakes 3 layers per render.
vanilla_layer_bake_streamless=true

# ---- Added in 1.0.30: ModernFix shared cubes remembered per cube definition
# ----------------------------------------------------------------------------------------------
# ModernFix: each cube definition remembers the cube ModernFix shares for it
# Target: ModernFix 5.27.77 (compact_entity_models) | side: CLIENT | since 1.0.30
# ModernFix already gives every bake of the same cube the same shared cube object, but to find it, it built a 15-value
# key (with 13 boxed numbers) and hashed and compared all of it for every cube on every bake. Each cube definition now
# remembers the cube it was given, with the texture size and the values that can change (its position, size and visible
# faces), and hands it back while they are unchanged: the very object ModernFix would find. Any change goes through
# ModernFix again. It stays off without ModernFix's cube sharing. One rare difference inside the game: if two threads
# bake equal cubes for the very first time at the same moment, ModernFix ends up with two equal cubes and this switch may
# keep handing out the other one; they are identical geometry, so nothing looks different.
# -Dbons_and_furious.modernfixCubeBakeMemo.shadow=true asks ModernFix every time and logs any other object (for testing).
# Measured: offline on all 257 vanilla and armour layers, the same cube objects as ModernFix hands out, also after
# positions, sizes and face sets were changed in place; with vanilla_layer_bake_streamless 6.2 -> 1.3 us and 7.6 -> 2.4 KB
# per layer bake, and 6.9 -> 1.3 us and 11.5 -> 2.4 KB against the unchanged game code (median of 7 rounds).
modernfix_cube_bake_memo=true

# ---- Added in 1.0.30: BOMD's ward, monolith and levitation scans skipped while none exists
# ----------------------------------------------------------------------------------------------
# Bosses of Mass Destruction: ward, monolith and levitation scans skipped while no such block exists
# Target: Bosses of Mass Destruction 1.1.2 | side: BOTH (the scans run on the server) | since 1.0.30
# BOMD keeps a list of its mob wards, monoliths and levitation blocks per world, and searches it all the time: 81 chunks
# around every spot where a mob is about to spawn (for a mob ward), 81 chunks around every explosion (for a monolith),
# and the chunks around every player on every tick (for a levitation block). Each search built a pile of small objects
# even when the world has none of these blocks, which is the usual case. The list now also keeps a count per block type,
# updated in the only two places the list changes. While the count is zero the search can find nothing, so it is
# skipped; as soon as one such block exists BOMD's own search runs as before. Same spawns, same explosion power, same
# flight. A player who logs out while flying in a levitation beam keeps flight on relog, as before.
# Measured: offline on BOMD's own classes, 360,000 checks: the counts always matched the list, and spawn checks,
# explosion power and flight (abilities, packets) were identical over 20,000 random worlds with and without these blocks;
# with none placed, spawn check 728 -> 13 ns, explosion 712 -> 24 ns, player tick 373 -> 15 ns.
bomd_block_cache_presence=true

# ---- Added in 1.0.30: Cooking for Blockheads compat data loads once per entry
# ----------------------------------------------------------------------------------------------
# [FIX] Cooking for Blockheads: compat data no longer piles up on every world join and /reload
# Target: Cooking for Blockheads 16.0.15 (Minecraft 1.20.1) | side: BOTH (server data reload; singleplayer shares it) | since 1.0.30
# Cooking for Blockheads reads its compat files (tools, water and milk items, non-food recipes, oven fuels and recipes,
# toaster recipes, kitchen connector blocks) with a server reload listener, so they load again at every server start,
# every singleplayer world joined in one session and every /reload, and every load added all entries again: the lists and
# the oven and toaster tables grow (a sink offers each water item once per load), and after a data pack edit old and new
# oven values coexist and table order decides which one is used. Now an entry that repeats one an earlier compat load
# added is not added again, and a changed oven fuel time, oven result or toaster result replaces the earlier value in
# place. The first load is exactly as before; duplicates inside one load and everything other mods or Cooking for
# Blockheads itself register through its API are kept untouched. An entry the files no longer list stays, as before.
# Measured: offline on the real loader with Cooking for Blockheads' own 16 compat files and one test file: the original grew
# from 21 entries to 40, 60, 79, 98 and 117 over six loads (the sink offered 13 water items instead of 2); with the switch
# the first load was identical and every later load left the same objects in place. 600 random load sequences (2,382 loads,
# changed data, duplicates, API registrations in between) matched a reference model in all 19,056 collection states.
cookingforblockheads_compat_reload_once=true

# ---- Added in 1.0.30: Entity counts per level for two presence gates
# ----------------------------------------------------------------------------------------------
# Vanilla: a few entity types are counted where each level keeps its entities
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.30
# Needed by crittersandcompanions_red_panda_gate and fdbosses_spawner_presence_gate; it does nothing by itself. Each level
# keeps a count of red pandas (Critters and Companions) and of boss spawners, Malkuth spawners and Chesed kinetic fields
# (FD Bosses), updated in the two places where an entity enters or leaves one of the level's entity sections. Searches are
# not changed by this switch. If something makes a count doubtful (two entities with the same id in one section, or an
# entity added from another thread), that level's gates run their original searches from then on, with one warning.
# -Dbons_and_furious.entityClassCountLayer.shadow=true checks every "none" answer by walking the level (for testing).
# Measured: offline on the game's own entity managers, 24,000 random adds, moves, removals, visibility changes and
# unloads: every count equal to a full walk of the sections (4.35 million checks), and every duplicate-id or wrong-thread
# case was caught. Cost: about 5 ns per entity entering or leaving a section, about 50 ns for a counted entity.
vanilla_entity_class_count_layer=true

# ---- Added in 1.0.30: Critters and Companions red-panda goals skip their search when there is no red panda
# ----------------------------------------------------------------------------------------------
# Critters and Companions: mobs that avoid red pandas skip the search while their level has none
# Target: Critters and Companions 2.3.5 (Minecraft 1.20.1) | side: BOTH (where mob AI runs) | since 1.0.30
# Critters and Companions makes bees, endermen, iron golems, llamas, polar bears, spiders, vexes and wolves avoid tame,
# alert red pandas. Every other tick each of these mobs searched a 33 x 7 x 33 area for a red panda. While the mob's level
# holds no red panda at all, that search can only come back empty, so the goal now answers the way it does after an empty
# search (nothing to avoid, goal not started) without searching. With a red panda anywhere in the level it runs as before.
# Requires vanilla_entity_class_count_layer; with that switch off this one changes nothing.
# -Dbons_and_furious.crittersAndCompanionsRedPandaGate.shadow=true runs the original next to the gate and logs any
# difference (for testing).
# Measured: offline on Minecraft's own goal and entity search, 2,000 calls with and without the gate gave the same
# answers; 709 -> 33 ns and 501 -> 0 bytes per call.
crittersandcompanions_red_panda_gate=true

# ---- Added in 1.0.30: Curios slot caches safe across threads
# ----------------------------------------------------------------------------------------------
# [FIX] Curios: the shared slot-attribute and slot-UUID caches can no longer be corrupted by two threads
# Target: Curios API 5.14.1+1.20.1 | side: BOTH | since 1.0.30
# Curios keeps two plain hash maps, one object per slot type (the slot's attribute) and one UUID per slot, filled by
# whichever thread asks first. In single player the client asks while drawing item tooltips and the built-in server asks
# while equipment changes, so both threads can fill the same map at once. That can throw an error out of the middle of a
# tooltip or an equipment update, or lose an entry so that one slot type ends up with two attribute objects (bonuses
# added under one and removed under the other). Each map has a single method that reads and fills it; that method now
# runs under its own lock. The maps, the order of their calls and every answer stay exactly the same for a single thread,
# including unusual slot names, so nothing changes except that two threads take turns.
# Measured: offline on Curios' own classes, 8 threads filling the caches together (300 rounds) gave 11,439 errors and 183
# slot types with two attribute objects before the fix and none after; 17,179 single-thread checks identical (classes,
# names, UUIDs, which calls create a new object, map order).
curios_thread_safe_caches=true

# ---- Added in 1.0.30: Distant Horizons biome caches reset with the world
# ----------------------------------------------------------------------------------------------
# [FIX] Distant Horizons: biome caches are emptied when a world is left, so the next world's distant terrain uses its own biomes
# Target: Distant Horizons 3.3.2 | side: BOTH | since 1.0.30
# Distant Horizons keeps five static biome caches (biome wrappers by biome and by name, block/biome pairs, and the
# client's biome-by-name and tint-colour tables) that it never clears. After leaving a world or a server, the next
# world's distant terrain was tinted with the previous world's biomes (grass, foliage and water colours and coldness come
# out wrong whenever the next world or server defines a biome differently), and the previous world's whole biome
# registry stayed in memory until the game was closed. The caches are now emptied where Distant Horizons already resets
# its other world state: right after it clears its block textures when a world is unloaded, and again just before a new
# world's worker threads start. They refill on demand from the current world, exactly as after a fresh start; within one
# world nothing changes. Since 1.0.34 the reset never loads a Distant Horizons class (on the first world of a session
# it did, just as the server's first Distant Horizons message arrived, and that message was lost: no distant terrain
# from the server), and the caches keyed by name are emptied only before the next world starts.
# Measured: offline on Distant Horizons' own classes through its real world change: before the fix all five caches kept
# the old world's entries, the next world's plains resolved to the old world's biome and that biome was never freed;
# with the fix every cache was empty after the unload, the next world got its own entries and the old biome was garbage
# collected.
distanthorizons_world_change_biome_reset=true

# ---- Added in 1.0.34: Distant Horizons sends its server settings again after a lost reply
# ----------------------------------------------------------------------------------------------
# [FIX] Distant Horizons: a server reply lost while joining is asked for again, so distant terrain streams in from the server
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.34
# When joining a server, Distant Horizons sends its settings to the server while it creates its client world, and only
# afterwards starts the threads that handle the server's messages. A reply that arrives in between is dropped (a bare
# "warn" line in the log). That reply is the only one that tells Distant Horizons the server can send distant terrain, so
# without it only the chunks along the player's own path get distant terrain. Once those threads exist, the settings are
# sent again if no reply was handled yet; the server answers every time, and that answer is handled. When the first reply
# was only late, the same settings simply arrive twice. Singleplayer is not affected.
# Measured: a dedicated server with a large pack, three joins per case with Distant Horizons 3.3.2. With the client held
# 3 s at login, so that the server registers it first (the order that loses the reply): switch off, the reply was lost
# in 2 of 3 joins, and in both Distant Horizons asked the server for no distant terrain; switch on, it was lost in 3 of
# 3 joins and all 3 handled the answer to the second sending 8-9 ms after Distant Horizons started. Without the hold the
# first reply came 0.7-1.6 s after the start, so the settings were sent and answered twice in all 3 joins, and all 3 got
# full support from the server.
distanthorizons_join_config_resend=true

# ---- Added in 1.0.30: Monster Yam zombies added once
# ----------------------------------------------------------------------------------------------
# [FIX] Dungeons Delight: a Monster Yam's summoned zombie is added to the world once on Hard, not twice
# Target: Dungeons Delight 1.2.10 | side: BOTH | since 1.0.30
# On Hard difficulty the Monster Yam added each rotten zombie it summons to the world a second time. The second attempt
# can never succeed, but it still ran every mod's "entity joined the world" handlers again for a zombie that was already
# there (and the add hooks of mods such as Cupboard, Radium and Valkyrien Skies), and then logged "UUID of added entity
# already exists". The second attempt is now skipped when the first one added that zombie; if the first one was refused,
# the second still runs as before. Below Hard nothing changes.
# Measured: offline: the Monster Yam's own tick routes its two adds through the fix in order; over 256 summon loops (every
# first-add outcome, Hard and not, switch on and off) the second add was skipped exactly after a successful first add.
# With Collections Of Optimizations (tested 4.6): its options dungeonsdelight.noDuplicateZombieAdd and
# dungeonsdelight.leanYamAura patch the same tick. While either is on, this switch steps aside; otherwise this switch
# applies and leaves COO's copy out. One log line says which (since 1.0.36).
dungeonsdelight_yam_single_add=true

# ---- Added in 1.0.30: Dynamic Trees rapid rot no longer loops forever at a generation region's edge
# ----------------------------------------------------------------------------------------------
# [FIX] Dynamic Trees: rapid rot no longer loops until the stack overflows at a generation region's edge
# Target: Dynamic Trees 1.20.1-1.4.11 | side: BOTH (world generation; singleplayer runs it on the integrated server) | since 1.0.30
# When a generated tree's branch is left without support, Dynamic Trees rots it away at once: the branch checks its
# neighbours, removes itself and checks them again, one inside the other. During world generation a feature may only
# write one chunk out from the chunk being decorated. A branch beyond that edge cannot be removed: the removal is
# refused, Dynamic Trees still counts it as rotted, and two such branches next to each other check each other forever,
# until the thread's stack overflows (Dynamic Trees issue 1150, still reachable in 1.4.11: the chunk's generation dies
# with a StackOverflowError and takes the server down). A check that comes back to the same branch with the same radius
# while no rot write has succeeded since the last visit can only repeat itself, so that repeat now stops and the branch
# stays (where the original crashed). Every cascade that ends in the original is left exactly as it is. Species,
# features or blocks that replace Dynamic Trees' own rot code, and fertile branch cascades, always run the original.
# Measured: offline on Dynamic Trees' own classes, issue 1150's layout overflowed the stack in the original (on a real
# generation region too) and ended after one stop with the switch. In 6,000 random worlds (49 million traced steps), the
# 5,568 that end in the original were identical with the switch (blocks, results, random state) and the 432 that
# overflowed ended, identical up to the first stop.
# With Collections Of Optimizations (tested 4.6): its option dynamictrees.boundedRapidRot bounds the same cascade (COO
# applies it on the client only, so a dedicated server keeps this switch). While that option is on, this switch steps
# aside; otherwise this switch applies and leaves COO's copy out. One log line says which (since 1.0.36).
dynamictrees_rot_cycle_guard=true

# ---- Added in 1.0.30: Dynamic Trees thick trunk shapes built once
# ----------------------------------------------------------------------------------------------
# Dynamic Trees: thick trunk and trunk shell shapes are built once per size
# Target: Dynamic Trees 1.20.1-1.4.11 | side: BOTH | since 1.0.30
# Thick trunks (radius 9 to 24) and the shell blocks around them built a new shape from a box on every shape query
# (collisions, block outlines, pathfinding). There are only 16 thick sizes and a shell sits at one of a few offsets
# around its trunk, so those shapes are now built once and handed back again. A box that is not exactly one of those
# sizes and offsets is built as before. Shapes cannot be changed after they are built, so a shared one answers the same.
# Measured: offline on Dynamic Trees' own blocks, every radius, waterlogged or not, 40 neighbour layouts and every shell
# position gave the same geometry as the original (405,508 checks). A thick trunk query took 38 instead of 54 ns and
# 64 instead of 264 bytes, a shell query 174 instead of 222 ns and 288 instead of 688 bytes.
dynamictrees_thick_shape_memo=true

# ---- Added in 1.0.30: Farmer's Delight HUD overlay lookups
# ----------------------------------------------------------------------------------------------
# Farmer's Delight: the HUD listeners reuse their overlay lookup
# Target: Farmer's Delight 1.3.4 (on Forge 47.4.16) | side: CLIENT | since 1.0.30
# Farmer's Delight's nourishment and comfort HUD listeners run for every HUD element Forge draws, every frame, and each
# looked its own element up again in Forge's overlay table to compare it with the element being drawn. Each listener now
# remembers its last answer together with the id it asked for and the table the answer came from, and hands it back while
# both are the very same objects. Forge's table can never change (a rebuilt table is a new object) and the id is a fixed
# ResourceLocation, so the answer is the one Forge gives; any other id or table, and every lookup before Forge has built
# its table, goes to Forge as before.
# -Dbons_and_furious.farmersdelightOverlayLookupMemo.shadow=true asks Forge on every reused answer and logs any difference
# (for testing).
# Measured: offline on Farmer's Delight's own listeners and Forge's own table, 400,000 lookups and 47,500 HUD events with
# the table rebuilt, shortened and swapped and Farmer's Delight's ids reassigned, identical to the original; 7.0 -> 3.2 ns
# per listener call, and 124 -> 62 ns with the CPU's L1/L2 caches cleared before every call (median of 9 rounds), 0 bytes
# either way. About 100 listener calls per frame with 51 HUD elements.
# With Collections Of Optimizations (tested 4.6, client): its option farmersdelight.cacheOverlayLookup remembers the same
# overlay lookups. While that option is on, this switch steps aside; otherwise this switch applies and leaves COO's copy
# out. One log line says which (since 1.0.36).
farmersdelight_overlay_lookup_memo=true

# ---- Added in 1.0.30: FD Bosses skips its boss-spawner searches when there is no spawner
# ----------------------------------------------------------------------------------------------
# FD Bosses: arena-protection, drop, sky and kinetic-field searches are skipped while the level has none to find
# Target: FD Bosses 3.1.0.3 (Minecraft 1.20.1) | side: BOTH | since 1.0.30
# FD Bosses searches for its boss spawners within 100 blocks of every broken or placed block and every explosion (that is
# how it protects boss arenas), within 50 blocks of a player whose items drop, and every client tick at night within 30
# blocks for a Malkuth spawner; on every move of a player or thrown ender pearl it looks for Chesed kinetic fields within
# 20 blocks. Mining with drills, quarries or area tools runs the 100-block search for every block. While the level holds
# no entity of the searched kind, the search can only come back empty, so it is now answered with an empty list and FD
# Bosses' own code runs as before on it. With a spawner or kinetic field anywhere in the level the search runs as before.
# Requires vanilla_entity_class_count_layer; with that switch off this one changes nothing.
# -Dbons_and_furious.fdbossesSpawnerPresenceGate.shadow=true runs the original next to the gate and logs any difference
# (for testing).
# Measured: offline on FD Bosses' own listeners and Minecraft's entity search, 3,500 calls with and without the gate gave
# the same results (cancelled events, protected blocks, sky fade, collision shapes). Per broken block 4,361 -> 59 ns and
# 1,875 -> 88 bytes; per player move 1,168 -> 50 ns; per night-time client tick 1,682 -> 38 ns.
# With Collections Of Optimizations (tested 4.6): its options fdbosses.skipHellscapeSkyScan, skipArenaProtectionScan and
# skipKineticFieldCollision skip the same three searches. While any of them is on, this switch steps aside; otherwise
# this switch applies and leaves COO's copies out. One log line says which (since 1.0.36).
fdbosses_spawner_presence_gate=true

# ---- Added in 1.0.30: FD Bosses' Phase Sphere no longer affects other players on your screen
# ----------------------------------------------------------------------------------------------
# [FIX] FD Bosses: the Phase Sphere's client-side effect applies to your own player only
# Target: FD Bosses 3.1.0.3 (Minecraft 1.20.1) | side: CLIENT | since 1.0.30
# FD Bosses runs its Phase Sphere code for every player your client sees, but the client part of it is about your own
# player. While you used the Phase Sphere in multiplayer, every other player in view was given flying, no-clip and
# not-on-ground on your client (they could look like they float or pass through blocks), and your use timer ran once per
# player in view each tick instead of once. Now the client part runs only for your own player. Your player and everything
# the server does are unchanged.
# Measured: offline on FD Bosses' own handler, 600 calls for your player, other players and server players: other
# players were changed in 80 of them before (the bug) and never now; your player and server players unchanged.
fdbosses_phase_sphere_local_only=true

# ---- Added in 1.0.30: Lionfish API's fluid-walk check without throwaway arrays
# ----------------------------------------------------------------------------------------------
# Lionfish API: the fluid-walk check reads its cells without throwaway arrays
# Target: Lionfish API 2.8 (3.0 has the same check) | side: BOTH | since 1.0.30
# Lionfish API (it comes with L_Ender's Cataclysm) checks, for every mob that moves without rising, whether it stands on
# a fluid it can walk over. Each check built 13 small arrays and 12 block positions, about 0.8 KB of garbage, and read
# 12 cells although only 6 are different. The check now reads the 6 cells once each, in the same order, with no
# garbage. A cell is skipped only where reading it again could not change anything (its chunk was read just before and
# nothing else ran in between); on a chunk's edge, or if the mob changes block during the check, it reads all 12 as
# before. Same fluid, same height, the same stand-on-fluid event, same result. (The profiler's "getChunk" counter,
# counted only while /debug or /perf runs, sees the 6 skipped repeat lookups less.)
# Measured: offline on the transformed Entity, 1.5 million checks with identical results, events, mob state and chunk
# bookkeeping; dry ground 832 -> 0 bytes and about half the time per check (161-199 -> 79-122 ns over two runs),
# standing in water 11.3 -> 6.1 us. Before, the check was 0.45-0.6% of the server thread and 0.8% of its allocation in
# our pack.
lionfishapi_fluid_walk_scan=true

# ---- Added in 1.0.30: Relics' fluid-walk check skipped where no fluid is near
# ----------------------------------------------------------------------------------------------
# Relics: the fluid-walk check is skipped where none of its cells holds a fluid
# Target: Relics 1.20.1-0.8.0.13 | side: BOTH | since 1.0.30
# Relics checks, for every mob that moves without rising, whether it stands on a fluid it can walk over (for the Aqua
# and Magma Walker relics). Each check built 13 small arrays and 12 block positions, about 0.75 KB of garbage, even with
# no fluid anywhere near, which is most of the time. A small check now reads the same 12 cells first, in the same order,
# without garbage: when none of them holds a fluid, Relics' answer is already known (the movement stays as it is, no
# event) and its check is skipped. Near a fluid, or when the cells reach into the next chunk, Relics' own check runs as
# before. None of Relics' code is copied. (Near a fluid the cells are read twice, so the profiler's "getChunk" counter,
# counted only while /debug or /perf runs, shows 12 more lookups there.)
# Measured: offline on the transformed Entity, 1.5 million checks with identical results, events, mob state and chunk
# bookkeeping; dry ground 111 -> 67 ns and 736 -> 0 bytes per check, unchanged near fluids and on chunk edges. Before,
# the check was 1.9% of the server thread's allocation in our pack.
relics_fluid_walk_scan=true

# ---- Added in 1.0.30: Ice and Fire's entity tag checks reuse their tag keys
# ----------------------------------------------------------------------------------------------
# Ice and Fire: entity tag checks reuse their tag keys
# Target: Ice and Fire 2.1.13-1.20.1-beta-5 | side: BOTH (works on the server tick) | since 1.0.30
# Ice and Fire asks "is this mob a chicken?" (its rotten-egg feature) for every mob on every server tick, and asks the
# same kind of question for livestock, sheep, villagers, cockatrice targets and dragon targets. Each question built a new
# tag key from the same fixed tag name and looked it up in a shared table of tag keys. The key made the first time is
# now kept and handed back. A tag key is just the tag's name, so the answers are the same, and they still follow the
# current tags after a /reload or a datapack change (only the key is kept, never the answer).
# Measured: offline on Ice and Fire's own classes with Forge's tag manager, 120,000 checks over 400 tag reloads gave the
# same answers; the chicken check 33.9 -> 20.3 ns and 24 -> 0 bytes per call. Before, it was 0.4-0.8% of the server
# thread in our pack.
iceandfire_entity_tag_keys=true

# ---- Added in 1.0.30: Ice and Fire path debug context
# ----------------------------------------------------------------------------------------------
# Ice and Fire: the pathfinding debug context is prepared only at the render stages that use it
# Target: Ice and Fire 2.1.13-1.20.1-beta-5 | side: CLIENT | since 1.0.30
# Ice and Fire's world-render listener handed every one of Forge's eleven render stages per frame to its pathfinding
# debug context, which copied seven values into its fields, pushed a pose, moved it to the camera and popped it again.
# Only two stages use any of it: the one that draws the debug paths and the one that ends their batch. At the other
# stages the call now stops right after fetching the buffer source, which is where the original starts. What is left out
# only reads values and writes fields that are read nowhere else before the next used stage rewrites them, and the
# pushed pose is popped again, so the pose stack is left exactly as before. Whenever the original would fail (no
# player, no or an empty pose stack) it still runs and fails at the same stage.
# Measured: offline on Ice and Fire's own classes, 360 frame pairs (4,320 stage calls each way, with the buffer source
# made lazily, no player and an empty pose stack): the same outcome, pose stack bits, buffer source and batches, and the
# same context at the stages that use it; 718 -> 195 ns and 1,864 -> 496 bytes per frame (median of 7 rounds).
iceandfire_path_debug_stage_gate=true

# ---- Added in 1.0.30: L2 Library effect icons
# ----------------------------------------------------------------------------------------------
# L2 Library: the effect-icon pass returns at once for entities without client effects
# Target: L2 Library 2.5.1-slim (inside Ars Delight 1.2.2) | side: CLIENT | since 1.0.30
# After every living entity is drawn, every frame (GeckoLib entities included), L2 Library looked the entity's client
# effect capability up, checked its "ClientOnly" tag, looked the same capability up a second time and went through its
# effect map, and only then found that there was nothing to draw. The map only fills when the server sends a tracked
# effect, which this pack never does. Now the first lookup also checks the map, and when it is empty the pass ends there:
# nothing was going to be drawn in that case, so the result is the same. An entity with effects goes through L2's code as
# before. The one difference inside the game is that the second, identical capability lookup is not made for such an
# entity; capability lookups only read (all 443 in this pack were checked), so nothing can notice.
# -Dbons_and_furious.l2libraryEffectIconFastPath.shadow=true lets L2's code run every time and checks that the second
# lookup gives the same capability with an empty map (for testing).
# Measured: offline on L2's own classes and Forge's capability dispatcher, 6,000 entity states with and without the
# capability, effects, client render effects and the ClientOnly tag: the same icons, outcome and provider calls, except
# the skipped second lookup; 24.5 -> 16.3 ns per drawn entity with no other capabilities, 74 -> 50 ns to 102 -> 45 ns with
# eight other capabilities attached, 0 bytes either way (median of 9 rounds).
l2library_effect_icon_fast_path=true

# ---- Added in 1.0.30: L2 Library effect icons kept for the remaining viewers
# ----------------------------------------------------------------------------------------------
# [FIX] L2 Library: when one player stops seeing a mob, the other players no longer lose its effect icons
# Target: L2 Library 2.5.1 (inside Ars Delight 1.2.2) | side: BOTH | since 1.0.30
# L2 Library shows some mob effects to nearby players. When a player stopped tracking a mob, it sent "this effect ended"
# for each such effect to the mob's viewers, but Forge has already taken the leaving player off that list by then, so the
# message only reached the players who still see the mob, and their game wrongly dropped the effect. The message is no
# longer sent: the leaving player never received it anyway, the others keep the correct state, and a player who comes
# back into range still gets the effects. In this pack no mod marks effects for L2 Library to show, so nothing changes
# here; it matters for packs with L2 content mods.
# Measured: offline on L2 Library's own class: with a shown effect the original goes on to send the message and the
# fixed handler returns; without one both do nothing; Forge's order (player removed, then the event) is pinned by the
# switch's fingerprints.
l2library_stop_tracking_noop=true

# ---- Added in 1.0.30: Legendary Monsters camera listener without a player
# ----------------------------------------------------------------------------------------------
# [FIX] Legendary Monsters: the camera-shake listener no longer throws when there is no local player
# Target: Legendary Monsters 2.2.2 | side: CLIENT | since 1.0.30
# Legendary Monsters' camera listener read the local player's age one line before checking that there is a player, so a
# camera event without one (possible when another mod renders a world with its own camera) threw an error out of the
# camera setup. Without a player the listener now does nothing, which is what the rest of it already did in that case;
# with a player it runs unchanged.
# Measured: offline on Legendary Monsters' own class: without a player the original throws and the fixed listener
# returns; with a player both run the same code; switching it off brings the original error back.
legendary_monsters_camera_null_guard=true

# ---- Added in 1.0.30: ModernFix represented creative tabs
# ----------------------------------------------------------------------------------------------
# ModernFix: JEI's represented creative tabs are counted with a hash index
# Target: ModernFix 5.27.77 with JEI 15.59.0.212 | side: CLIENT | since 1.0.30
# With ModernFix's JEI-backed creative search, the first search inside a creative tab with a search bar (once per JEI
# session) decides which tabs JEI represents by asking, for every JEI item stack and every creative tab, whether the
# tab's items contain it: tens of thousands of stacks times every tab, each check hashing the item and its NBT. Now one
# pass records which tabs hold an item stack with a given hash, and the same check runs, in the same order, only where it
# can find a match: a stack can only equal an element with the same hash. Same counts, same result. Tabs whose item set
# is not vanilla's own kind, and empty stacks, get the full check as before.
# -Dbons_and_furious.modernfixRepresentedTabsIndex.shadow=true counts both ways and logs any difference (for testing).
# Measured: offline on ModernFix's own method with 163 creative tabs (31,000 items) and 30,000 JEI stacks, counts identical
# for the full scene, 60 random sub-scenes and a tab changed during the count, and the same represented tabs; 2.8% of the
# checks are still needed; 899 -> 176 ms for the one-time count (median of 5 rounds).
modernfix_represented_tabs_index=true

# ---- Added in 1.0.30: Mutant Monsters skips its creeper-minion check for empty shoulders
# ----------------------------------------------------------------------------------------------
# Mutant Monsters: the creeper-minion shoulder check skips empty shoulders
# Target: Mutant Monsters 8.0.7 | side: BOTH (every player tick, on the server and on each client) | since 1.0.30
# On every player tick Mutant Monsters looks at both shoulders for its creeper minion, which hisses now and then. It
# turned the shoulder's entity name into an id and looked it up in the entity list even when the shoulder was empty
# (no name at all), which can only find nothing. Empty shoulders now skip that lookup. A shoulder with anything named
# on it (a parrot, a minion, anything else) still goes through Mutant Monsters' own check, unchanged.
# Measured: offline on Mutant Monsters' own class, 200,000 player ticks with every kind of shoulder (empty, parrots,
# minions, silenced, broken names, client and server) gave the same sounds, random numbers and errors; a player tick with
# two empty shoulders 49.4 -> 8.3 ns and 48 -> 0 bytes.
mutantmonsters_empty_shoulder_skip=true

# ---- Added in 1.0.30: Nether Expansion antidotes with a broken effect id
# ----------------------------------------------------------------------------------------------
# [FIX] Nether Expansion: an antidote whose stored effect is malformed or no longer exists no longer throws
# Target: Jaden's Nether Expansion 2.3.5 | side: BOTH | since 1.0.30
# An antidote stores the id of its effect. If that id is malformed, or names an effect that is not registered (for
# example from a mod that was removed), drawing the item, its tooltip and drinking it all threw an error, the first one
# every frame. Such an antidote is now treated as having no effect, which is the answer the item already gives for an
# antidote without one: it is drawn in its custom or default colour, shows no effect line and applies nothing. Every
# antidote with a valid effect works exactly as before.
# Measured: offline on Nether Expansion's own class: every registered effect (also as "Awkward" and with a custom
# colour) gave the same effect, colour and item data; 8,026 malformed, unknown and random ids made the original throw
# and the fixed method answer "no effect".
netherexp_antidote_effect_guard=true

# ---- Added in 1.0.30: Regions Unexplored fuel times per item
# ----------------------------------------------------------------------------------------------
# Regions Unexplored: an item's fuel burn time is looked up once, then repeated for that item
# Target: Regions Unexplored 0.5.6+1.20.1 | side: BOTH | since 1.0.30
# Forge asks every fuel listener for every non-empty stack whose burn time anyone wants: JEI's fuel list goes through the
# whole ingredient list on every world join, and furnaces, hoppers and other mods ask again. Regions Unexplored's listener
# compared the item with 422 of its own items each time (a registry lookup per comparison, all 422 for any item that is
# not one of them). The first time an item is asked about, the listener now runs unchanged while its burn-time calls are
# recorded (none for most items, two for the painted slabs: 300, then 150); later events for that item make the same
# calls in the same order. The listener reads nothing but the item, and its own items are fixed once the game has
# registered them, so every event ends with the same burn time and the same cancellation; a run that throws is not
# remembered. The answer is kept on the item itself (one field per item), so items are told apart exactly as the
# listener's own comparisons do.
# Measured: on Regions Unexplored's own class, 5.0 us and 12.9 KB of garbage per event (2.1 us / 6.5 KB with plain
# vanilla item lookups) became 7-10 ns and 0 bytes (median of 9 alternating rounds, 42,780 events each); 386,324 checks
# against the untransformed class (2,139 items x 10 entry states, exceptions, 8 threads) and 358,499 shadow comparisons
# matched. In game the listener was about 0.5 s of the client thread at every JEI start.
# With Collections Of Optimizations (tested 4.6): its option regionsunexplored.cacheFurnaceBurnTimes remembers the same
# burn times. While that option is on, this switch steps aside; otherwise this switch applies and leaves COO's copy out.
# One log line says which (since 1.0.36).
regionsunexplored_fuel_burn_memo=true

# ---- Added in 1.0.30: Ribbits maraca performer guard
# ----------------------------------------------------------------------------------------------
# [FIX] Ribbits: removing a maraca player that is not in the audience list no longer throws
# Target: Ribbits 3.0.2 | side: BOTH | since 1.0.30
# Ribbits removes a maraca performer by walking that performer's audience list without checking that there is one, so
# removing a performer it no longer tracks threw an error on the server thread. A missing list is now treated as an
# empty audience; for a tracked performer everything happens as before, in the same order. The situation is not known to
# occur with Forge 1.20.1's item handling, so this is a guard.
# Measured: offline on Ribbits' own class: an untracked performer makes the original throw and the fixed method return;
# performers with an empty or a three-player audience give the same calls and the same result in both.
# With Collections Of Optimizations (tested 4.6): its option ribbits.fixPerformerCrash guards the same lookup. While that
# option is on, this switch steps aside; otherwise this switch applies and leaves COO's copy out. One log line says which
# (since 1.0.36).
ribbits_performer_absent_guard=true

# ---- Added in 1.0.30: Simply Swords config reads without re-parsing
# ----------------------------------------------------------------------------------------------
# Simply Swords: a config file whose bytes have not changed is not parsed again
# Target: Simply Swords 1.56.0-1.20.1 | side: BOTH | since 1.0.30
# Every Simply Swords config value read (on every hit, every tick while a Magiblade is held, every Wildfire effect tick,
# for every runic sword in an inventory) read its json5 file, parsed all of it with Gson and converted every entry, and
# each entry of the wrong kind threw an exception that was caught and dropped (29 per float read of runic_effects). The
# file is still read on every call, so an edit is seen at once; when its bytes are the same as the last time, the values
# that run stored are stored again (or left as they are when nothing else was stored since) instead of reading, parsing
# and converting again. A changed file is read, parsed and converted by Simply Swords' own code exactly as before;
# missing, empty, unreadable or broken files run the original code and print the same errors. Calls are serialized,
# which also stops the client and server threads from writing Simply Swords' shared value tables at the same time.
# Measured: on Simply Swords' own class with the pack's files, a float read from unique_effects took 119 us instead of
# 259 us and 7 KB instead of 104 KB of garbage, runic_effects 129 us instead of 233 us (3 KB instead of 59 KB), general
# 132 us instead of 174 us (median of 9 alternating rounds; the rest is the file read itself); 46,001 checks against the
# untransformed class (40,000 calls with 100 file edits, return values, printed output and the value tables in order).
simplyswords_config_unchanged_reuse=true

# ---- Added in 1.0.30: Slice & Dice's wet-air checks answered from the chunk's block lists
# ----------------------------------------------------------------------------------------------
# Slice & Dice: the wet-air checks are answered from the chunk's block lists
# Target: Slice & Dice 3.6.0 | side: BOTH (answers on the server thread) | since 1.0.30
# Slice & Dice looks for its sprinklers' "wet air" all the time: at every mob on every tick (to put fires out), and
# above every spot the game asks "is it raining here?", even on dry days (three blocks or more each time). Each look is
# a chunk lookup and a block read. A 16x16x16 section of a chunk can only hold the blocks on its block list, and a
# section that holds only air reads as air (wet air counts as air). So when the lists of the sections involved show no
# wet air, Slice & Dice's answer is already known: no wet air. The check then answers after one chunk lookup. Wherever
# wet air is listed, Slice & Dice's own check runs, so sprinklers work exactly as before. None of its code is copied.
# The one internal difference, by design: the original's lookups can add a chunk ticket that lasts one tick; the new
# lookup adds none. Blocks, mobs, fire, saves and visuals are unchanged; at most a border chunk that lost all its other
# tickets in the same tick starts unloading one tick earlier.
# Measured: offline on the real classes, 939,000 checks with identical results and fire handling (every kind of block
# list, crops, dried-up wet air, refilled lists, unloaded chunks, other threads); the is-it-raining check 58-82 -> 22-34
# ns even with the original's chunk lookups all hitting the cache (in game they also miss it and add tickets). Before,
# about 1% of the server thread in our pack.
sliceanddice_wet_air_gate=true

# ---- Added in 1.0.30: Storage Drawers count updates only to players who can hold the drawer's chunk
# ----------------------------------------------------------------------------------------------
# Storage Drawers: drawer count updates only to players who can hold the drawer's chunk
# Target: Storage Drawers 1.20.1-12.15.1 | side: BOTH (server logic; singleplayer runs it on the integrated server) | since 1.0.30
# Every change of a drawer's stored amount (a hopper or pipe moving items, every slot of a shift-click deposit) sent a count
# update to every player of the dimension within 500 blocks, standard and compacting drawers alike. A client that does not
# hold the drawer's chunk looks the drawer up, finds nothing and drops the update, so each of those sends cost the server a
# packet hand-off, an encode and the bytes on the wire for nothing. The update now skips players outside the chunk's
# tracking set (ChunkMap.getPlayers, the set vanilla sends block changes to; mods that show chunks elsewhere, such as
# SecurityCraft cameras and Valkyrien Skies ships, extend that set). Everyone else gets the same packet in the same order on
# the same tick: the 500-block distance, the dimension test and other mods' changes to the broadcast are untouched, and
# every skipped packet is one the client would have discarded. When the drawer's dimension has at most one player
# (singleplayer included) the update is sent exactly as before, without the check. Without Storage Drawers nothing is
# applied; with it, every broadcast other than a drawer count update is unchanged.
# Fix (1.0.36): next to a mod that replaces Minecraft's broadcast method with its own version (Sable 2.0.6 does
# on NeoForge 1.21.1; no mod in our pack does), the game refused this switch's hook into that version and the
# server stopped at start ("cannot inject into ... merged by ... with priority 1000"). The hook now asks for a
# higher priority, so it is accepted there, and the switch steps aside with one log line naming that mod: drawer
# count updates then go to exactly the players that mod's broadcast picks. Without such a mod nothing changes. A
# replacement with priority 1500 or more, or one marked final, is still refused as before (the mixin system's
# own rule); none is known.
# Measured: offline on the real PlayerList.broadcast and ChunkMap.getPlayers in 4,000 random player layouts
# (both dimensions, view distance 2-32, 778 of them with at most one player in the dimension): the recipients
# were exactly the original's recipients that hold the chunk, in the same order, and exactly the original's with
# one player (25,557 checks). Each skipped recipient saves about 0.4 us of encode and send work and 38 bytes on
# the wire; with 2 players at the drawer and 8 more within 500 blocks a count update took 1.1 us instead of 4.5
# us. Singleplayer costs nothing extra (421 vs 418 ns); two players who both hold the chunk pay about 0.1 us per
# count update. 1.0.36: with our own test replacement of broadcast at the default priority, the 1.0.35 hook was
# refused offline exactly as reported and the 1.0.36 hook was accepted with one log line; in 3,000 random player
# layouts every count update then reached exactly the replacement's 14,454 recipients (18,005 checks). Without a
# replacement the same 25,557 checks pass and the changed class differs from 1.0.35's only in the priority
# number and source line numbers it records.
storagedrawers_count_sync_holders=true

# ---- Added in 1.0.30: Structurify keeps one answer per structure start
# ----------------------------------------------------------------------------------------------
# Structurify: each checked structure start is remembered once instead of four times
# Target: Structurify 2.0.34+mc1.20.1 | side: BOTH | since 1.0.30
# Structurify remembers, per structure and chunk, whether a structure start passed its overlap, biome and flatness
# checks, and never forgets it during a session. Besides the overall answer it also stored each of the three partial
# answers in a map of its own, and nothing ever reads those three maps: they are only written inside the overall
# computation, which runs once per start. The three checks now run exactly as before, in the same order and with the
# same results, but their partial answers are no longer stored, so every structure start checked during a session (new
# ones and every start loaded from disk) keeps one entry instead of four for as long as the server runs. Whether
# Structurify's checks are switched on or off does not matter.
# Measured: on Structurify's own class, 333 instead of 83 bytes kept per checked structure start (100,000 starts; a long
# pregeneration checks hundreds of thousands), and 1,272 instead of 564 bytes allocated for each first check; 60,004
# checks against the untransformed class with identical answers and maps, 8 threads, and 920,940 shadow comparisons.
structurify_check_memo_slim=true

# ---- Added in 1.0.30: Entity searches at block X 33.5 million no longer crash
# ----------------------------------------------------------------------------------------------
# [FIX] Vanilla: entity searches that reach block X 33,554,416 no longer throw
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.30
# Minecraft finds entities by reading its entity sections one x column at a time. For the column at block X
# 33,554,416..33,554,431 (and every 67,108,864 blocks from there, for example -33,554,448..-33,554,433) the end of that
# read overflows and the game throws "Start element is larger than end element", which crashes the thread that searched.
# Any entity search whose box touches that column does it, for example a runaway Relics essence or a mod's very large
# search box. That column is now read up to its last section; every other read is the original one, so every search
# that worked before gives the same result. Loading and unloading the entities of the chunk at x 2,097,151, z -1 had the
# same overflow and is fixed the same way.
# Measured: offline on the transformed class against the original, 90,000 random searches and 40,448 chunk reads:
# 29,013 searches crashed the original and now return the right sections, all others gave identical results. Ordinary
# searches cost the same as before (4.7 us, no allocation).
vanilla_entity_section_x_overflow=true

# ---- Added in 1.0.30: Block collision checks step through their cells without dividing
# ----------------------------------------------------------------------------------------------
# Vanilla: the cell walker of block collision checks counts instead of dividing
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.30
# Collision checks (for example the check for the block an entity stands on, which runs for moving entities every tick)
# walk the blocks of a small box with a cursor that worked out the x, y and z of every cell from a running number with
# two integer divisions. For every box it is used with (all three sizes positive, fewer than 2.1 billion cells) the cursor
# now steps x and carries into y and z: the same cells in the same order with the same values. Any other cursor runs the
# original code.
# Measured: offline on the transformed class against the original, 9,000 cursors (including zero, negative, huge and
# overflowing sizes) gave identical cells, 69.7 million checks. Per cell 4.7 -> 2.8 ns (two runs: 5.7 -> 4.3 ns), no
# allocation; a collision check of an entity at ground level 907 -> 826 ns.
vanilla_cursor_counters=true

# ---- Added in 1.0.31: JEI startup and recipe generation
# ----------------------------------------------------------------------------------------------
# JEI: find an existing brewing recipe by its ID during recipe generation
# Target: JEI 15.59.0.212 | side: CLIENT | since 1.0.31
# JEI checks new brewing recipes against those already found. A lookup belonging to that one build replaces
# repeated scans of the growing recipe set. The original set still controls membership and iteration order;
# recipe factories, ingredients and outputs are unchanged. Custom recipe classes, missing IDs and iterator
# mutations use the original scan. Nothing is cached across recipe builds or world joins.
# Measured: transformed-code checks compare identity and order during 20,000 random set mutations. In a focused
# worker measurement, 10,000 lookups over 5,000 recipes took 0.64 ms instead of 253 ms; this is not a whole-pack timing.
jei_brewing_lookup=true

# ----------------------------------------------------------------------------------------------
# JEI: read tooltip search words without regex matching or temporary split arrays
# Target: JEI 15.59.0.212 | side: CLIENT | since 1.0.31
# Formatting codes and spaces are scanned directly, producing the same search words in the same set order.
# Tooltip callbacks, component text and JEI's locale conversion stay on their original thread and run afresh.
# Dynamic tooltips, language changes, repeated spaces and leading empty words retain JEI's original behavior.
# Since 1.0.34 every tooltip line is read with the same type check as JEI's own method (1.0.33 refused a line of plain
# formatted text that JEI itself accepts).
# Measured: 20,000 randomized tooltip lists across four locales matched the original transformed JEI method.
# A focused worker measurement of 30,000 lines took 7.86 ms instead of 12.40 ms, not a whole-pack timing.
jei_tooltip_words=true

# ----------------------------------------------------------------------------------------------
# JEI: skip synchronization scans on its unobserved anvil and grindstone simulation menus
# Target: JEI 15.59.0.212 / Minecraft 1.20.1 | side: CLIENT | since 1.0.31
# Only JEI's own fake menus qualify, and only while they have no listeners or network synchronizer. Every recipe
# calculation and slot change still runs, with the anvil and grindstone events. What is skipped is the menu's change
# scan, which keeps a copy of every slot to notice changes. That scan was also where Forge first set up the item
# capabilities of JEI's input stacks (AttachCapabilitiesEvent); with the switch this happens when a stack is first used
# instead, as for any item. If an addon attaches an observer, the scan catches up first, so the observer starts from the
# current state. Without the switch it would also be told about changes left from anvil steps that end without a
# result, which vanilla does not scan. No mod in this pack observes these menus. Real player menus are unchanged;
# generated repair and enchantment recipes stay in JEI.
# Verified in the full-pack fixture with full-NBT recipe comparisons and a listener attached after a hidden update.
jei_hidden_menu_sync=true

# ---- Added in 1.0.32: world generation lookups outside chunk generation
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: climate samples outside chunk generation compute each two-dimensional part once per column
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.32
# Biome lookups made outside chunk generation (structure biome checks, Distant Horizons' distant terrain, surface biome
# lookups, /locate, the spawn search) use a climate sampler whose six density functions keep no cache at all, so one
# sample evaluates the same shift noises up to eight times and continentalness, erosion and ridges twice, and a sample
# one block higher in the same column repeats everything. Such a sampler now evaluates copies of its functions in which
# each part the world generator marks as two-dimensional (flat_cache / cache_2d) and that reads only x and z is
# remembered per thread for its column and shared by every function that reads it (since 1.0.34 a part that is a bare
# constant is left as it is, as the original sees it). A sampler is used this way only
# when all of its density functions are known vanilla (or reviewed) types and the copies return the same bits as the
# original at 256 test positions; its first 64 real samples are also compared with the original.
# Measured: on the transformed classes the samplers of all seven vanilla world types returned the same bits as the original
# in 1,294,477 checks (scattered positions, whole columns, extreme coordinates, two samplers interleaved, eight threads).
# Per sample of the vanilla overworld sampler: 5.0-5.6 -> 1.7-1.9 us at scattered positions, 5.0-5.5 -> 0.25-0.34 us down a
# column.
vanilla_climate_sample_xz_parts=true

# ----------------------------------------------------------------------------------------------
# Forge: mod network packets no longer leave a direct memory buffer behind on the client
# Target: Forge 47.4.16 (Minecraft 1.20.1) | side: BOTH | since 1.0.32
# Fix: when a client is connected to a server, every packet a mod sends through Forge's network channels is copied once
# for Forge's network event, and that copy, a pooled direct buffer, is never released, so memory outside the Java heap
# grows with every mod packet until the game is closed. The copy is now an ordinary heap buffer with the same bytes,
# positions and sizes, which the garbage collector frees like any other object. Singleplayer does not take this path.
# Forge 47.4.24 and newer make the same change; there this switch does not apply.
# Idea: Forge issue 10861 and the Forge 47.4.24 change log, idea text only
# Measured: on the transformed packet class, 20,000 packets (decoded from pooled direct network buffers and built from
# heap data, empty to 40 KB) gave the same bytes, positions, capacity and maximum capacity as the original copy. 5,000
# copies of 2 KB packets kept the way Forge's event keeps them: pooled direct memory +8 MiB with the original copy, +0
# with the switch.
forge_custom_payload_heap_copy=true

# ----------------------------------------------------------------------------------------------
# Vanilla: mob classes are prepared on a background thread before their first spawn
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts in the JVM that runs a server, incl. the integrated server) | since 1.0.35
# The first time each kind of mob spawns in a session, the server thread loads and verifies that mob's classes and its
# AI classes (goals, brain tasks, navigation) through Forge's class loader, which passes every class through the mod
# transformers. When night falls, many kinds of monsters spawn for the first time within seconds, and those first spawns
# arrive as lag spikes. Once a server has started, a background thread now loads and verifies the same classes: the
# entity classes the registered entity types construct, mod classes that extend the vanilla AI types, and the vanilla
# entity and path finding classes. Nothing is constructed and no static initializer runs, so the game later does exactly
# the same work, minus the loading. Mixin classes and classes built on client-only classes are left alone, and a class
# whose constructor names a client-only class is loaded but not verified. One log line reports how many classes and how
# long.
# Idea: our own (found while measuring night-time spawn lag with Mobtimizations installed, 2026-10-08)
# Measured: a 480-mod pack with a survival player at midnight and natural spawning, the first 400 ticks of the first night,
# three runs each way: time spent in ticks over 50 ms 337 -> 252 ms (Core Ultra 9 285K) and 562 -> 410 ms (Ryzen 9 3900X),
# worst tick 279 -> 241 ms and 395 -> 352 ms. About 7,100 classes in 1.9-3.2 s on the background thread; no added
# log lines.
vanilla_mob_class_warmup=true

# ---- Added in 1.0.36: Ground-height queries fill only the column they ask about
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: ground-height queries fill only the column they ask about
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.36
# A ground-height query (structure placement, spawn and flatness checks) builds a NoiseChunk for one column and
# walks it cell by cell from the top. For every cell the walk first fills the cell's terrain density cache for
# all 4 x 4 columns of the cell (64 positions per cell on this pack's Tectonic overworld, 128 on vanilla), then
# reads only the queried column's 4 or 8. The cache is now filled for that column only, with the same calls in
# the same order; the walk never reads the rest. Each world generator's density graph is checked once first: a
# density function that remembers the previous position it was asked for, a Cache2D that reads the height or
# interpolation state, a second cell cache, a density type the check does not know, or BetterEnd's slice filler
# keeps the original code. The first 256 queries of every world, then one in 4096, fill the whole cell as before
# and compare the column bit for bit (a difference switches the generator back to the original code).
# Idea: ours
# Measured (Core Ultra 9 285K, 10 interleaved rounds): the cell fill 5.3 -> 0.5 us and 2.6 KB -> 0.2 KB per cell
# on the pack's Tectonic overworld (vanilla 3.3 -> 0.4 us); whole Tectonic height queries -4.5% to -13% and
# about 0.37 MB less each (with the other world-generation switches on; -62% on grid queries together with
# vanilla_noise_corner_share). 23,772 comparisons on 8 rebuilt world generators (Tectonic, graveyard, Ad Astra
# Mars, Nether, Afterdark, vanilla), every heightmap type, whole columns, and 41,364 with the other switches on
# and off: 0 differences.
vanilla_noise_column_cell_fill=true

# ---- Added in 1.0.36: Neighbouring ground-height queries share their corner columns
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: neighbouring ground-height queries share their corner columns
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.36
# A ground-height query first computes the terrain's interpolated densities at the 4 corner columns around it
# over the full world height. Queries come in groups (structure checks ask two or more heightmap types at one
# spot, flatness checks ask every 4 blocks of a square), so the same corner columns are computed again and
# again. Each world generator now keeps a bounded table of corner columns (4,096 entries; about 6 KB each on
# Tectonic, 25 MB when full): a later query of the same corner copies the costly interpolated functions' columns
# and computes only the cheap ones. The values depend only on the world generator, the corner and the height,
# which is checked once per world generator: a nested interpolation, a Cache2D that reads the height or
# interpolation state, or a density function that remembers the previous position in the cell part keeps the
# original code. The first 256 reuses of every world, then one in 4096, are recomputed and compared bit for bit
# (a difference switches the table off).
# Idea: ours
# Measured (Core Ultra 9 285K, 10 interleaved rounds, the pack's Tectonic overworld, other world-generation
# switches on): height queries on 7 x 7 squares every 4 blocks 3.6 -> 1.8 ms (-49%), two heightmap types at one
# spot -16%, scattered single queries unchanged (+0.7%); together with vanilla_noise_column_cell_fill -62%,
# -23%, -6%. 32,164 comparisons on 8 rebuilt world generators and 3 refused ones, and 41,364 with the other
# switches on and off: 0 differences.
vanilla_noise_corner_share=true

# ---- Added in 1.0.36: Ground-height queries reuse what an earlier walk of the same column saw
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: ground-height queries reuse what an earlier walk of the same column saw
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.36
# A ground-height query walks the column's terrain from the top down to the first block its heightmap type
# counts (any block for WORLD_SURFACE, a solid one for OCEAN_FLOOR, ...). Structure checks ask the same spot for
# two types, and vanilla_noise_column_cache's shared table reuses an answer only for the same type, so the
# column was walked again over blocks the first walk had already produced. Each walk now notes where every
# heightmap type's rule first matched among the blocks it went through (a whole-column read notes all of them),
# and a later query of the same column with another type is answered from that note when its first match lies in
# the part already seen; otherwise it walks as before. A column's blocks are the same on every walk (what that
# table already relies on, with its checks) and each type's own rule decides, so the answer is the one the walk
# would give. Needs vanilla_noise_column_cache. The first 256 answers of every world, then one in 4096, are
# recomputed and compared (a difference switches only this off for that world).
# Idea: Lithium (documentation) and C2ME (issue #553), idea text only
# Measured (Ryzen 9 3900X, 10 interleaved rounds): two types at one spot -27.5% per query on the pack's Tectonic
# overworld (6.9 -> 5.0 ms), -44% on vanilla; surface type first -14% / -23%; a lone query +0.3% (the
# note-taking). 17,652 comparisons on 6 world generators (Tectonic, Nether, the End's empty columns ...): 0
# differences. Replaying the queries of a real generation run: 1,519 more queries answered, about 4.5% of
# ground-height query time.
vanilla_noise_column_summary=true

# ---- Added in 1.0.36: Nearest-structure searches walk only each ring's border
# ----------------------------------------------------------------------------------------------
# Vanilla: nearest-structure searches walk only each ring's border
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.36
# /locate, explorer and treasure maps, dolphins, eyes of ender and mods' structure searches look for the nearest
# structure ring by ring. For each ring vanilla loops over the whole square inside it and skips every cell that
# is not on the border, so ring 100 walks 40,401 cells to test 800. The border cells are now visited directly,
# in the same order, with the same calls for each; the first structure found is returned as before.
# Idea: Paper (nearest-structure search), idea text only
# Measured (Core Ultra 9 285K): 6,000 searches with 1,026,567 candidate chunks identical and in the same order;
# a search out to ring 32 -39% (367 -> 225 us), to ring 100 -30% (3.1 -> 2.2 ms) with no structure found.
vanilla_structure_ring_search=true

# ---- Added in 1.0.36: Climate search trees let a closed world go
# ----------------------------------------------------------------------------------------------
# Climate search trees let a closed world go
# Target: Minecraft (biome lookups and world generation) 1.20.1 | side: BOTH | since 1.0.36
# Fix: every biome lookup searches a climate tree (Climate.RTree), and each tree remembers, per thread, the last
# leaf it found. The thread keeps that leaf strongly, and through its biome the leaf reaches the world's whole
# world-generation registry set. The game's worker threads (Worker-Main, the common pool, C2ME's and Distant
# Horizons' pools) outlive the world, so after a singleplayer world was closed they kept its registries in
# memory until each happened to search again. Each tree's slot now keeps the leaf through a weak reference. A
# tree holds all of its leaves, so while it can be searched the reference is never cleared and every search
# starts from exactly the leaf vanilla's slot holds: the same biomes, ties included. Once the tree is gone
# nothing can search it, and the leaf, its biome and the registries can be freed.
# Idea: TickMender ("stoppedServerBiomeSearchCache"), idea text only
# Measured (Core Ultra 9 285K): 3 worlds opened and closed with lookups on 8 long-lived threads plus the common
# pool: 0 of 3 still in memory after full GCs (vanilla 2 of 3, 1.0.35 3 of 3); 1,680,014 checks, 0 differences
# against vanilla's slot under constant GC (7 point sets incl. exact ties; shadow 1,679,958 checks, 0
# mismatches); lookups in chunk-section order: +1.9 bytes and -3% to +9% (median +3%) time per tree search;
# random targets: time within noise, +29.7 bytes.
vanilla_climate_last_result_weak=true

# ---- Added in 1.0.36: basalt columns test vanilla's rule before structure guards
# ----------------------------------------------------------------------------------------------
# Basalt columns: vanilla's placement test runs before the structure guards
# Target: Minecraft 1.20.1 (Forge 47.4.16) with Cataclysm, Repurposed Structures, YUNG's Better Dungeons, YUNG's Better
# Nether Fortresses, Bygone Nether, Moog's Structure Lib, Nether Expansion | side: BOTH (acts on the server) | since 1.0.36
# In basalt deltas the column search asks "can basalt go here?" at every step down. Seven mods each check first
# whether the spot is inside one of their structures (chunk, registry and structure lookups), although vanilla's
# own two-block test already rejects most spots. The guards can only ever say no, so vanilla's test now runs
# first and, when it says no, the answer is no without the guards; when it says yes, everything runs as before.
# Same basalt everywhere. The switch checks once that every guard in the game is one it knows and steps aside
# otherwise.
# Idea: Collections Of Optimizations (cataclysm.basaltPrecheck), idea text only, widened to all seven guards
# Measured: 200,000 calls identical (incl. 13,147 where vanilla says yes and a guard says no), shadow 177,544 / 0.
# Per call 50.5 ns and 93.5 B -> 42.6 ns and 59.8 B as a lower bound (outside a world-generation region the guards
# leave early; in real generation each one also does its lookups) (Core Ultra 9 285K).
basalt_guards_vanilla_first=true

# ---- Added in 1.0.36: ElysiumAPI's biome replacer check without throwaway objects
# ----------------------------------------------------------------------------------------------
# ElysiumAPI: the biome replacer check runs without throwaway objects
# Target: ElysiumAPI 1.1.3 | side: BOTH | since 1.0.36
# ElysiumAPI checks every biome lookup of a world generator for biome replacements. Each lookup asked the mod
# loader whether TerraBlender is installed, copied the data-driven replacer list into a new list, and created a
# HashSet and a new random generator (whose constructor touches one counter shared by every thread). Biome
# filling and Distant Horizons' world generation make thousands of lookups per chunk. The check now asks about
# TerraBlender once, reads the replacer list once per loaded world, and computes each seeded random number
# directly with java.util.Random's own formula; the replacers, their order, the seeds and the chosen biomes are
# unchanged, and the biome is still computed twice as before. ElysiumAPI is GPL-2.0 / LGPL-2.1; this is a
# modified version of its handler.
# Idea: ours
# Measured (Core Ultra 9 285K, 15 interleaved rounds): 860 -> 300 bytes per biome lookup with replacers (848 ->
# 352 without), time -2% (-8% where the climate sample is cheap); 120,000 lookups and 2,000,000 random numbers
# identical.
elysium_lean_replacer=true

# ---- Added in 1.0.36: Chunk saving and loading reuse each block's state codec
# ----------------------------------------------------------------------------------------------
# Vanilla: chunk saving and loading reuse each block's state codec
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH | since 1.0.36
# Every block state written to or read from a chunk section's palette goes through BlockState.CODEC, which builds a
# new small codec for that block each time (about ten objects, four of them with their own maps). The codec it builds
# depends only on the block's default state, so the one built first is now kept for each block and handed back while
# the block's default state is the same object. Saved chunks, loaded states and error messages stay exactly the same.
# Idea: C2ME, Gale, Leaves and Bellows (faster chunk serialization), idea text only
# Measured: 10,000 real chunks of a 480-mod pack (2.0 million palette entries) and 600 damaged palettes encoded and
# decoded both ways: identical NBT bytes, states and errors. 11-13% less memory allocated per block state encoded or
# decoded (276-317 bytes); time unchanged within noise (Core Ultra 9 285K).
vanilla_state_codec_dispatch_memo=true

# ---- Added in 1.0.36: Chunk saving and loading build the biome codec once
# ----------------------------------------------------------------------------------------------
# Vanilla: chunk saving and loading build the biome codec once
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH | since 1.0.36
# Every chunk written or read first builds the complete codec for its biome sections (dozens of objects). That codec
# only refers to the biome registry, which stays the same while the world is open, so it is now built once and reused
# while the same registry is asked again and its plains biome entry is the same object.
# Idea: C2ME, Gale and Leaves (faster chunk serialization), idea text only
# Measured: about 1.2 us and 6.4 KB less per chunk written or read (Core Ultra 9 285K); 10,000 real chunks and 200
# damaged biome palettes gave identical NBT bytes, biomes and errors.
vanilla_chunk_biome_codec_memo=true

# ---- Added in 1.0.36: Chunk palettes are written directly
# ----------------------------------------------------------------------------------------------
# Vanilla: chunk palettes are written directly
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH | since 1.0.36
# When a chunk is saved, each section's block palette and biome palette are converted to NBT through Minecraft's
# generic codec system, which creates many short-lived helper objects per palette entry. The same NBT is now built
# directly. Each block state and biome is first checked once against the regular codec's real output (same tags, same
# key order, same values); anything that does not match exactly, and any entry the codec reports an error for, keeps
# going through the regular codec. The biome part works together with the switch above.
# Idea: C2ME ("reduced allocation chunk serializer"), Gale and Leaves ("Faster chunk serialization"), Bellows, idea
# text only
# Measured: block section 930 -> 325 ns and 4.7 -> 1.4 KB for everything after the palette packing, biome section
# 430 -> 250 ns and 2.2 -> 1.2 KB: about 37 us and 210 KB less per saved chunk of 48 sections (Core Ultra 9 285K).
# 10,000 real chunks (960,000 section palettes, 99.9% written directly) and 900 synthetic palettes of every kind gave
# identical NBT bytes, also after the same later edits.
vanilla_chunk_palette_direct_nbt=true

# ---- Added in 1.0.36: level.dat saves reuse unchanged registry snapshots
# ----------------------------------------------------------------------------------------------
# Forge: level.dat saves reuse unchanged registry snapshots
# Target: Forge 47.4.16 | side: BOTH (every world save of a server, incl. the integrated one) | since 1.0.36
# Every world save writes Forge's registry id table into level.dat, and Forge first rebuilds a sorted snapshot
# of every saved registry (about 65,000 entries in a 480-mod pack) although it almost never changes between
# saves. Each registry now compares everything that snapshot is made from (every id with its name, in order, the
# aliases, the blocked ids and the overrides) with the last save; when all of it is equal, the snapshot built
# then is used again, and Forge's own code still writes it into level.dat. Any change to a registry rebuilds its
# snapshot on that save, so the file comes out exactly the same. Snapshots sent to joining players are always
# built fresh.
# Idea: Shinoyuki-BetterAutoSave (cacheRegistrySnapshot), idea text only; unlike it, every input is compared on every
# save, so there is no window in which a changed registry could be written from an old snapshot
# Measured: the registry part of a level.dat save 95 -> 17 ms (Core Ultra 9 285K, the registries of a 480-mod world);
# 400 save pairs with random registry changes (added, removed, swapped and moved ids, renames, aliases, blocked ids,
# overrides) gave byte-identical level.dat data, and every changed registry was rebuilt.
forge_registry_snapshot_reuse=true

# ---- Added in 1.0.36: Loaded structure templates are looked up without the cache lock
# ----------------------------------------------------------------------------------------------
# Vanilla: loaded structure templates are looked up without the cache lock
# Target: Minecraft 1.20.1 (Forge 47.4.16), with or without ModernFix 5.27.77 | side: BOTH (the server's world
# generation, incl. the integrated server) | since 1.0.36
# Every structure piece placed during world generation asks the structure template manager for its template. With
# ModernFix's memory-saving template cache (on by default), each of those lookups takes one of four cache locks, even
# when the template is long loaded, and while one thread loads a new template from disk, lookups of other templates
# behind the same lock wait for it. A template that is already loaded is now returned directly; anything not loaded
# (or released by the memory-saving cache) is loaded exactly as before, once, under the same lock. Applies only to the
# two cache kinds whose behaviour is known (vanilla's and ModernFix's); a mod that installs another one keeps the
# original lookup.
# Idea: TickMender (structureTemplateCacheHit), idea text only
# Measured: eight world-generation threads, already loaded templates: 28.6 -> 3.2 ms per 160,000 lookups, time spent
# waiting for the lock 164 -> 0 ms; with 2% of lookups loading a template: 758 -> 309 ms, waiting 4.9 -> 1.4 s
# (Core Ultra 9 285K). A pack server's generation threads waited 3.3 s per 19 s of warm-up on this lock.
vanilla_structure_template_hits=true

# ---- Added in 1.0.36: Fix: chunks that stop ticking are forgotten by the simulation-distance tracker
# ----------------------------------------------------------------------------------------------
# Vanilla: chunks that stop ticking are forgotten by the simulation-distance tracker [FIX]
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (every server level, incl. the integrated server) | since 1.0.36
# Fix: each dimension remembers how close every chunk is to a player's simulation distance. When a chunk leaves that
# distance, Minecraft writes the "not ticking" level for it instead of forgetting it, so every chunk any player ever
# came near stays in that table for as long as the dimension is loaded, and the table only grows. Such a chunk is now
# removed; the table answers "not ticking" for chunks it does not hold, so every answer stays the same and only the
# memory goes. Bons' own block and entity ticking-range memos, which watch the same table, work as before.
# Idea: Saturn ("Ticking Tracker memory leak fix"), idea text only
# Measured: after a 4,000-chunk walk at simulation distance 8 the table holds 361 instead of 55,917 chunks
# (about 5 KB instead of 1.2 MB per walked player and dimension, growing with every new chunk visited); 3,000
# random ticket changes gave identical answers for every chunk and identical memo counters.
vanilla_ticking_tracker_prune=true

# ---- Added in 1.0.36: Inventory changes test only the advancement conditions that can match
# ----------------------------------------------------------------------------------------------
# Vanilla: inventory changes test only the advancement conditions that can match
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (the server, incl. the integrated server) | since 1.0.36
# Every time a slot of a player's inventory changes (picking up items, every slot a container moves), Minecraft
# tests every unfinished "has item" advancement condition of that player one by one; this pack has about 21,700
# of them (recipe advancements included). Each player now keeps an index: conditions that only ask for one of a
# fixed list of items are filed under those items, so only the conditions filed under the changed item, and all
# other conditions, are tested, in exactly the order Minecraft uses. For the conditions left out Minecraft's
# test can only answer "no" without doing anything else, so grants, their order and everything else stay the
# same. The index is rebuilt whenever the player's conditions change. It steps aside if another mod changes
# these classes (BCLib's shears rule and Tinkers' Jewelry's enchantment hook are handled).
# Idea: InventoryAdvancementAccelerator, idea text only (exact form: no sampling, no periodic full checks)
# Measured: one inventory change with all 21,600 conditions 930 -> 135 us, with 2,300 (a player's typical count here)
# 49 -> 14 us; a 36-slot container opening 33.6 -> 5.0 ms and 1.7 -> 0.5 ms (Core Ultra 9 285K). 20,000 replayed
# inventory changes over the pack's own conditions gave the same 1.94 million grants in the same order.
vanilla_inventory_trigger_index=true

# ---- Added in 1.0.36: Faster entity selectors that name one entity type
# ----------------------------------------------------------------------------------------------
# Vanilla: data pack selectors with one entity type look only at that type's entities
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (server levels, incl. the integrated server) | since 1.0.36
# Speed: a selector such as @e[type=armor_stand,tag=...] without a distance or box makes Minecraft check every loaded
# entity of every dimension, one by one, to find the few of that type. The selector now visits only the entities of
# that type (through the same per-type list vanilla_selector_type_index keeps), in the same order, and runs the same
# checks on each, so the selected entities, their order and the limit are unchanged.
# Needs vanilla_selector_type_index for the speed-up (without it the selector runs exactly as vanilla).
# Idea: Bellows ("entities are cached based on their type"), idea text only
# Measured: with 1,800 loaded entities one such scan took 16-22 microseconds before and 1-4 after (5 to 16 times
# faster), with 4,800 entities 50-66 before and 2.5-10 after; this pack runs about five of them every tick
# (Forgotten Ruins, Blossom, Dungeons and Taverns, Reworked Phantoms) and Scorched runs ten more in its tick clock.
vanilla_selector_single_type=true

# ---- Added in 1.0.36: Entity selector results without a stream stage
# ----------------------------------------------------------------------------------------------
# Vanilla: entity selector results are filtered without building a stream stage
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (server levels, incl. the integrated server) | since 1.0.36
# Memory: every command that takes entities (execute as @e[...], kill, tp, data, ...) passes the selector's result
# through a stream filter that drops entities of disabled experimental features. The same check now runs in a plain
# loop over the same list, and the result is the same unmodifiable list with the same entities in the same order.
# Idea: Paper ("Remove streams from hot code"), title only
# Measured: about 160 to 180 bytes less garbage per selector use (4 to 8 KB less for results of 600 to 1,600
# entities); the time is unchanged within measurement noise.
vanilla_selector_find_loop=true

# ---- Added in 1.0.36: Entity selectors with a tag look only at the entities holding that tag
# ----------------------------------------------------------------------------------------------
# Vanilla: data pack selectors with a tag= look only at the entities holding that tag
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (server levels, incl. the integrated server) | since 1.0.36
# Speed: a selector such as @e[tag=ancient_golem] without a distance or box makes Minecraft check every loaded
# entity of every dimension for the tag. Each dimension now keeps, for the tags such selectors ask for, the list
# of entities holding the tag, kept up to date by the entities' own tag sets, and the selector visits only those
# (plus the entities of classes that change how they are checked), in the same order and with the same checks,
# so the selected entities, their order and the limit are unchanged. When the selector also names a type and
# that type's list is shorter, the type list is used instead. Needs vanilla_selector_type_index (without it the
# selector runs exactly as vanilla).
# Idea: Bellows ("entities are cached based on their type"), idea text only
# Measured: with 1,800 loaded entities a scan for a rare tag took about 100 microseconds before and 8-10 after
# (11 to 13 times faster; for a tag a quarter of all entities hold, 3 times), with 4,800 entities about 600
# before and 24-28 after; this pack runs about 20 such scans every tick (Forgotten Ruins, Moonlit Monoliths,
# Blossom). Adding or removing a tag costs about 25 nanoseconds more while a list for that tag exists.
vanilla_selector_tag_index=true

# ---- Added in 1.0.36: the entity-outline overlay is not drawn in frames where nothing was outlined
# ----------------------------------------------------------------------------------------------
# Vanilla: the full-screen entity-outline overlay is left out of frames in which nothing was outlined
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: CLIENT | since 1.0.36
# Every frame Minecraft blends its entity-outline image (glowing mobs, spectral arrows, mods' outline effects)
# over the whole screen with one full-screen draw, also when nothing glows: the image was cleared to fully
# transparent earlier in the frame, and blending a fully transparent image changes no pixel. The switch watches
# the image after that clear: any bind of its framebuffer or its texture marks it as used. When the overlay
# comes and the image was not used, the overlay runs as before (shader, blend state, vertex upload) except for
# its one draw call, so the GL state and every pixel on screen are what they would have been.
# Idea: Sodium (PR #2679 description), idea text only
# Measured: offline, 269,211 overlays over 5,000 random frame sequences were skipped exactly where the image was
# untouched (67,510) and drawn everywhere else, 0 differences; the blend leaves all 65,536 colour/alpha pairs
# unchanged when the image is transparent. In game at 3840 x 2066 on an RTX 3080: 58 -> 4 us of GPU time per
# frame (what is left is the timer itself); 11,984 frames checked in game, 0 differences.
vanilla_entity_outline_composite_skip=true

# ---- Added in 1.0.36: item renderers built once per item instead of once per draw
