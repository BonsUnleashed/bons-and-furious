# ---- Added in 1.0.30: Create contraption collision boxes in one pass
# ----------------------------------------------------------------------------------------------
# Create contraption collision boxes in one pass
# Target: Create 6.0.8 | side: BOTH | since 1.0.30
# When a contraption or train is assembled, loaded or changes a block, Create builds its collision boxes in the
# background by joining every block's shape into one shape, block after block, and each join rebuilds everything joined
# so far: a few hundred blocks take tenths of a second and hundreds of megabytes of garbage. The switch collects the same
# block shapes and builds the combined shape's boxes in one pass: the same boxes in the same order, to the last bit.
# Where Minecraft's joining could round or merge nearly equal coordinates, or for shape types it does not know, Create's
# own joining runs instead.
# Idea: Create issue #6902 and Create 6.0.9's changelog (1.21.1), backported by Create Optimized Trains; idea text only.
# This is not Create 6.0.10's later collision change.
# Measured: a 200-block carriage 31.3 -> 0.22 ms and 13.2 -> 0.11 MB, a 400-block carriage 369 -> 1.3 ms and
# 108 -> 0.25 MB, 5,000 plain blocks 150 -> 1.5 ms; 10,349 shape lists and 600 real contraptions identical, also with
# Radium's shape code
create_collision_single_pass=true

