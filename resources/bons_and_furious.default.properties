# ---- Added in 1.0.36: Distant Horizons LOD saving without a lock per byte
# ----------------------------------------------------------------------------------------------
# Distant Horizons LOD saving without a lock per byte
# Target: Distant Horizons 3.3.2 | side: BOTH | since 1.0.36
# Every LOD blob Distant Horizons saves (column data, edges, generation steps, id map) is written into a plain
# java.io.ByteArrayOutputStream, mostly one varint byte at a time, and every single write takes that stream's monitor.
# The stream DH creates is now a ByteArrayOutputStream subclass with the same buffer, growth and bounds rules but no
# monitor. DH writes and closes it on one thread inside one method and nothing else touches it, so the saved bytes are
# the same bytes. The saving-side partner of distanthorizons_unlocked_byte_stream.
# Idea: ours
# Measured: DH's own DTO building on 840 real LOD sections of a pack world, 11 interleaved rounds (Core Ultra 9 285K):
# 1240 -> 919 us per section with Z_STD_BLOCK (-26%; a second run on a busier worker 2502 -> 2186 us), 1050 -> 750 us
# uncompressed (-29%); every blob byte identical in all four compression modes (2.24 million checks, 0 differences)
distanthorizons_unlocked_output_stream=true

# ---- Added in 1.0.36: Distant Horizons tint blending without re-deriving positions
# ----------------------------------------------------------------------------------------------
# Distant Horizons tint blending without re-deriving positions
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.36
# For the nearest LODs Distant Horizons blends each tinted point's biome colour over its 49 neighbouring columns, and
# every one of those lookups rebuilds the same position maths (packed section positions, four corner checks, a new
# block position object, the relative column). The lookup now does the data-source part once per tinted point with
# DH's own methods and the per-block part with DH's exact integer arithmetic, then reads and scans the column exactly
# as DH does, so every answer is DH's answer; unusual detail levels go to DH's own method.
# Idea: ours
# Measured: 1.66 million lookups at every detail level and coordinate edge plus 28,800 tinted points, 0 differences;
# 105 -> 77 ns per lookup (-27%) and DH's tryGetBlockTint 5.2 -> 4.3 us per tinted point (-18%) (Core Ultra 9 285K)
distanthorizons_tint_neighbour_index=true

# ---- Added in 1.0.36: Fix: Embeddium chunk mesh buffers grow by the right amount
# ----------------------------------------------------------------------------------------------
# Embeddium: chunk mesh buffers grow by the amount they need instead of the vertex size squared [FIX]
# Target: Embeddium 0.3.31 | side: CLIENT | since 1.0.36
# Fix: when one chunk section produces more than 131,072 vertices of one kind (dense foliage, big modded blocks),
# Embeddium's mesh builder grows its buffer, but the requested size is multiplied by the vertex size twice: the buffer
# jumps from 2.6 MB to 105 MB (vanilla vertex layout) or from 3.7 MB to 206 MB (Oculus layout) of native memory in one
# step, per meshing thread (Sodium fixed this in 0.5.12 after an out-of-memory report). The switch passes the size in
# vertices, so the buffer doubles as intended; the mesh bytes are identical.
# Idea: Sodium 0.5.12 changelog, idea text only
# Measured: 640,000 vertices pushed into one builder: identical mesh bytes; one growth to 104,857,600 bytes before,
# three doublings to 20,971,520 bytes after (vanilla layout); 205,520,896 -> 29,360,128 bytes with the Oculus layout
# (Core Ultra 9 285K).
embeddium_mesh_buffer_growth_fix=true

# ---- Added in 1.0.36: Oculus entity vertices are written in one step
# ----------------------------------------------------------------------------------------------
# Oculus: entity, item and block-entity vertices in Oculus's shader vertex layout are written in one step
# Target: Oculus 1.8.0 + Embeddium 0.3.31 | side: CLIENT | since 1.0.36
# With a shader pack on, Oculus extends Minecraft's entity vertex layout to 56 bytes, so Minecraft's fast vertex
# write no longer applies: every entity, item and block-entity vertex drawn through a BufferBuilder goes element
# by element (position, colour, texture, overlay, light, normal), each step a call through interfaces that has
# many implementations in a big pack. For exactly that layout, at the start of a vertex, the switch writes the
# same values at the same offsets directly, with the same element steps, and then finishes the vertex as before,
# so Oculus's normal, tangent and id data and every other mod's end-of-vertex hook still run and the buffer
# bytes are identical; any other layout or state keeps the old path.
# Idea: ours
# Measured: one arm per JVM with the call sites already shared as in game, 8 JVM pairs: 61.5 -> 56.8 ns per
# vertex (faster in 8 of 8), 0 bytes either way; both arms interleaved in one JVM: 105.7 -> 63.8 ns and 48 -> 0
# bytes per vertex (Ryzen 9 3900X). 400 random buffer sessions, 603,781 operations compared byte for byte with
# the old path: 0 differences (Core Ultra 9 285K and Ryzen 9 3900X).
oculus_entity_vertex_direct=true

# ---- Added in 1.0.36: Fix: text under shaders gets the normals and tangents of its own vertices
# ----------------------------------------------------------------------------------------------
# Oculus: text drawn through Embeddium under a shader pack gets the normal, tangent and mid-texture data of its own vertices [FIX]
# Target: Oculus 1.8.0 (+ Embeddium 0.3.31) | side: CLIENT | since 1.0.36
# Fix: with a shader pack on, Oculus adds a normal, a tangent and the glyph's mid-texture coordinate to every
# text vertex (name tags, signs, map labels). On Embeddium's fast text path Oculus computes them from the bytes
# after the glyph quad and writes them into vertices 2-4 and into the slot after the quad, while vertex 1 keeps
# whatever was in the buffer (Embeddium reserves that slot, so nothing outside the buffer is written). The
# switch hands Oculus the quad's own last vertex for reading and writing, so all four vertices get exactly the
# bytes Oculus's own BufferBuilder path writes for the same glyph; positions, colours, texture coordinates,
# light and ids are untouched.
# Idea: Oculus PR #760 (merged, unreleased), idea text only
# Measured: 20,000 random glyph quads: all 20,000 differed from Oculus's own path before (25.9 bytes per quad,
# and every quad wrote into the next vertex slot), 0 after (Core Ultra 9 285K).
oculus_glyph_extended_vertex_fix=true

# ---- Added in 1.0.36: EMF custom parts skip the empty hand-attachment walk
# ----------------------------------------------------------------------------------------------
# Entity Model Features: custom model parts skip the hand-attachment walk when nothing below them has an attachment
# Target: Entity Model Features 3.2.4 (+ Embeddium 0.3.31) | side: CLIENT | since 1.0.36
# Before it draws, every custom model part (Fresh Animations and other EMF packs) walks its whole subtree
# looking for hand-item attachments: a pose push, a move and turn, the same walk for each child with a new
# lambda, a pose pop. Each part below repeats this for its own subtree, in every pass that draws the mob (main,
# shadow, emissive). When no part below has an attachment, the walk changes nothing but pushing and popping
# poses in pairs, so the switch skips it. It checks that per call (a plain PoseStack with Embeddium's pose cache
# off, plain EMF parts without attachments all the way down) and walks as before in every other case.
# Idea: ours
# Measured: all 128 Fresh Animations 1.10.4 models, 20 passes each per round, 31 rounds: 1,785 ns and 7,508
# bytes per model pass before, 424 ns and 32 bytes after; 20,279 walks compared with the real walk, 0
# differences (Core Ultra 9 285K).
emf_arm_walk_gate=true

# ---- Added in 1.0.36: EMF animation variables are read without boxing their default
# ----------------------------------------------------------------------------------------------
# Entity Model Features: animation variables are read without a new Float for the default value
# Target: Entity Model Features 3.2.4 | side: CLIENT | since 1.0.36
# EMF reads an entity's animation variable with getOrDefault(name, default), which wraps the default value in a new
# Float on every read, whether the variable is stored or not, and animation packs read these many times per mob per
# frame. The switch looks the name up with one shared marker object as the default and returns the stored number, or
# the default when the marker comes back. Every result is the same, including a stored null (the same exception), and
# maps other than EMF's HashMap keep the original call.
# Idea: AzureLib changelog, idea text only
# Measured: 2,000,000 reads per round, 31 rounds: 8.7 -> 4.8 ns and 16 -> 0 bytes per read for stored variables,
# 8.1 -> 4.2 ns and 16 -> 0 bytes for missing ones; 48,000 reads compared over four map kinds, 0 differences
# (Core Ultra 9 285K).
emf_variable_default_unboxed=true

# ---- Added in 1.0.36: Fix: EMF forgets mobs whose anger has ended
# ----------------------------------------------------------------------------------------------
# Entity Model Features: the anger-time table forgets mobs whose anger ended [FIX]
# Target: Entity Model Features 3.2.4 | side: CLIENT | since 1.0.36
# Fix: EMF remembers the highest anger time it has seen for each mob (by UUID) in a table that lives until the
# game closes, so anger animations can count down. When a mob is calm it stores 0 for that mob instead of
# removing it, so every neutral mob ever drawn with a model that uses anger (wolves, bees, piglins, endermen,
# many modded mobs) keeps an entry forever. The switch removes the entry instead; every read of the table treats
# a missing mob as 0, so every animation value stays the same and only the memory goes.
# Idea: Collections Of Optimizations, idea text only
# Measured: 10,000 calm neutral mobs drawn once leave 10,000 entries before and 0 after; 200 random sequences gave
# 80,000 identical anger-time results (Core Ultra 9 285K).
emf_anger_map_prune=true

# ---- Added in 1.0.36: Cataclysm capabilities kept on the entity
# ----------------------------------------------------------------------------------------------
# Cataclysm capabilities kept on the entity
# Target: L_Ender's Cataclysm 3.16 | side: BOTH | since 1.0.36
# Cataclysm asks every living entity for its hook, charge and render-rush capabilities every tick on both sides, each
# time walking the entity's capability providers twice (0.29-0.74% of the integrated server thread, measured with
# ModernFix's faster capabilities). The first answer is now kept on the entity with the provider set it came from, in
# one table shared by every mod-private capability, and handed out while the entity's capabilities are valid, the
# provider set is the same object and the answer has not been invalidated: the very object the walk returns. Mod
# entities with their own getCapability, and anything else, ask the entity as before.
# Idea: Collections Of Optimizations (cataclysm.cacheCapabilities), idea text only; shared token table: ours
# Measured: 68.8 -> 37.8 ns per lookup with 25 capability providers and ModernFix's dispatcher, no change with
# Cataclysm's providers first; 241,382 checks identical, shadow 64,263 checks, 0 mismatches (Core Ultra 9 285K).
cataclysm_capability_handles=true

