# ---- Added in 1.0.16: vanilla world generation
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: NoiseChunk's second density-graph pass reuses the first pass's result
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.16
# Every NoiseChunk (one per generated chunk and one per single-column height query; structure placement
# issues those constantly) maps the density graph twice. The second pass walks the already mapped final density again:
# every record and spline is rebuilt, hashed down its whole subtree and looked up in the wrap table, only to get back
# the object the first pass made. The patch returns a node unchanged exactly when that lookup would return that same
# object and runs the original code for everything else (new nodes, other mods' density functions). The density graph,
# caches and wrap table come out the same, object for object; noise math is untouched. The JVM flag
# -Dbons_and_furious.finalDensityReuse=false is also honoured.
# Measured: native full-pack fixture, 22 noise dimensions. Every reused node was checked against vanilla re-mapping the
# same object in the same NoiseChunk (overworld 4,656, nether 2,028, End 264 and 19 modded dimensions): always the
# identical object, wrap table unchanged. Base columns, all six heightmaps and complete noise volumes (1.08 M overworld,
# 393 K nether, 393 K End blocks) identical with the switch off and on, including parallel queries. Overworld, ABBA,
# per item: NoiseChunk construction 10.35 -> 0.89 ms CPU (-91%) and 8.4 -> 0.40 MB allocated; one-column height query
# 17.7 -> 8.3 ms (-53%) and 9.3 -> 1.3 MB; full-chunk noise fill 77 -> 69 ms (-10%). Focused measurements, not a
# whole-server generation speed or TPS figure.
# With a mod that changes the same NoiseChunk call (FastChunkGen 0.3 with its density options on, the c2meforge port of
# C2ME): this switch steps aside and that mod's version runs. One log line says so. Bye Pregen 1.1.2.4 also hooks that
# call but hands this switch's visitor on (checked for that version): the switch keeps working next to it.
# With Collections Of Optimizations (tested 4.6): its option vanilla.reuseNoiseChunkDensityGraph reuses the same
# density graph. While that option is on, this switch steps aside; otherwise this switch applies and leaves COO's copy
# out. One log line says which (since 1.0.36).
terrain_final_density_reuse=true

# ---- Added in 1.0.18: vanilla world generation
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: NoiseChunks share their preliminary surface estimates
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.18
# Aquifers (and surface rules) ask each NoiseChunk for a preliminary surface estimate of a column: a scan of the
# initial density from the top of the world down in cell-height steps. Every NoiseChunk (one per generated chunk and one
# per single-column height query; structure placement issues those constantly) keeps its own table, so while generating
# this pack the same column was scanned about 25 times. This shares the results between NoiseChunks of the same world
# generator in a bounded table (2^16 entries per world) and runs the original scan on a miss. It only shares where the
# result cannot depend on the NoiseChunk: no terrain blending, only vanilla density function types (since 1.0.34 also
# inside a weird_scaled_sampler's input), no beardifier (each chunk's own; refused since 1.0.34), and every
# flat_cache / cache_2d reads x and z only; each world generator is audited once and otherwise keeps the original code
# (in this pack the Nether is kept, its router has a cache_2d that reads y). Surface estimates, aquifers and terrain come
# out the same; noise math is untouched. The JVM flag -Dbons_and_furious.surfaceEstimateShare=false is also honoured.
# Measured: native full-pack fixture, 22 noise dimensions; sharing is active in 3 (overworld, afterdark, graveyard:past) and
# the rest keep the original code (aquifers off, or the audit refused: the Nether's cache_2d reads y). A value served
# from the shared table always equalled a fresh vanilla scan by a differently placed NoiseChunk, and complete noise
# volumes (1.08 M overworld, 393 K nether and End blocks), base columns and all six heightmaps were identical with
# sharing on and off, including parallel queries. Overworld generation of 144 chunks: 349,843 surface scans became
# 16,488 (95.3% served from the table); wall time 161.8 s -> 88.5 s on a shared machine. Clustered height queries
# (structure placement), ABBA thread CPU: -44 to -45%. Chunk noise fills alone: unchanged. Focused measurements, not a
# TPS figure.
# With Collections Of Optimizations (tested 4.6): its option vanilla.shareSurfaceEstimates shares the same estimates.
# While that option is on, this switch steps aside; otherwise this switch applies and leaves COO's copy out. One log
# line says which (since 1.0.36).
terrain_surface_estimate_share=true

# ---- Added in 1.0.19: Spawn
# ----------------------------------------------------------------------------------------------
# Spawn zombified flowers: the ground search stops at the bottom of the world  [FIX]
# Target: Spawn 4.0.7-1.20.1 | side: BOTH | since 1.0.19
# ZombifiedFlowerFeature walks down "while the block is replaceable" to find ground, with no lower limit. Inside Distant
# Horizons' generation region every block below the loaded terrain reads as air, so the walk ran to y -1,000,001 (about a
# million block reads and a new Vec3i each step) until DH's bounds check threw, aborting that chunk's whole feature step.
# The loop now also stops at the level's minimum build height. In normal generation bedrock or ground always stops it first,
# so the placed flowers are the same; in an empty column it ends at the floor and places nothing, as the original would
# have if it had terminated.
# Measured: native full-pack server fixture, 2026-09-28. Six seeded placements of spawn:patch_zombified_flower on a grass
# platform produced the identical 18 flower blocks with the switch on and off (same block-state hash). Over the End's empty
# void, where the original walk never ends, the patched feature reached the floor and returned in 476 ms (including
# generating that chunk); at the floor it finds no dirt, so it places nothing there.
spawn_zombified_flower_floor=true

# ---- Added in 1.0.19: Better Combat
# ----------------------------------------------------------------------------------------------
# Better Combat: skip the two-handed weapon lookups on every non-offhand equipment read
# Target: Better Combat 1.8.6+1.20.1-forge | side: BOTH | since 1.0.19
# Better Combat's HEAD hook on Player.getItemBySlot looks up the weapon attributes of both hands (registry key, map lookup
# and, for items with NBT, a JSON parse) on every call, for every slot, and only then checks whether the slot is the offhand -
# the only slot it ever changes. The patch returns at once for the other slots; the offhand path is untouched.
# Measured: native full-pack server fixture, 2026-09-28, a player holding a two-handed weapon with a shield in the offhand
# (and a one-handed one): every equipment slot read the same with the switch on and off - the shield still hidden behind
# the two-handed weapon, still visible behind the one-handed one. A non-offhand getItemBySlot call took about 6 ns with the
# switch on vs about 61 ns off (10 million calls each).
bettercombat_offhand_lookup=true

# ---- Added in 1.0.21: Distant Horizons
# ----------------------------------------------------------------------------------------------
# Distant Horizons: LOD buffer render parameters reuse their matrix inverses within a pass
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.21
# For every LOD buffer it draws, DH updates one shared DhApiBeforeBufferRenderEvent parameter object, and each update
# inverts two 4x4 matrices and multiplies two more although the inputs are the same for every buffer of a render pass.
# Each of those three operations now remembers its last inputs (exact float bits) and result per parameter object and
# copies the result when the inputs are identical. invert and multiply are deterministic, so every field of the parameter
# object gets exactly the value the original update computes, including DH's own result for singular matrices.
# Measured: real DH 3.3.2 classes in a plain JVM, 40,000 randomized frames (singular, NaN, infinite and -0.0 inputs,
# parents changed between buffers, listeners writing the output matrices): every field bit-identical. One buffer update
# took 83 -> 38 ns. In two client spark captures the inversions were 0.47% / 0.46% of the render thread.
distanthorizons_render_param_inverse_reuse=true

# ---- Added in 1.0.21: Ryoamic Lights
# ----------------------------------------------------------------------------------------------
# Ryoamic Lights: block-entity light checks skip the lock while no block entity is a light source
# Target: Ryoamic Lights 0.2.3+mc1.20.1 | side: CLIENT | since 1.0.21
# With block-entity light sources enabled, every ticking block entity asks containsLightSource twice per client tick,
# and each call takes and releases the global read lock to look in the light-source set. A sticky flag now records that a
# block entity is about to be added (set before the write lock in addLightSource, the only way into the set). While it is
# clear, the check answers false for a block entity whose class compares by identity without taking the lock. The world
# check still runs first; entities, and everything after the first block-entity light source, keep the original path.
# Measured: 2,000 randomized add/remove traces (including a block-entity class with an unusual equals) gave the same
# answers; an uncontended check took 6.3 -> 3.0 ns (two per block-entity tick). In two client spark captures the check was
# 0.31% / 0.25% of the render thread, almost all of it from block-entity ticks.
ryoamiclights_block_entity_lock_skip=true

# ---- Added in 1.0.21: Curios API
# ----------------------------------------------------------------------------------------------
# Curios: the capability provider answers other capabilities before the slot lookup
# Target: Curios API 5.14.1+1.20.1 | side: BOTH | since 1.0.21
# Curios' provider sits on living entities, and Forge asks it about every capability queried on such an entity. It
# looked up the entity's slot map first and only then checked whether the query was for the Curios inventory, so every
# other mod's capability query paid a slot lookup. A query for any other capability now returns LazyOptional.empty() at
# once: the original returns that same empty singleton on both of its paths for such a query. Curios inventory queries run
# unchanged. Since 1.0.34 only for an entity that has a world: on a living entity built without one, Curios' slot lookup
# fails for every capability, and that failure is kept as it was.
# Measured: all eight capability / slot-map combinations return the same object; only Curios inventory queries still
# look up slots. The lookup was 0.25% of the server thread and 0.09% of the client render thread in spark captures.
curios_foreign_capability_fast_path=true

# ---- Added in 1.0.21: Cryptic Foes
# ----------------------------------------------------------------------------------------------
# Cryptic Foes: the sound listeners test the sound once, not once per entity
# Target: Cryptic Foes 1.0.4 | side: BOTH | since 1.0.21
# Cryptic Foes wakes sleeping Howlers when a bell rings or a goat horn sounds nearby. Its two sound listeners run for every
# sound played in a level, walk every entity of that level and test the sound again for each entity, although the sound
# does not depend on the entity. The walk now stops after the first entity when that sound test is false (every later
# iteration would only skip); bell and goat horn sounds walk every entity exactly as before. The first entity is still
# visited, so any exception happens at the same point.
# Measured: 3,000 randomized cases (empty levels, null sounds, sleeping Howlers in and out of range) gave the same
# wake-ups and exceptions; a non-bell sound with 3,000 entities took 1,185 -> 20 ns in the model. The listener was 0.21% of
# the server thread in a spark capture.
crypticfoes_sound_listener_invariant=true

# ---- Added in 1.0.21: Embeddium
# ----------------------------------------------------------------------------------------------
# Embeddium: vertex serializer lookups without the read lock
# Target: Embeddium 0.3.31+mc1.20.1 | side: CLIENT | since 1.0.21
# Every copy between two vertex formats (text glyphs, entity cuboids, sprite expanders) looks up its serializer, and each
# lookup took and released a StampedLock read lock. Entries are only ever added, never replaced or removed, so a hit is now
# answered from an immutable copy of the cache published through a volatile field. A miss runs the original locked lookup,
# which also refreshes the copy when the cache has grown (Oculus writes its four serializers straight into the cache).
# Measured: real fastutil map and StampedLock, 400 randomized traces plus a four-reader / one-writer stress test (8
# million lookups): always the same serializer object; a warm lookup took 7.2 -> 4.2 ns uncontended. In two client spark
# captures the lookup was 0.17% / 0.21% of the render thread.
embeddium_serializer_lookup_snapshot=true

# ---- Added in 1.0.21: Minecraft (client models)
# ----------------------------------------------------------------------------------------------
# Vanilla: keyframe-animation bone lookup without stream pipelines
# Target: Minecraft 1.20.1 (client models) | side: CLIENT | since 1.0.21
# Keyframe animations look up every animated bone every frame through HierarchicalModel.getAnyDescendantWithName, which
# streamed the whole part tree (nested Stream.concat and flatMap) to find the part that has a child with that name. That
# part is now found by a plain depth-first walk in the same order (the stream's own source order) and handed to the rest
# of the method unchanged. A part class that overrides getAllParts or hasChild sends the lookup back to the stream.
# Measured: real ModelPart trees in a plain JVM, 30,000 random trees over five children-map types (including null
# children): the same part or the same exception every time. One 47-part model with 18 animated bones took 120 -> 10 us per
# frame. Used by vanilla sniffers, frogs, camels and wardens and by modded mobs on the vanilla animation system.
# Since 1.0.30: when Embeddium's own stream-free lookup is active (Embeddium without Oculus), this patch steps aside with
# one log line. Before, that combination crashed the game at start.
vanilla_model_bone_lookup=true

# ---- Added in 1.0.21: Entity Model Features
# ----------------------------------------------------------------------------------------------
# EMF: block-entity type string built once per type
# Target: Entity Model Features 3.2.4 | side: CLIENT | since 1.0.21
# EMF looks up the model variation roots of every rendered block entity by a type string, which for block entities it
# rebuilt every frame as BlockEntityType.toString() (class name, '@', identity hash) and then hashed again. The string is
# fixed for the lifetime of the type, so it is now built once per type and the same equal string is returned. Entities and
# any block entity or type class with its own toString, equals or hashCode keep EMF's method.
# Measured: identical strings and map results; 69 -> 10 ns per rendered block entity. 0.19% of the render thread in a
# storage-heavy client spark capture.
emf_block_entity_type_string=true

# ---- Added in 1.0.21: Entity Texture Features
# ----------------------------------------------------------------------------------------------
# ETF: each sprite's texture id derived once
# Target: Entity Texture Features 7.1 | side: CLIENT | since 1.0.21
# ETF's hook on Material.buffer (chests, signs, beds, banners, shields, bells, decorated pots) derived the sprite's
# texture id on every call: a string build and a newly validated ResourceLocation. While this switch applies, ETF's
# MixinSpriteIdentifier is replaced by an identical handler that takes the id from a memo keyed by the sprite name. A name
# that already ends in .png is still returned as itself; an id that fails validation is never remembered, so it fails the
# same way every time. The variant lookup and render-type swap that follow are ETF's own code, unchanged.
# Measured: real ResourceLocation in a plain JVM, identical ids, hashes and strings; 95 -> 4 ns per call. The hook was
# 0.43% of the render thread in a storage-heavy client spark capture (0.27% constructing ids).
etf_sprite_texture_id_memo=true

# ---- Added in 1.0.21: Oculus
# ----------------------------------------------------------------------------------------------
# Oculus: render-phase debug labels built once per phase
# Target: Oculus 1.8.0 | side: CLIENT | since 1.0.21
# setPhase runs whenever the render state changes phase (entities, block entities, particles, terrain layers, sky:
# hundreds of times a frame) and rebuilt the phase's GL debug-group label each time with toLowerCase, replace and
# capitalize. The 24 labels are now built once, with the same expression, and the same debug-group calls happen in the
# same order.
# Measured: real WorldRenderingPhase, all 24 labels equal; 32 -> 1.4 ns per phase change. 0.14% / 0.06% of the render
# thread in two client spark captures.
oculus_phase_labels=true

# ---- Added in 1.0.22: Radium with C2ME
# ----------------------------------------------------------------------------------------------
# Radium: chunk access optimization back on while C2ME's replacement for it is switched off
# Target: Radium Re-Reforged 0.14.3 with C2ME 0.2.0+alpha.12 | side: BOTH | since 1.0.22
# Radium switches off its mixin.world.chunk_access whenever C2ME's opts.chunk_access sub-mod is installed, because that C2ME
# module rewrites the same methods. The all-in-one C2ME jar always installs the sub-mod, also when c2me.toml sets
# generalOptimizations.optimizeAsyncChunkRequest = false, and then neither version runs. While that C2ME module is off and
# C2ME was the only reason, Radium's option is switched back on. A chunk status that still has to be scheduled then goes
# through ChunkHolder.getOrScheduleFuture, as in vanilla, so C2ME's per-holder lock and parent-status ordering still apply.
# Nothing changes when C2ME's module is on, when C2ME is not installed or when Radium's own config sets the option.
# Measured: in game with C2ME installed, getChunk(create=true) on loaded chunks took 42-65 ns instead of 81-125 ns
# (per-run minimums, 4 runs each) and getBlockState 73-126 instead of 125-209 ns; the replaced vanilla path was
# 1.2-1.7% of the integrated server thread in a client JFR. Every run: 507 lookups returned the same chunk
# objects as the chunk holders, and far chunks still generated FULL through the scheduling path.
radium_c2me_chunk_access=true

# ----------------------------------------------------------------------------------------------
# Radium: player chunk tracking optimization back on while C2ME's no-tick view distance is switched off
# Target: Radium Re-Reforged 0.14.3 with C2ME 0.2.0+alpha.12 | side: BOTH | since 1.0.22
# Radium switches off its mixin.world.player_chunk_tick whenever C2ME's notickvd sub-mod is installed, also when c2me.toml
# sets noTickViewDistance.enabled = false. While that module is off, Radium's option is switched back on: a player who
# crosses into another chunk only visits the chunks that enter or leave their view, instead of calling
# updateChunkTracking (with a new ChunkPos and packet holder) for every chunk of both view squares.
# Measured: 26 chunk-border moves called updateChunkTracking 75,394-85,946 times with vanilla code
# (a ChunkPos and a packet holder each) and 1,458 times with this switch (only the real changes); time in
# ChunkMap.move about 10-20% lower, the rest is packet work.
radium_c2me_player_chunk_tick=true

# ----------------------------------------------------------------------------------------------
# [FIX] Radium: chunks leaving a player's view are dropped through vanilla's updateChunkTracking
# Target: Radium Re-Reforged 0.14.3 | side: BOTH | since 1.0.22
# Radium's player chunk tracking drops a chunk with ServerPlayer.untrackChunk directly and skips
# ChunkMap.updateChunkTracking, which other mods hook: SecurityCraft 1.10.1 keeps a chunk tracked while a camera shown on a
# frame still needs it. The drop now goes through updateChunkTracking, which calls untrackChunk exactly as before when no
# mod cancels it. Applies whenever Radium's mixin.world.player_chunk_tick applies, with or without C2ME.
# Measured: all 1,458 chunk drops of the move test went through updateChunkTracking; no tracked chunk was missing on the client.
radium_untrack_chunk_hooks=true

# ---- Added in 1.0.22: ModernFix with C2ME
# ----------------------------------------------------------------------------------------------
# ModernFix: stronghold position cache back on with C2ME installed
# Target: ModernFix 5.27.77 with C2ME 0.2.0+alpha.12 | side: BOTH | since 1.0.22
# ModernFix switches off its mixin.perf.cache_strongholds whenever C2ME is installed. That cache stores the concentric-ring
# (stronghold) positions of each dimension in the world folder, so a world load reads them instead of searching biomes
# for every ring position again. C2ME 0.2.0+alpha.12 does not touch ring placement in any of its modules, so with that
# C2ME build the cache is switched back on; with another C2ME version, or when C2ME was not the only reason, it stays
# off. Nothing changes without C2ME (the cache is already on then).
# Measured: with C2ME installed, every ring set of every level was read from the cache; a miss costs about 5 s of
# ring search per 128-position set at world load (four sets per load in the pack this was built for).
modernfix_c2me_cache_strongholds=true

# ---- Added in 1.0.22: ImmediatelyFast
# ----------------------------------------------------------------------------------------------
# ImmediatelyFast: HUD batching and font atlas resizing stay on with Call of Yucutan's entity shader
# Target: ImmediatelyFast 1.5.5+1.20.4 | side: CLIENT | since 1.0.22
# ImmediatelyFast switches HUD batching and font atlas resizing off after every resource reload when a non-vanilla pack
# replaces one of the core shaders on its blacklist. Call of Yucutan 1.0.13 replaces rendertype_entity_translucent_cull.fsh
# (through Forge's combined mod_resources pack, which cannot carry ImmediatelyFast's compatibility metadata), so both were
# off in every session. That file is vanilla's shader plus one per-pixel branch (alpha 254/255 = unlit, an emissive
# marker) and uses the same inputs and uniforms, so it is recognised by its exact SHA-256 and no longer counts against
# HUD batching or font atlas resizing (text is drawn with the rendertype_text shaders, which that pack does not replace).
# Any other file at that path, or any other blacklisted shader, is decided by ImmediatelyFast as before.
# Measured: HUD batching stays on in game (it had been off in every session); the HUD with Call of Yucutan's emissive items
# renders the same as unbatched. HUD draw submission was about 1.1% of the render thread in earlier profiles.
immediatelyfast_known_core_shaders=true

# ---- Added in 1.0.23: vanilla world generation
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: repeated ground-height queries are answered from a shared table
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.23
# Structure placement asks the noise generator for ground heights constantly, and each query builds a NoiseChunk for one
# column and fills its corner densities over the full world height. While generating this pack 21% of the queries asked
# again for a column already answered (same heightmap type), three quarters of them from another worker thread. A query
# reads no world state (no terrain blending, no structures), so its height is a function of the world generator, the
# build height, the column and the heightmap type; answered heights are kept in a bounded table per world generator (2^16
# entries) and reused. A generator keeps the original code when its noise router contains another mod's density function
# type (one reviewed exception: Tectonic 3.0.17's Invert, recognised by the SHA-256 of its class file), when it is not
# the vanilla noise generator class, or when BetterEnd fills its slices; and the first 256 reuses of
# every world, then one in 4096, are recomputed and compared instead of served (a difference switches the table off).
# Measured: in game 400 height queries in each of 13 noise dimensions, at two places, identical to the original.
# Pregenerating 512 chunks on the dedicated server, the table served 968 of 16,220 overworld queries (6%);
# an overworld column costs 3.5-4.7 ms here (Tectonic terrain), which a served query skips.
vanilla_noise_column_cache=true

# ----------------------------------------------------------------------------------------------
# Vanilla terrain: a climate sample repeated at the same position is not evaluated again
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.23
# A biome lookup in this pack samples the climate at the same position several times in a row (Alex's Caves, ElysiumAPI,
# TerraBlender and vanilla each evaluate the six climate density functions there): 32.8% of all samples repeated the
# previous sample of the same thread while generating. Each thread now remembers its last sample and returns that
# immutable result for the same sampler and position. A sampler whose density functions include another mod's type is
# never served from memory (one reviewed exception: Tectonic 3.0.17's Invert, recognised by the SHA-256 of its class).
# Measured: 3,000 samples and 9,000 repeats identical in the mixed class; a repeated sample 6.8 -> 2.3 us. In game
# every dimension's sampler (28 levels, 3,000 samples each) matched the original, overworld included. Samples
# were 13.3% of world-generation worker time in review 8; pregenerating 512 chunks served 3.5 million repeats.
vanilla_climate_sample_repeat=true

# ----------------------------------------------------------------------------------------------
# Vanilla terrain: a climate tree search repeated with the same target is not walked again
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.23
# After a climate sample the biome lookup chain searches a climate tree, and 30.7% of the searches repeated the previous
# search of the same thread with an equal target. A search starts from the leaf the thread found last and stores the leaf
# it finds; right after a search for a target that leaf is the target's answer, and searching again from it finds and
# stores the same leaf. Each thread now remembers its last tree, metric, target and result and returns the result for an
# identical next search, leaving the thread's remembered leaf exactly as the search would.
# Measured: 9,000 searches identical in the mixed class, including the thread's last-result state; in game 2,000 searches
# per biome tree matched the original. Searches were 5.9% of worker time; pregenerating 512 chunks served
# 3.2 million repeats.
vanilla_climate_search_repeat=true

# ----------------------------------------------------------------------------------------------
# Vanilla terrain: climate tree nodes keep their ranges in one flat array
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.23
# Every node a biome search visits computes the squared distance from the target to its seven climate ranges, reading
# each range from its own parameter object. Each node now also keeps the fourteen bounds in one long array, filled from
# the same parameters when the node is built, and the distance is the same integer sum read from that array. Nodes with
# equal bounds share one array (since 1.0.29): the region trees of a modded overworld repeat the same climate ranges.
# Measured: every node distance equals Parameter.distance: 9,112 nodes x 1,500 targets offline (a third with random
# 64-bit values) and every dimension's tree in game; 9.6-10.3 -> 7.6-8.5 ns per node (5.0% of worker time).
# Sharing: in the reference pack's dedicated server 228,371 arrays (29.2 MB) become 19,154 (2.5 MB); 1,080,600 node
# distances and 115,500 searches identical with sharing as without it.
vanilla_climate_rtree_flat_bounds=true

# ---- Added in 1.0.23: vanilla server and client
# ----------------------------------------------------------------------------------------------
# Vanilla: block-entity ticking checks remember the chunk's ticking level
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.23
# Every ticking block entity asks whether its chunk ticks, which looks the chunk up in the ticket tracker's map of ticking
# levels (entity ticking checks do the same lookup). Block entities of one chunk come one after another, so the same
# chunk was looked up again and again. The tracker now remembers its last lookup together with a version that its only
# writing method advances before and after every change; a repeat of the same chunk with an unchanged version returns the
# remembered level, anything else reads the map.
# Measured: in game 45,387 chunks x 4 lookups identical with the memo on and off; 84% of lookups answered from the
# memo in review 8, where the lookup was 2.8-3.0% of the server thread.
# Since 1.0.30: stands down for TickingTracker subclasses (e.g. C2ME notickvd's), which are then asked every time.
vanilla_block_ticking_range_memo=true

# ----------------------------------------------------------------------------------------------
# Vanilla: ambient-particle biome lookups inside one-biome sections skip the zoom search
# Target: Minecraft 1.20.1 | side: CLIENT | since 1.0.23
# The client picks 1,334 random blocks per tick for ambient particles and asks each one's biome, which compares eight
# candidate biome cells with a hash-based distance and returns the nearest. When all eight cells lie in one chunk section
# that holds a single biome, every candidate has that biome, so it is returned directly; in every other case (cells across
# a section border, a chunk not loaded, a mixed section) the original lookup runs. No random numbers are involved.
# Measured: 300,000 positions around the player identical in game; 39% took the shortcut. Works on Embeddium's
# replacement of doAnimateTick too (it keeps the same biome lookup).
vanilla_animate_tick_uniform_biome=true

# ----------------------------------------------------------------------------------------------
# Vanilla: the fog colour's biome sample is computed once per frame
# Target: Minecraft 1.20.1 | side: CLIENT | since 1.0.23
# The fog colour blends 216 biome fog colours around the camera, and in this pack it is computed up to three times per
# frame for the same camera and level (vanilla, Distant Horizons' fog and Ars Nouveau's sky). Within one frame the blended
# sample is reused when the level, biome manager, brightness and sample position are exactly the same; everything else in
# the fog colour computation still runs every time. Only dimensions with vanilla special effects are reused.
# Measured: in game the fog colour was bit-identical with the memo on and off, and the frame's later calls hit the memo
# (over Embeddium's fast sampler). The sample was 1.2% of the render thread.
# With Collections Of Optimizations (tested 4.6, client): its option vanilla.memoBiomeFogColour reuses the same fog
# sample. While that option is on, this switch steps aside; otherwise this switch applies and leaves COO's copy out.
# One log line says which (since 1.0.36).
vanilla_fog_color_sample_memo=true

# ---- Added in 1.0.23: Forge
# ----------------------------------------------------------------------------------------------
# Forge and Oculus: each block remembers its chunk render layers
# Target: Forge 47.4.16 with Oculus 1.8.0 | side: CLIENT | since 1.0.23
# Chunk meshing asks for the render layers of every block it meshes, which looked the block up in the shader pack's map
# (Oculus) and then in Forge's map, both through the block's registry delegate and a hash lookup. For every block except
# leaves the answer depends only on the block, the shader pack's map (replaced on every shader reload) and Forge's map
# (fixed after loading), so each block now remembers it together with those inputs and reuses it while they are
# unchanged; otherwise the original method runs, with Oculus's and Embeddium's hooks in it. Leaves always ask (their
# answer follows the leaves-quality setting), and the memo stays off if another mod hooks this class.
# Measured: in game 1,109,161 block states identical with the memo on and off, also after a fancy-graphics toggle and a
# shader reload; 50 ns instead of 122 ns per call; 20,757 blocks remembered. 11.7-13.9% of chunk meshing.
forge_render_layer_memo=true

# ----------------------------------------------------------------------------------------------
# Forge: server-list pings group the network channels once
# Target: Forge 47.4.16 | side: BOTH | since 1.0.23
# Writing the mod list of a server-list ping scanned the whole network channel map once per mod. The channels are now
# grouped by mod in one pass at the start of each ping, in the same order, and every mod takes its group from there. The
# bytes sent are the same.
# Measured: in game the ping bytes were identical with the groups on and off (16,336 bytes, 550 mods, 234 channels);
# 4.2-5.8 -> 0.14-0.20 ms per ping offline (440 mods, 900 channels).
forge_status_ping_channel_groups=true

# ----------------------------------------------------------------------------------------------
# Forge: translation strings without format syntax skip the message formatter
# Target: Forge 47.4.16 | side: BOTH | since 1.0.23
# Every translation string went through a freshly parsed MessageFormat. A string with no '{', '}' or apostrophe has no
# placeholder and no quoting, so the formatter returns it unchanged; it is now returned directly. Strings with any of
# those characters are formatted exactly as before.
# Measured: in game all 85,518 plain templates among the pack's 88,886 translations format identically (compared with
# Forge's own formatter); the 2,607 malformed ones throw exactly as before. 2.3% of integrated-server allocation.
forge_plain_translation_format=true

# ---- Added in 1.0.23: Structurify
# ----------------------------------------------------------------------------------------------
# Structurify: structure-set settings looked up with one map walk
# Target: Structurify 2.0.34+mc1.20.1 | side: BOTH | since 1.0.23
# Every structure placement check asks Structurify for the set's spacing, separation, salt and frequency, and each answer
# walked Structurify's structure-set TreeMap twice (containsKey, then get). The first walk now reads the value and hands
# it to the second; a missing key returns nothing exactly as before, and a different map (a config reload in between)
# is read for real. Only the two map calls are redirected; none of Structurify's code is carried.
# Measured: in game all 1,073 structure sets answered identically with the switch on and off; 203,467 offline
# lookups identical. One map walk instead of two (1.3% of worker time).
structurify_set_data_single_lookup=true

# ---- Added in 1.0.23: Distant Horizons
# ----------------------------------------------------------------------------------------------
# Distant Horizons: rough-surface generation remembers the two-dimensional parts of the terrain density
# Target: Distant Horizons 3.3.2 | side: BOTH | since 1.0.23
# DH's rough-surface generator finds each LOD column's surface with about 35 density probes at different heights, and each
# probe evaluates the whole terrain density, including the parts that depend only on x and z (continents, erosion, ridges
# and the splines over them). The first time DH probes a level's surface, the density is copied once with a per-thread
# cache on every part that reads only x and z: the same value at the same x and z, without recomputing it at each
# height. The copy is only used when the density contains only vanilla function types (plus one reviewed mod type,
# Tectonic 3.0.17's Invert, recognised by the SHA-256 of its class file) and when 256 probes of the copy and the
# original returned the same bits; otherwise DH keeps the original. (The client's generator plan uses this
# generator; a dedicated server's chunks-only plan does not, so a dedicated server never makes the copy.)
# Measured: in game the overworld density (Tectonic terrain) keeps 36,205 two-dimensional parts cached; 21,000 densities
# bit-identical and 494 us instead of 3,351 us per LOD column. The Nether caches 304 parts. DH world generation
# spent 82% of its time in these probes. Copying on the first probe instead of when DH sets up each level (since
# 1.0.29): the reference pack's dedicated server holds 8.7 MB less; 100,000 densities bit-identical between the
# original, the copy made on first use and the copy made up front.
distanthorizons_rough_surface_xz_cache=true

# ----------------------------------------------------------------------------------------------
# Distant Horizons: cloud groups share the per-frame level and colour lookups
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.23
# DH draws its clouds as 363 box groups, and every group's per-frame preparation asked for the client level wrapper (a
# synchronized map lookup) and computed the cloud colour as a new Color. Both answers are the same for every group of a
# frame, so within one generic-object render pass the first answers are reused for the other groups (the same immutable
# Color object for all of them). Outside that pass, or for another level or partial tick, every call goes through.
# Measured: in game the remembered wrapper and colour were used in every one of 1,994 passes; 2,000 passes x 363
# groups identical offline. 2.7-3.3% of the render thread and 5.6 MB/s of allocation before.
distanthorizons_cloud_pass_invariants=true

# ---- Added in 1.0.23: ChunkSending
# ----------------------------------------------------------------------------------------------
# ChunkSending: cached chunk packets expire from a queue
# Target: ChunkSending 3.7 (1.20.1) | side: BOTH | since 1.0.23
# Every cached chunk packet is registered with a five-minute deadline, and at the start of every server tick ChunkSending
# walked all registered packets to drop the few that had expired, so the walk grew with the number of cached chunks.
# Deadlines are now also kept in arrival order, which is deadline order, and each tick only takes the expired ones from
# the front; a packet registered again keeps its newer deadline. The same packets are dropped in the same tick as before.
# Only the registration and the sweep are hooked; none of ChunkSending's code is carried.
# Measured: in game every cached chunk packet waiting for expiry (453) had its queue record; offline 30,000 ticks
# cleared exactly the caches of the original walk. The sweep was 2.0-2.5% of the server thread.
chunksending_expiry_queue=true

# ---- Added in 1.0.23: EntityCulling
# ----------------------------------------------------------------------------------------------
# EntityCulling: the occlusion cache is cleared only where the last pass wrote
# Target: EntityCulling 1.10.5 (OcclusionCulling library) | side: CLIENT | since 1.0.23
# Before every culling pass (about 96 per second) the 4 MiB occlusion cache (at the 128-block tracing distance) was wiped
# with a full fill, although a pass only writes the voxels its rays visit. The cache now notes each byte it writes for the
# first time since the last reset and the reset zeroes exactly those; after more than 8,192 such bytes it uses the full
# fill. After every reset the cache is all zeros, as before.
# Measured: offline 300 culling passes (5.9 million cache operations) identical to the installed class; a reset costs
# 18 us instead of 64 us with 2,000 touched voxels (it filled 4 MiB about 100 times a second).
entityculling_dirty_cache_reset=true

# ---- Added in 1.0.23: Oculus, Colorwheel and AmbientSounds
# ----------------------------------------------------------------------------------------------
# Oculus: the Distant Horizons shader lookup without temporary objects
# Target: Oculus 1.8.0 | side: CLIENT | since 1.0.23
# Every Distant Horizons render event Oculus handles looked up its shader compatibility object through a chain of two or
# three Optional objects. The same lookup now uses plain null checks and returns the same object in every case.
# Measured: in game the instance matched the original lookup with shaders on, off and reloaded; no more Optionals
# (3.3 MB/s of render-thread allocation).
oculus_dh_instance_lookup=true

# ----------------------------------------------------------------------------------------------
# Colorwheel: render-phase debug labels built once per phase
# Target: Colorwheel 1.3.0+mc1.20.1 | side: CLIENT | since 1.0.23
# Colorwheel rebuilt the debug label of its render phase with three string operations on every Flywheel phase change. Each
# of the 26 labels is now built once, with the same expression, and reused.
# Measured: all 26 labels identical; 81-141 -> 1.5-9 ns per phase change (1.6 MB/s of allocation before).
colorwheel_phase_labels=true

# ----------------------------------------------------------------------------------------------
# AmbientSounds: dimension name patterns compiled once
# Target: AmbientSounds 6.3.8 | side: CLIENT | since 1.0.23
# AmbientSounds tests the current dimension against its configured name patterns with a regular expression that was
# compiled again on every test. Each pattern is now compiled once and kept; a pattern that does not compile still throws
# the same error on every test. Separate from ambientsounds_biome_match_cache, which covers biome conditions.
# Measured: in game 308 dimension checks (11 dimensions x 28 levels) identical with compiled and string patterns;
# 18 patterns cached.
ambientsounds_dimension_patterns=true

# ---- Added in 1.0.24: Hostile Villages spawn queue
# ----------------------------------------------------------------------------------------------
# [FIX] Hostile Villages' spawn queue waits for unfinished village chunks instead of the server thread
# Target: Hostile Villages 1.20.1-5.7 | side: BOTH | since 1.0.24
# Hostile Villages replaces the villagers a structure template creates: worldgen threads put the replacement mob into a
# list, and at the end of every level tick EventHandler.addToWorld empties it, adding each mob and calling finalizeSpawn
# with getCurrentDifficultyAt(mob position). Vanilla reads the chunk there whenever it holds a full-status ticket, also
# while it is still generating, so for a village that a pregenerator or a player's view distance had asked for, the server
# thread waited for that chunk and its neighbours behind the whole worker queue. The loop now stops at a queue head whose
# chunk is in exactly that state and processes it, and everything behind it, on a later tick: once the chunk is finished,
# or once nothing asks for it any more (the original reads no chunk then either). Queue order and the mobs are
# unchanged; an entry that has held the queue for five minutes is processed with the original call, and since 1.0.34 a
# queue this switch is holding is drained once with the original call when the server stops (before 1.0.34 the mobs
# still held then were never added, and the stopped world stayed referenced). The list becomes a synchronized list,
# because worldgen threads add to it while the server thread removes from it. Mobs join seconds later than before, which
# no player can see (an unfinished chunk is not shown); the local difficulty and Hostile Villages' per-village extras
# (Mending chest piece, loot minecarts) are taken at that later moment, from the village data set current then (the
# next village's, if one started generating in between).
# Measured: Fixes a server freeze: during a Chunk Pregenerator run with C2ME off, a 41 s freeze and 2-12 s stalls every
# one to three minutes; every server-thread chunk wait in a 10-minute recording (19 of 19) was this call.
hostilevillages_pending_chunk_queue=true

# ---- Added in 1.0.25: Distant Horizons with C2ME
# ----------------------------------------------------------------------------------------------
# Distant Horizons: saved chunks read on its own threads again while C2ME's chunk IO is Minecraft's own
# Target: Distant Horizons 3.3.2 with C2ME 0.2.0+alpha.12 | side: BOTH | since 1.0.25
# For its distant terrain, Distant Horizons reads chunks that are already saved, normally itself, on its own worker threads.
# Whenever C2ME is installed it switches every level ("C2ME detected" in the log) to queueing those reads on Minecraft's
# single chunk IO thread, and the chunk parsing that follows then runs on that thread too, in the same queue as the game's
# own chunk loads and saves. The reason is C2ME's replacement chunk IO; c2me.toml in this pack switches that off, and C2ME's
# async chunk IO and reduced-allocation serializer as well. While those three C2ME modules are off (read from C2ME's own
# enabled flags), Distant Horizons keeps its direct reads, exactly as without C2ME. Nothing changes when any of them is on,
# when another C2ME version is installed, or when C2ME is not installed.
# Measured: in a client copy of a saved world (C2ME installed as here), all 625 saved chunks around the player read on
# Distant Horizons' direct path were identical to Minecraft's IO-thread reads; on 8 threads they took 48-165 ms
# against 236-455 ms queued on the IO thread (warm files, 5 runs), and Distant Horizons' chunk parsing no longer runs
# on that thread, which the game's own chunk loads and saves share.
distanthorizons_c2me_direct_reads=true

# ---- Added in 1.0.25: Radium stand-ins
# ----------------------------------------------------------------------------------------------
# Block entity ticks use the block entity's own state instead of a chunk lookup (Radium's support_cache, Forge-safe)
# Target: Minecraft 1.20.1 / Forge 47.4.16 | side: BOTH | since 1.0.25
# Every tick of every ticking block entity (furnaces, hoppers, machines, chests on the client...) looked its block state up
# in the chunk and then asked BlockEntityType.isValid, which five mods in this pack hook. Radium's
# mixin.world.block_entity_ticking.support_cache removes both steps, but Radium Re-Reforged ships it off: its LevelChunk part
# cannot apply on Forge. This switch does the same with Forge-safe hooks: the tick takes the state from the block entity's
# own field, which LevelChunk.setBlockState keeps equal to the block in the world (also in the two cases where vanilla leaves
# it behind, when a block's placement code changes its own state), and remembers the isValid answer per state until tags
# are reloaded. Radium's three support_cache mixins are cancelled while this applies.
# Measured: in every rig run all ticking block entities (about 2,460) had the same state as the block in the world,
# and a hopper powered at placement kept its item as in vanilla (with the switch off, its block entity kept the
# unpowered state). Timed in one game run, alternating so machine load hits both alike: the two calls this switch
# takes out of every tick (the chunk lookup and isValid with its five hooks) cost 26.3 ns per block entity, their
# replacement 7.3 ns. Block entity ticking was 2.9-3.3% of the render thread in the 2026-10-01 client profiles.
vanilla_block_entity_tick_state=true

# Points of interest: one chunk's sections looked up without a stream pipeline (while Radium's ai.poi is off)
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.25
# Radium's mixin.ai.poi is forced off in this pack by Valkyrien Skies, so every search for beds, job sites, bee nests,
# portals or modded points of interest (Quark's feeding troughs search 216 sections each) runs vanilla's getInChunk for each
# chunk in range: a stream pipeline and a new SectionPos for every section of the column. The same sections are now looked
# up in the same order and just as lazily, without them; the records and their order are unchanged. Applied only while
# Radium's own ai.poi is not.
# Measured: timed in one game run, alternating so machine load hits both alike, getInChunk took 788 ns per chunk
# against 2022 ns for a compiled copy of vanilla's pipeline over the same 121 chunks. The records and their order
# equalled vanilla's pipeline in every run, and findFirst looked up the same number of sections.
vanilla_poi_chunk_sections=true

# ---- Added in 1.0.25: Radium experimental options
# ----------------------------------------------------------------------------------------------
# Radium: experimental chunk_tickets and spawning on, experimental entity block caching off
# Target: Radium Re-Reforged 0.14.3 | side: BOTH | since 1.0.25
# Radium's mixin.experimental.chunk_tickets (ticket expiry looks only at chunks with expiring tickets) and
# mixin.experimental.spawning (the mob cap count walks the entity sections in chunk order) are both on by default in later
# Lithium versions. lithium.properties cannot switch on just these two: Radium copies a user-set parent's value onto every
# child option, so mixin.experimental=true also switches on the experimental entity block caching, whatever the child lines
# say, and its block_touching part skips Valkyrien Skies', Bumblezone's and Dimensional Doors' block-contact hooks. This
# switch sets Radium's live options after that copy: the experimental group on, its entity part off. Nothing changes when
# lithium.properties or another mod sets any of these options. No mod in this pack removes the timed tickets that make
# chunk_tickets throw (Lithium #535/#571).
# Deliberate change (described as one since 1.0.36): Lithium's documentation lists both options under
# minimal_nonvanilla, not as exact: expiring chunk tickets "Can cause reordering of chunks unloading", and spawning
# "Might differ slightly from vanilla due to floating point associativity differences when summing the spawning
# potential of density controlled spawns". With this key false both options stay off, as Radium ships them.
# Measured: in the client and server rigs Radium applied its chunk_tickets and spawning mixins and none of its entity
# block caching. The code they replace was 0.9-1.7% (ticket expiry) and 0.4-0.8% (mob cap count) of the integrated
# server thread in the 2026-10-01 client recordings, 0.24% and 0.35% of busy time in a dedicated-server profile.
radium_experimental_tickets_spawning=true

# ---- Added in 1.0.26: Chunk-status names computed once
# ----------------------------------------------------------------------------------------------
# Chunk-status names computed once
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.26
# ChunkStatus.toString() looks the status up in the chunk-status registry (Forge's wrapper, a reverse lookup) and
# builds a new string on every call. C2ME's profiling hook calls it for every chunk request that is not finished yet,
# before its profiler decides whether to record anything. The first string is now kept and handed back again: a
# registered status keeps its key forever, so the text is the same. A status asked before it has a key runs the original.
# Measured: offline on the transformed class all 12 statuses gave the same text as the original and the
# registry key; 26.3 -> 3.9 ns per call with vanilla's registry (Forge's registry wrapper costs more). The call was
# 0.8-1.2% of the integrated server thread while terrain loaded, 0.55% of the dedicated server's with C2ME.
vanilla_chunk_status_name_memo=true

# ---- Added in 1.0.26: A NoiseChunk's wrap table starts at the size it will reach
# ----------------------------------------------------------------------------------------------
# A NoiseChunk's wrap table starts at the size it will reach
# Target: Minecraft 1.20.1 (with or without ModernFix) | side: BOTH | since 1.0.26
# Every NoiseChunk (one per generated chunk and one per terrain-height query) wraps the noise router through a
# private table of the density functions it has already wrapped. ModernFix's perf.worldgen_allocation makes it a
# default-size fastutil map, which re-hashes every key each time it grows, and the keys are density records whose hash
# codes walk their whole subtree. The still-empty table is now replaced by one of the same class sized for the entry count
# the previous NoiseChunk of the same world reached. Same keys, same values, same objects; the table is never iterated
# by the game (Bons and Furious' own terrain_final_density_reuse reads it order-independently).
# Measured: offline on vanilla's overworld with ModernFix's table, 300 table pairs (class, size, keys) and
# 1,200 heights identical with the switch off and on; median of 20 rounds 543 -> 482 us per NoiseChunk and
# 1,314 -> 1,214 us per height query. The growth re-hashing was 2.0-2.3% of world-generation worker time.
# With a mod that changes the same NoiseChunk call (FastChunkGen 0.3 with its density options on, the c2meforge port of
# C2ME): this switch steps aside and the table is left as the constructor made it. One log line says so.
vanilla_noise_wrap_presize=true

# ---- Added in 1.0.26: Distant Horizons' update queue waits out its debounce instead of spinning
# ----------------------------------------------------------------------------------------------
# Distant Horizons' update queue waits out its debounce instead of spinning
# Target: Distant Horizons 3.3.2 | side: BOTH | since 1.0.26
# Distant Horizons holds every chunk update back for 250 ms. Its update-queue thread only slept when both of its
# queues were empty, so while the closest update was still inside that window the thread popped it, put it back and
# went straight round again: busy work on a full core for as long as updates were waiting (during loading, pregeneration
# and after every burst of block changes). A round that does no work now parks the thread for about a millisecond.
# Same updates, same order, same LOD data; a due update leaves the queue at most about a millisecond (plus the OS timer
# tick) later, against the 250 ms DH waits anyway.
# Measured: offline on Distant Horizons' own queue and loop thread, 600 updates left in the same order,
# each exactly once; while they waited out the debounce the queue thread used 203 ms of CPU, now less than one 16 ms
# timer tick, and a due update left 1.9 ms (mean) instead of 3.9 ms after its debounce. In game, with the switch
# alternating every 2 s while the world loaded and the player travelled, the queue thread used 0-2% of a core instead
# of 10-12% (two runs).
distanthorizons_update_queue_wait=true

# ---- Added in 1.0.26: Embeddium section cache
# ----------------------------------------------------------------------------------------------
# Embeddium: the cloned-section cache drops expired sections from its oldest end
# Target: Embeddium 0.3.31+mc1.20.1 | side: CLIENT | since 1.0.26
# Embeddium keeps up to 512 cloned chunk sections for its chunk builders and, every frame, checked every one of them for
# having gone unused for 5 seconds. The cache is ordered by last use (a section that is used again moves to the end), so
# the expired sections are always the oldest ones at its front: the check now removes from the front and stops at the
# first section that is still in use. The same sections are removed in the same order. If the clock ever runs backwards,
# or the order is not confirmed, the original full check runs until a check of the whole cache confirms the order again.
# Measured: 3.1 million offline checks against Embeddium's own class, 0 differences; a cleanup with 512 cached sections
# 772 -> 45 ns. The full check was 2.0% of the render thread while flying over new terrain.
embeddium_section_cache_prefix_cleanup=true

# ---- Added in 1.0.26: Relics
# ----------------------------------------------------------------------------------------------
# Relics: the player capability answers other capabilities without building a LazyOptional
# Target: Relics 1.20.1-0.8.0.13 | side: BOTH | since 1.0.26
# Relics attaches a capability to every player, and Forge asks it about every capability any mod queries on a player
# (Tinkers' Construct does so for each HUD overlay every frame). For each such question it built a LazyOptional with its
# lock and listener set (128 bytes) that Forge then discarded, answering with the shared empty LazyOptional. A query for
# any other capability now gets that same empty LazyOptional at once; queries for Relics' own capability run unchanged.
# Measured: offline on Relics' own class, every other capability returned the identical object, Relics' own capability
# behaved as before; 128 -> 0 bytes and 17 -> 2 ns per query. 1.5-2.9 MB/s of render-thread allocation before.
relics_foreign_capability_fast_path=true

# ---- Added in 1.0.26: Camera fluid check
# ----------------------------------------------------------------------------------------------
# Vanilla: the camera's fluid check is computed once per render pass for the same camera state
# Target: Minecraft 1.20.1 | side: CLIENT | since 1.0.26
# The fog type (water, lava, powder snow or none) comes from Camera.getFluidInCamera, which vanilla and about twenty mods
# ask for every frame. Each call recomputed the camera's near plane, up to eleven block and fluid lookups and the work of
# the six hooks other mods put on it (Valkyrien Skies twice, Clockwork, Alex's Caves, Blast from the Past, Snow! Real
# Magic). Within one render pass the answer is now reused while the camera, its level, position, block position and
# rotation, the window size and the FOV setting are exactly the same; the blocks, effects and ships the answer depends on
# only change between render passes. The switch stands down by itself when a mod it was not tested with hooks the camera.
# -Dbons_and_furious.cameraFluidMemoShadow=true computes both answers on every call and logs any difference (for testing).
# Measured: 1.2 million offline calls through the camera with all six hooks applied, every reused answer equal to the
# original; 405 -> 22 ns and 1.5 KB -> 16 bytes per call. 2.9% of the render thread and 9.6 MB/s of its allocation before.
vanilla_camera_fluid_memo=true

# ---- Added in 1.0.26: EMF animation variables
# ----------------------------------------------------------------------------------------------
# Entity Model Features: the animation compiler indexes its variable lists instead of scanning them
# Target: Entity Model Features 3.2.4 | side: CLIENT | since 1.0.26
# EMF compiles every animated entity model variant into bytecode at each resource reload. Its variable handler kept the
# variable names in two lists, answered every variable reference with two list scans, and after every animation line
# compared every number variable with every true/false variable to check that no name was both. With Fresh Animations'
# player models (370-840 lines, about 500 and 90 names per variant, compiled again for every renderer that bakes a player
# layer) that was millions of string comparisons per variant. The handler now keeps two name-to-slot maps beside the lists
# and remembers whether a name ever landed in both: the same slots, the same lists and the same errors in the same order.
# Measured: in game with Fresh Animations and its add-ons, rebuilding the entity renderers (every EMF animation
# compile, as at a resource reload) took 8.8 s instead of 15.1-16.6 s with this switch and emf_hierarchical_id_memo
# together, and 5.1 million of its answers checked against the original in game all matched. Offline on all 253
# animated models plus 3 000 random sequences: identical slots, emitted code, lists and errors.
emf_variable_index=true

# ---- Added in 1.0.26: EMF model-part lookups
# ----------------------------------------------------------------------------------------------
# Entity Model Features: model-part lookups are remembered during each model setup
# Target: Entity Model Features 3.2.4 | side: CLIENT | since 1.0.26
# While EMF sets up a model variant's animations it looks up the part named at the start of every animation line and
# every part an expression uses. Most lines of Fresh Animations' models set variables (var.*, varb.*), not parts, so each
# of those lookups missed twice and then went through every part name with several string operations, hundreds of times
# per variant. Within one setup the answers for that setup's part list are now remembered by name, a miss included. The
# part list is built before the first lookup and only read afterwards, so every answer is the one EMF computes; any other
# list, and every lookup outside a setup, goes to EMF's own code.
# Measured: in game, 692 000 of its lookups checked against a fresh original lookup all returned the same part;
# with emf_variable_index it took the entity-renderer rebuild from 15.1-16.6 s to 8.8 s. Offline over all 253 animated
# models: identical answers; the lookups of one player variant setup 4.7 -> 0.11 ms.
emf_hierarchical_id_memo=true

# ---- Added in 1.0.26: JEI ingredient stacks
# ----------------------------------------------------------------------------------------------
# JEI: each ingredient keeps its own display stack instead of one shared expiring cache
# Target: JEI 15.59.0.212 | side: CLIENT | since 1.0.26
# JEI kept the ItemStack of every listed or indexed ingredient in one shared cache that forgets an entry one second after
# its last use. While JEI starts nearly every lookup is for a new ingredient, and every insert walked the cache's expiry
# list. Each ingredient now keeps its own stack under the same one-second rule, with the cache's behaviour for several
# threads asking at once and for errors: the same stack object within a second of the last use, a new one after it.
# Measured: offline against the cache library itself with a test clock, 930 000 lookups including every error case and
# two threads loading at once: identical results; 830 -> 130 ns per lookup while JEI indexes recipes, 100 -> 38 ns for
# repeated lookups. 4.8% of the main thread while JEI starts (about 2.4 s) before.
jei_typed_stack_cache=true

# ---- Added in 1.0.26: JEI item registry
# ----------------------------------------------------------------------------------------------
# JEI: the item registry is looked up once, not for every recipe slot stack
# Target: JEI 15.59.0.212 + Forge 47.4.16 | side: CLIENT | since 1.0.26
# For every stack of every recipe slot it indexes, JEI checks that the server knows the item, and built a new wrapper
# around Forge's item registry for each check (a map lookup and an allocation). The wrapper of the active item registry
# is now kept once that registry exists. Forge never replaces or removes that registry object (a sync with a server
# changes its contents in place), so the check itself is unchanged.
# Measured: offline with JEI's own platform code and Forge's registry manager, every vanilla item plus unregistered items,
# before and after removing items from the registry: identical answers; 18.6 -> 12.3 ns per check. 1.1% of the main thread
# while JEI starts before.
jei_server_item_registry=true

# ---- Added in 1.0.26: Farmer's Delight tool-action ingredients
# ----------------------------------------------------------------------------------------------
# Farmer's Delight: tool-action ingredients scan the item registry once per action and recipe load, not once each
# Target: Farmer's Delight 1.20.1-1.3.4 | side: BOTH | since 1.0.26
# The cutting board's tool ingredients ("strip with an axe", "cut with a knife") each built their item list by creating a
# stack of every registered item and asking whether it can perform the action. 625 recipes in this pack use them with 7
# actions, so every recipe load (world load, server start, /reload, and a client reading the recipes when it joins a
# server) went through the whole item registry 625 times. Within one recipe load the first ingredient for an action now
# runs as before and records which items matched; the following ones create new stacks of exactly those items and check
# them again, so every ingredient gets the same items in the same order, as stacks of its own. What is skipped: the
# throwaway stacks of the items that do not match, and what three other mods do to such a stack while it is created (a
# random id, randomly rolled relic stats, a developer-only counter), none of which outlives the stack.
# It applies only when AllTheLeaks, AzureLib and Relics are installed as well (the combination it was audited and
# tested in); when one of them is missing the switch stays off and Farmer's Delight runs unchanged.
# Measured: in game on this pack, with the switch off and on alternating in one game, rebuilding all recipes took
# 1.4 s instead of 5.5-6.4 s on the client and 1.2 s instead of 3.6 s on the server, and decoding the server's recipe
# list took 0.4 s instead of 8.8 s; the tool-action ingredients came out identical every time. Offline: 12 483 instead
# of 784 375 tool checks for the pack's 625 ingredients.
farmersdelight_tool_action_items=true

# ---- Added in 1.0.26: Fusion chunk layers by Forge's layer id
# ----------------------------------------------------------------------------------------------
# Fusion: chunk-layer checks read the layer id Forge already stores on every render type
# Target: Fusion 1.3.14+a | side: CLIENT | since 1.0.26
# Fusion keeps its connected-texture quads in small per-layer maps, and every access asks whether the render type is one
# of the five chunk layers (an equals search through the layer list) and then looks its index up in a map. Forge already
# gives every render type that index: the chunk layers get 0 to 4 in the same list order, every other type gets -1. The
# two checks now read it. Only Oculus' wrapper render types define their own equals, and none of them matches another
# class, so every answer stays the same, including for render types that are not chunk layers.
# Measured: in a harness running Fusion's own classes, the per-face layer-map work took 123 ns instead of 171 (1.4x
# faster), no change in allocation; these checks were about 2% of chunk meshing time.
fusion_chunk_layer_id=true

# ---- Added in 1.0.26: Fusion connected-texture lookups
# ----------------------------------------------------------------------------------------------
# Fusion: connected-texture block checks by identity, and each connection key hashed once
# Target: Fusion 1.3.14+a | side: CLIENT | since 1.0.26
# Two lookups on Fusion's connected-texture path. The key under which Fusion stores a face's connection result hashed all
# of its parts on every store access (two to three per connected face), every block of a block list included; the parts
# never change, so the first hash is now kept, computed exactly the way Java computes it for any record. A "match these
# blocks" condition asked its block set whether it holds the neighbour, which calls equals and hashCode on blocks; no block
# in the pack defines either (checked again at startup over every registered block), so sets of up to 16 blocks are now
# scanned by identity. Larger sets, and any pack where a block does define equals, keep Fusion's set.
# Measured: in a harness running Fusion's own classes, block checks 1.3x to 1.9x faster (4.2 ns instead of 6.2 for one
# or two blocks) and the key's use in the property store 1.3x faster; no change in allocation.
fusion_connection_lookups=true

# ---- Added in 1.0.26: Weighted block models pick from a table
# ----------------------------------------------------------------------------------------------
# Embeddium: random block-model variants are picked from a running-total table instead of walking the list
# Target: Embeddium 0.3.31 (Minecraft 1.20.1 weighted block models) | side: CLIENT | since 1.0.26
# A block with weighted random models (xali's sand has 28 variants, netherrack 36) picks its variant for every face and
# render-layer query by walking the list until the drawn number runs out. The model now keeps the running totals of its
# weights, built once, and finds the variant with a short search. The random draw is the same call as before; weights are
# never negative, so the first total above the drawn number is exactly where the walk stopped, and a negative draw still
# picks the first entry. With Embeddium's own weighted-model change turned off (its mixin.features.model setting) there
# is nothing to replace, and the models stay exactly as Minecraft ships them (1.0.30-1.0.33 stopped the game there).
# Measured: in a harness running Embeddium's and Fusion's own classes, a mix of real variant lists picked in 34 ns
# instead of 81 (2.4x faster) and netherrack's 36 variants 1.6x faster; lists that nearly always stop at the first
# entry stay about the same; no allocation. Picking was about 2-3% of chunk meshing time.
embeddium_weighted_pick_table=true

# ---- Added in 1.0.26: Hidden faces of connected-texture models skipped before they are built
# ----------------------------------------------------------------------------------------------
# Embeddium: a hidden face of a connected-texture model is skipped before its quads are built
# Target: Embeddium 0.3.31 with Fusion 1.3.14+a | side: CLIENT | since 1.0.26
# Embeddium builds each face's quads first and asks afterwards whether the face can be seen, throwing the quads away when
# it cannot. For Fusion's connected-texture models that ran the whole texture pipeline for faces hidden behind other
# blocks. For Fusion's random-offset model groups (the way Fusion's Embeddium renderer hands over its model-modifier
# blocks) whose parts are all vanilla simple models, Fusion's base models or vanilla weighted models of those two, a
# hidden face now returns no quads straight away, and a visible face is not asked twice.
# Hidden faces never draw anything, and a visible face's quads do not depend on what was skipped, because the random
# source is reset for every face. Every other model, plain vanilla and Fusion models outside such a group included,
# keeps the original order.
# Measured: in game with this pack's resource packs, meshing the 733 non-empty sections around the player
# took 3.9 s instead of 5.2 s per full rebuild (median of 6 alternating rounds), and every section's vertex and
# index data came out byte-identical.
embeddium_visible_faces_first=true

# ---- Added in 1.0.28: Suffocation check without a stream
# ----------------------------------------------------------------------------------------------
# Suffocation check without a stream
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.28
# Every living entity asks Entity.isInWall every tick, and vanilla answers by building a Java stream over the one to four
# blocks around its eyes (a spliterator, a pipeline and the match operation's objects) before testing a single block. The
# check now walks the same block positions in the same order with the game's own test and stops at the same block. Any
# other use of that stream still gets the vanilla stream.
# Measured: 96 -> 49 ns and 200 -> 80 B per isInWall call on real classes; 840,000 checks identical (with the fire
# check below).
vanilla_suffocation_scan_loop=true

# ---- Added in 1.0.28: Fire check of moving entities without a stream
# ----------------------------------------------------------------------------------------------
# Fire check of moving entities without a stream
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.28
# At the end of every movement, every moving entity checks whether it touches fire or lava through a Java stream over the
# blocks in its box (a spliterator, a pipeline, a map stage and the match operation's objects). The check now asks the
# same chunk-loaded question first and reads the same blocks in the same order with the game's own test. A level class
# that streams its blocks differently keeps its own stream. In the profile this was twice the cost of the suffocation
# check above. Since 1.0.34 the check steps aside while Radium applies its experimental fire and lava cache (Radium's
# mixin.experimental switched on in its own lithium.properties): Radium changes the same check, and its version runs,
# with one log line. Before, the two together skipped the "not touching fire" step, so burning entities got no fire
# grace time back and no extinguish sound.
# Measured: 555 -> 301 ns and 680 -> 440 B per moving entity per tick on real classes; 840,000 checks identical (with
# the suffocation check above).
vanilla_fire_scan_loop=true

# ---- Added in 1.0.28: Empty beardifier filled without a per-block loop
# ----------------------------------------------------------------------------------------------
# Empty beardifier filled without a per-block loop
# Target: Minecraft 1.20.1 world generation (Forge 47.4.16) | side: BOTH | since 1.0.28
# Every generated chunk asks its beardifier (structure terrain adaptation) for a value at every block: 98,304 calls
# in a vanilla-height chunk, 196,608 in a 768-high one, each through a megamorphic call plus the handlers mods such
# as Integrated API, YUNG's API and Moog's Structure Lib inject into it. Most chunks have no structure piece near
# them and every one of those calls returns +0.0. The switch flags such a beardifier once per chunk, right after it
# is built, and only when that is provable: vanilla's piece and junction lists and every adaptation list those mods
# keep are empty, and every mod that changes the beardifier is a build whose code was read (checked once per run by
# the SHA-256 of its class files; unknown code anywhere and the switch stands down with one log line). A flagged
# beardifier fills its cache cells with +0.0 directly and leaves the noise chunk in the state the loop leaves it in.
# Same object, same bounds, same values for every block; chunks with structures run the original code unchanged.
# Measured: 7.2 ns -> 0.06 ns per block on real classes (0.7 ms saved per vanilla-height chunk, 1.4 ms per 768-high
# chunk; in-game JFR before: 1.9-2.6% of world generation worker time); identical blocks, heightmaps and
# post-processing lists for 150 whole chunks with and without structures, 63,562 checks.
worldgen_empty_beardifier_marker=true

# ---- Added in 1.0.28: TerraBlender surface rule picked once per biome
# ----------------------------------------------------------------------------------------------
# TerraBlender surface rule picked once per biome
# Target: TerraBlender 3.0.1.10 | side: SERVER | since 1.0.28
# TerraBlender's surface rule runs for every stone block a chunk's surface pass visits (about 150,000 per 768-high
# chunk) and each time works out the biome's namespace again: a lambda, two string lookups and an Optional. Its map is
# fixed for the rule's lifetime and a biome's key never changes, so the rule now keeps the last biome object and the
# namespace rule picked for it, and picks again only when the biome object changes.
# Measured: 38.9 -> 13.4 ns per stone block on real classes (5.8 -> 2.0 ms per 768-high chunk); 2,783,033 checks
# identical.
terrablender_namespace_rule_memo=true

# ---- Added in 1.0.28: TerraBlender builds only the surface rules a chunk uses
# ----------------------------------------------------------------------------------------------
# TerraBlender builds only the surface rules a chunk uses
# Target: TerraBlender 3.0.1.10 | side: SERVER | since 1.0.28
# For every chunk's surface pass TerraBlender builds the full surface rule tree of every namespace it knows (Minecraft
# plus every mod that registered surface rules), hundreds of objects each, although a chunk normally reaches one or two
# of them (review-8 profile: 4.5-25% of all world generation worker allocation sits there). A namespace made only of
# vanilla rule sources is now built at its first use in the chunk, with the very same call; one that contains any other
# mod's rule source is built up front as before.
# Measured: 16,478,967 in-game per-block comparisons with every namespace built up front, all identical (shadow mode,
# dedicated server without C2ME, 516 new chunks); not benchmarked on its own (review-8 profile: 4.5-25% of all world
# generation worker allocation sat in this method). With C2ME installed it stands down by itself: C2ME changes a vanilla
# rule source this switch relies on.
terrablender_lazy_namespace_rules=true

# ---- Added in 1.0.28: Distant Horizons LOD building reuses the biome of the quart
# ----------------------------------------------------------------------------------------------
# Distant Horizons LOD building reuses the biome of the quart
# Target: Distant Horizons 3.3.2 | side: BOTH | since 1.0.28
# When Distant Horizons turns a chunk into LOD data it asks the biome of every block of every column, about 100,000 to
# 150,000 times per chunk, while the biome only changes every four blocks. Within one chunk conversion the previous
# answer is handed back when the next block is in the same column and the same quart, which is the very call that
# produced it. Only Distant Horizons' own Forge chunk wrapper is shortened; any other wrapper is asked every time.
# Measured: 22.7 -> 11.5 ns per biome lookup on real chunk palettes (3.4 -> 1.7 ms per LOD chunk); 9,615,910 checks
# identical.
distanthorizons_lod_biome_memo=true

# ---- Added in 1.0.28: Distant Horizons biome blending reuses a repeated colour
# ----------------------------------------------------------------------------------------------
# Distant Horizons biome blending reuses a repeated colour
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.28
# For the nearest LOD rings Distant Horizons blends each point's grass, foliage and water tint over its neighbours (49
# samples at the default radius) and looks up each sample's colour through three concurrent maps, although neighbours
# mostly share one biome. Within one point the block and the colour resolver are fixed, so the previous sample's colour
# is reused while the biome object is the same; "no colour" is never reused.
# Measured: 733 -> 186 ns per tinted LOD point (49 samples, 4.5 biome changes per point).
distanthorizons_biome_blend_memo=true

# ---- Added in 1.0.28: Alex's Caves rare-biome lookup once per column
# ----------------------------------------------------------------------------------------------
# Alex's Caves rare-biome lookup once per column
# Target: Alex's Caves 2.0.2 | side: SERVER | since 1.0.28
# Alex's Caves asks, before every overworld noise-biome lookup, whether a rare cave biome sits at that spot: a Voronoi
# cell search with two noise samples and its own allocations. The answer does not depend on height, yet a chunk's biome
# fill asks it for every quart of every section: 3,072 times per 768-high chunk for the same 16 columns. Each world
# generation thread now keeps the answers for the columns it is filling, keyed by the seed, the column, Alex's Caves'
# width-randomness setting and its configuration generation, and hands back the object Alex's Caves returned for that
# key. Every other lookup runs Alex's Caves' own code.
# Measured: 112 -> 20 ns and 422 -> 5 B per lookup on real classes (0.34 -> 0.06 ms per 768-high chunk); 907,201
# checks identical.
alexscaves_rare_biome_column_memo=true

# ---- Added in 1.0.28: Pehkui scale ticks without empty callback loops
# ----------------------------------------------------------------------------------------------
# Pehkui scale ticks without empty callback loops
# Target: Pehkui 3.8.2 | side: BOTH | since 1.0.28
# Pehkui ticks all 32 scale types of every entity every tick, and each tick handed a new lambda to the pre-tick and the
# post-tick callback list, although both lists are empty unless an addon registers a callback: about 64 objects per
# entity per tick. The lambda is now built, and the list walked, only when the list has callbacks; a non-empty list runs
# exactly as before, in the same order.
# Measured: 32 -> 0 B per scale-type tick; 15-24 -> 9 ns once the call site is shared with other code, as in a full
# pack (no change in an isolated bench); 717,378 trace lines identical.
pehkui_scale_tick_callbacks=true

# ---- Added in 1.0.28: Curios tick skips the lookup on entities without slots
# ----------------------------------------------------------------------------------------------
# Curios tick skips the lookup on entities without slots
# Target: Curios API 5.14.1+1.20.1 | side: BOTH | since 1.0.28
# Curios' tick handler runs for every living entity every tick and starts by looking up the Curios inventory: a walk over
# all of the entity's capability providers. For an entity type no datapack gives slots to (animals, fish, villagers,
# most modded mobs) Curios' own provider answers empty and the walk finds nothing. Once that walk has come back empty on
# an entity, the answer is reused while the type still has no slots and the entity keeps the same, valid capabilities.
# An entity on which another mod answers the inventory is never skipped, and a datapack reload that adds slots is seen
# at once.
# Measured: 409 -> 9 ns per tick handler call with 25 capability providers, 16 -> 9 ns with Curios' provider alone, on
# real classes; 317,976 checks identical.
curios_slotless_tick_skip=true

# ---- Added in 1.0.28: Mowzie's Mobs capabilities kept on the entity
# ----------------------------------------------------------------------------------------------
# Mowzie's Mobs capabilities kept on the entity
# Target: Mowzie's Mobs 1.7.3 | side: BOTH | since 1.0.28
# Mowzie's Mobs asks every living entity for its frozen, living and ability capabilities three times per tick, and the
# client again per rendered entity, each time walking the entity's capability providers twice. The first answer is now
# kept on the entity with the provider set it came from, and handed out while the entity's capabilities are valid, the
# provider set is the same object and the answer has not been invalidated. That is the very object the walk returns.
# Anything else asks the entity as before.
# Measured: 187 -> 14 ns per lookup with 25 capability providers, 18 -> 11 ns with Mowzie's providers first, on real
# classes; 198,003 checks identical.
mowziesmobs_capability_handles=true

# ---- Added in 1.0.28: Cucumber block entity updates built only for someone
# ----------------------------------------------------------------------------------------------
# Cucumber block entity updates built only for someone
# Target: Cucumber 7.0.16 | side: BOTH | since 1.0.28
# Cucumber sends a block entity's update by first building the packet (its whole saved data: inventory, energy,
# progress) and then sending it to each player within 64 blocks. Mystical Agriculture's machines do this every tick
# they run, so an unattended machine wrote its data every tick for nobody. The switch asks Cucumber's own range question
# first and builds the packet only when someone is in range; the players, their order and the packet are unchanged.
# Block entities whose class builds its own update packet keep the original order.
# Measured: 782 ns and 3,664 B -> 3 ns and 0 B per dispatch with nobody in range, on real classes; 117,093 checks
# identical.
cucumber_tile_dispatch_range_first=true

# ---- Added in 1.0.28: Artifacts living-tick checks in a cheaper order
# ----------------------------------------------------------------------------------------------
# Artifacts living-tick checks in a cheaper order
# Target: Artifacts 9.5.16 | side: BOTH | since 1.0.28
# Artifacts checks the kitty slippers and the umbrella for every living entity every tick. The slippers check scans the
# last attacker's whole Curios inventory before it tests whether the entity is a creeper, and the umbrella check runs a
# Curios lookup for every entity in water before the cheap glide tests. Both conditions are side-effect-free tests
# joined by "and", so the switch asks the cheap ones first: the creeper test first, the water and charm-of-sinking test
# last. Same branch, same attribute changes, same fall-distance reset.
# Measured: 1,043,628 in-game checks of the reordered conditions against the original order, all identical (shadow
# mode, client session with about 510 mods); in the review-8 server profile the two handlers were 0.11% of the server
# thread.
artifacts_living_tick_order=true

# ---- Added in 1.0.28: GeckoLib animation queues reused per bone
# ----------------------------------------------------------------------------------------------
# GeckoLib animation queues reused per bone
# Target: GeckoLib 4.8.4 | side: BOTH | since 1.0.28
# Every rendered frame, every playing GeckoLib animation controller rebuilt its bone-queue map with a new record and nine
# new queue lists per bone: ten objects per bone per controller per frame. The map now receives the same clear and put
# calls in the same order, and a bone keeps its record from the previous frame with its queues emptied, which equals the
# new record GeckoLib would have made. Same keys, same layout, same iteration order.
# Measured: 855 ns and 6,920 B -> 552 ns and 40 B per 20-bone controller per frame on real classes; 5,275,383 checks
# identical (with the vertex switch below).
geckolib_bone_queue_reuse=true

# ---- Added in 1.0.28: GeckoLib quads without a new vector per vertex
# ----------------------------------------------------------------------------------------------
# GeckoLib quads without a new vector per vertex
# Target: GeckoLib 4.8.4 | side: CLIENT | since 1.0.28
# Every GeckoLib entity, block, item and armour renderer transformed each vertex through a new vector. In play the JIT
# does not remove it (review-8 profile: 69 MB in 38 seconds, 0.9% of the render thread's time). On the render thread the
# vertex is now transformed in one reused vector with the same matrix call, so the same floats reach the vertex call.
# Other threads, and renderers that override the method, keep GeckoLib's code.
# Measured: 128 -> 0 B per quad on real classes; 5,275,383 checks identical (with the queue switch above).
geckolib_quad_vectors=true

# ---- Added in 1.0.28: Citadel model boxes without new vectors per vertex
# ----------------------------------------------------------------------------------------------
# Citadel model boxes without new vectors per vertex
# Target: Citadel 2.6.1 | side: CLIENT | since 1.0.28
# Citadel draws its model boxes (Alex's Mobs, Alex's Caves, Ice and Fire and many more) with a new vector for every
# quad's normal and every vertex's position. In a full pack the JIT does not remove them: the review-8 profile had 90 MB
# of these vectors in 90 seconds, 1.2% of the render thread's time. On the render thread both now come from one reused
# vector set to the same values, and the same matrix math runs on it, so every vertex written is the one Citadel
# writes. Other threads allocate as before.
# Measured: 11,744 -> 800 B per 12-box model render on real classes (5% less time in the bench); 7,480 checks of
# models compared byte for byte.
citadel_model_vertices=true

# ---- Added in 1.0.28: LionfishAPI model boxes without new vectors per vertex
# ----------------------------------------------------------------------------------------------
# LionfishAPI model boxes without new vectors per vertex
# Target: LionfishAPI 2.8 (L_Ender's Cataclysm) | side: CLIENT | since 1.0.28
# LionfishAPI carries the same model-box loop as Citadel; the same two vectors now come from one reused vector on the
# render thread, as in citadel_model_vertices above.
# Measured: as citadel_model_vertices (the same proof covers both libraries).
# With Collections Of Optimizations (tested 4.6, client): its options lionfishapi.fastModelRender and
# lionfishapi.reuseBoxRotations draw the same boxes their own way. While either is on, this switch steps aside;
# otherwise this switch applies and leaves COO's copy out. One log line says which (since 1.0.36).
lionfishapi_model_vertices=true

# ---- Added in 1.0.28: FancyMenu render state kept in a field on the render thread
# ----------------------------------------------------------------------------------------------
# FancyMenu render state kept in a field on the render thread
# Target: FancyMenu 3.9.14 | side: CLIENT | since 1.0.28
# FancyMenu tracks the current scale, translation and rotation of every PoseStack through three ThreadLocals, updated on
# every push, pop, scale, translate and rotate of every model part, block entity, item and HUD element: thousands of
# ThreadLocal lookups per frame, nearly all on the render thread. On the render thread the value now lives in a plain
# field that takes over what the thread's ThreadLocal held; every other thread keeps the ordinary ThreadLocal. Every
# thread sees exactly the values and objects it saw before. Read once at start.
# Measured: 26.8 -> 16.8 ns per push, translate and pop on the render thread with 200 other ThreadLocals live; 412,008
# checks identical.
fancymenu_render_thread_state=true

# ---- Added in 1.0.28: ImmediatelyFast flushes skip idle layers
# ----------------------------------------------------------------------------------------------
# ImmediatelyFast flushes skip idle layers
# Target: ImmediatelyFast 1.5.5+1.20.4 (Forge) | side: CLIENT | since 1.0.28
# ImmediatelyFast's batching buffer source ends every fixed layer (29 in vanilla, more with mods) on each flush, wrapping
# each one in a new one-element set although almost none were drawn into. In the review-8 profile that class was 2.5-4.2%
# of the render thread's allocation. A flush now leaves out a layer only when ending it could not draw or change
# anything but one Iris flag, which ends where ImmediatelyFast leaves it. Fixed builders are ended without the set,
# lookups are single, drawn fallback sets are reused, and new sources start small. Subclasses keep ImmediatelyFast's
# code in full.
# Measured: GUI flush 1,179 ns and 2,152 B -> 743 ns and 504 B; world flush 1,422 ns and 2,811 B -> 1,101 ns and
# 1,163 B, on real classes; 478,984 checks identical.
immediatelyfast_idle_layer_skip=true

# ---- Added in 1.0.28: Storage Drawers count labels formatted once per count
# ----------------------------------------------------------------------------------------------
# Storage Drawers count labels formatted once per count
# Target: Storage Drawers 12.15.1 | side: CLIENT | since 1.0.28
# With the Quantify Key, every drawer face in view formats its item count every frame, and every count from 10,000 up
# goes through String.format ("12.3K", "45M"): a new formatter and float formatting per slot per frame. On the render
# thread each such call now looks up a table keyed by every input String.format uses (the format, the number and the
# current locale) and returns the text it produced before; the table holds up to 2,048 labels and is cleared when full.
# Smaller counts and other threads are formatted as before.
# Measured: 323 -> 13 ns per label on real classes (100 -> 8 us per frame for 256 labels); 2,520,218 checks identical,
# locale switches included.
storagedrawers_count_label_memo=true

# ---- Added in 1.0.28: CoFH translucent pass looks up only translucent types
# ----------------------------------------------------------------------------------------------
# CoFH translucent pass looks up only translucent types
# Target: CoFH Core 11.0.2 | side: CLIENT | since 1.0.28
# After the particles of every frame CoFH Core asks the renderer of every client entity, only to keep the few whose
# renderer is one of CoFH's translucent ones. The entity types with such a renderer (and whether any player renderer is
# one) are now worked out once per set of renderers, and only entities of those types are asked; the rest are answered
# "not translucent", as their renderer would. This holds only while the game's renderer lookup is unchanged, so the
# switch checks after all mods are loaded that no other mod changed it, and otherwise leaves the pass alone (this pack:
# BadOptimizations, Friends and Foes and Vivecraft change it, so here the switch stays out of the way).
# Measured: 7.2-12.5 -> 3.7-7.9 ns per entity per frame on real classes (2,000 entities: about 7-9 us per frame);
# 15,407 checks identical.
cofh_translucent_renderer_memo=true

# ---- Added in 1.0.28: BWG terrain passes skipped where their biome cannot be
# ----------------------------------------------------------------------------------------------
# BWG terrain passes skipped where their biome cannot be
# Target: Oh The Biomes We've Gone 1.8.0 | side: SERVER | since 1.0.28
# After every chunk's surface step, in every dimension, BWG runs its Crag Gardens and Basalt Barrera terrain passes:
# each builds noise objects and then looks up the biome of every column, changing only columns in its own biome. That
# lookup can only reach the noise biomes of this chunk and its eight neighbours. When all nine are present and past the
# biome step and none of their biome palettes can hold the pass's biome, no column can match and the pass is skipped.
# In every other case, and in any chunk where the biome could appear, the pass runs as before.
# Measured: the check costs 3.3 us per pass on real classes, against 70-120 us for a pass that finds nothing; 15,760
# checks identical.
biomeswevegone_foreign_chunk_skip=true

# ---- Added in 1.0.28: Placebo enchantment queries without an empty event
# ----------------------------------------------------------------------------------------------
# Placebo enchantment queries without an empty event
# Target: Placebo 8.6.3 | side: BOTH | since 1.0.28
# Placebo routes every enchantment-level query of every item stack through a new event on Forge's event bus, so that mods
# such as Apotheosis can add levels. When nothing listens for that event, the post calls nobody and the answer is the
# value Placebo put in. The switch asks the bus's own listener list first and, when it is empty, returns that value (the
# all-enchantments query keeps its fresh map copy) without building or posting the event. A listener registered at any
# time is seen on the next query.
# Measured: nothing listens in a pack of about 510 mods without Apotheosis: 45,065 queries skipped in a 5-minute
# client session, each identical to the posted event (shadow mode); Apotheosis listens, so with it the event is posted
# as before.
placebo_enchantment_event_skip=true

# ---- Added in 1.0.29: Almost Unified compares each unified recipe only with possible duplicates
# ----------------------------------------------------------------------------------------------
# Almost Unified: duplicate recipes are found without comparing every recipe with every other one
# Target: Almost Unified 0.11.0 | side: BOTH | since 1.0.29
# After unifying, Almost Unified compares every changed recipe with every recipe of the same type to find duplicates
# (about 43,500 recipes here, so tens of millions of comparisons on each data load). Two recipes can only be duplicates
# when the fields it compares are the same and have equal values (and, for crafting recipes, when they make the same
# item), so each recipe now gets a short fingerprint of exactly that, and only recipes with the same fingerprint are
# compared, in the same order, with Almost Unified's own comparison. The same duplicates are found and removed, the same
# warnings are logged in the same order (crafting outputs are still read in Almost Unified's order), and the same error
# is raised where Almost Unified raises one.
# Measured: offline on Almost Unified's own classes with this pack's 41,000 recipe files and three duplicate configs
# (incl. strict mode and sanitizing): 47,207 duplicate checks gave identical results, links, cached outputs, log lines and
# exceptions; with the pack's config 178 comparisons were left of 33.7 million. In this pack's profiles the duplicate pass
# was 6.3% of the dedicated server's startup thread (about 1 s; Almost Unified logs 2.3 s) and 1.4% of the client's world
# load (about 0.8 s; logged 1.7 s), and it repeats on every /reload.
almostunified_duplicate_groups=true

# ---- Added in 1.0.29: Chunk holders remember their ticking chunk
# ----------------------------------------------------------------------------------------------
# Chunk holders remember their ticking chunk
# Target: Minecraft 1.20.1 (Forge 47.4.16; with or without ModernFix) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.29
# Every server tick asks each loaded chunk's holder for its ticking chunk: the holder's chunk future, its result and the
# chunk inside it, two extra objects per chunk that are usually cache misses. Each holder now keeps the future it last
# answered for and that answer in two fields of its own, recorded only once that future has completed normally (a
# completed future's result never changes), and answers from them while the holder still has that same future. A new,
# unfinished or failed future runs the original code. Only the server thread uses the record; other threads, and every
# call while C2ME's no-tick view distance is on, run the original code.
# Measured: offline on the real class (ModernFix's version of the method, as installed) with the caches emptied before
# each pass: 20.9 -> 7.8 ns per chunk (laid out in order) and 18.2 -> 8.2 ns (scattered), warm 12.8 -> 4.3 and
# 10.2 -> 3.9 ns, no allocation; 327,815 calls identical over 72,185 future changes, plus other-thread and concurrent
# runs (1.5 million checks). In-game JFR before: the method and the future read under it were 3.1-4.4% and 4.2% of the
# integrated server thread (Bons and Furious 1.0.26).
vanilla_ticking_chunk_memo=true

# ---- Added in 1.0.29: climate search trees sort their nodes by precomputed keys
# ----------------------------------------------------------------------------------------------
# Minecraft: building a biome search tree sorts its nodes once per sort by keys worked out in advance
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.29
# Every biome source builds search trees over its climate points (TerraBlender one per region at each server start,
# Blueprint one when the world settings are read). Building one sorts the points eight times per tree level, and every
# comparison worked the sort key out again from the point's climate ranges. The keys are now worked out once per sort and
# the points sorted by them; equal keys keep their order, as before, so every tree comes out node for node the same.
# Measured: offline on Minecraft's own class, 96 trees (vanilla's 7,593 overworld points and synthetic sets of up to
# 20,000 with ties and overflowing values) and 1,680 direct sorts were identical; the overworld tree built in 29.9 ->
# 19.1 ms, a 10,000-point tree in 95 -> 47 ms. In this pack's profiles these sorts were 1.5% of all server startup samples
# (about 0.8 s) and 0.5% of the client's world load (about 1.4 s).
vanilla_climate_tree_sort_keys=true

# ---- Added in 1.0.29: climate search tree ranges without throwaway objects
# ----------------------------------------------------------------------------------------------
# Minecraft: the climate ranges of biome search tree branches are worked out without creating an object per step
# Target: Minecraft 1.20.1 | side: BOTH | since 1.0.29
# Each branch of a biome search tree records the climate ranges its points cover. Working them out created a new range
# object for every point and every one of the seven climate values, about two million short-lived objects for the
# overworld tree alone. The smallest and largest values are now collected directly and one range object made per value,
# with the same results (a branch with a single point still shares that point's own range objects, as before).
# Measured: offline on Minecraft's own class, 400 direct calls and the same 96 trees were identical; together with the
# sort keys above the overworld tree built in 29.9 -> 15.1 ms and a 10,000-point tree in 95 -> 40 ms (span bounds alone:
# 29.9 -> 25.1 ms and 95 -> 86 ms).
vanilla_climate_tree_span_bounds=true

# ---- Added in 1.0.29: Entity selectors with a type tag only visit entities of those types
# ----------------------------------------------------------------------------------------------
# Entity selectors with a type tag only visit entities of those types
# Target: Minecraft 1.20.1 (Forge 47.4.16) | side: BOTH (acts on the server, incl. the integrated server) | since 1.0.29
# A data-pack selector such as @e[type=#incendium:mobs_no_player,tag=!in.checked] walks every loaded entity of the
# level and runs isAlive and the selector's checks on each one, because vanilla only narrows a scan by type for
# type=<one id>. Data-pack clock functions run such scans several times a tick (Incendium's main clock: seven type-tag
# scans every tick). When the selector's first option is a type tag or a negated type, the scan now walks a per-level
# index of the loaded entities grouped by type and visits only the types the option accepts (plus entities of classes
# with their own isAlive, health or type methods), in the level's own entity order. Same entities, same order, same
# limit and sorting; every other selector and every other entity query runs vanilla's code.
# Measured: offline on the real classes (with Radium's entity data tracker, as installed), seven Incendium-style scans
# over 1,800 entities 1.64x faster with half of them in the tag and 2.39x with a modded-like mix (up to 7x per scan), no
# extra allocation; 82,480 selector runs and 2.7 million selected entities identical to vanilla, 6,000 entity
# adds/removals with the index in step. In-game JFR before: these scans were 3.7-4.9% of the integrated server thread
# (Bons and Furious 1.0.26).
vanilla_selector_type_index=true

# ---- Added in 1.0.29: Distant Horizons finds stored block names in a table
# ----------------------------------------------------------------------------------------------
# Distant Horizons: the biome and block names of saved LOD data are found in a table instead of letter by letter
# Target: Distant Horizons 3.3.2 | side: BOTH | since 1.0.29
# Each time Distant Horizons reads LOD data back from its database, it turns every stored biome and block name into one
# shared text through a tree with a step per letter (about 40 steps per name, each a locked lookup). A table keyed by the
# whole name now returns the text that tree already made; a name it has not seen yet still goes through the tree once.
# Every caller gets the very same text as before.
# Measured: offline on Distant Horizons' own classes with the 840 LOD sections of the test world and synthetic data, 8
# threads included: the same text in every case; reading a stored block entry 1.3-1.5 -> 0.85-1.0 us (one name 0.71 ->
# 0.15 us). In the test flight the letter-by-letter lookup took about 11% of the LOD loader threads.
distanthorizons_pooled_string_index=true

# ---- Added in 1.0.29: Distant Horizons remembers which block states are air
# ----------------------------------------------------------------------------------------------
# Distant Horizons: each block-state wrapper remembers whether it is air
# Target: Distant Horizons 3.3.2 with Forge 47.4.16 | side: BOTH | since 1.0.29
# When Distant Horizons turns LOD data into render data it asks the block of every data point whether it is air. With
# Forge that question goes from the block state to its block and back, two slow memory reads when they are not cached,
# while every other answer it needs is already stored in its wrapper. The wrapper now stores the air answer as well, for
# every block that uses Forge's standard air check (a fixed property of the state). Blocks with their own air check (Ars
# Nouveau's intangible air, Immersive Engineering's fake light) are still asked every time.
# Measured: offline on Distant Horizons' own wrapper class: the same answer in every case, including a block whose answer
# changes; per data point 6.3 -> 2.3 ns with everything cached and 59-73 -> 9-10 ns from cold memory. In the test flight
# the air check took about 7% of the LOD loader threads.
distanthorizons_wrapper_air_flag=true

# ---- Added in 1.0.29: Distant Horizons builds LOD side faces without walking empty slots
# ----------------------------------------------------------------------------------------------
# Distant Horizons: the side faces of LOD columns skip neighbour slots that cannot change them
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.29
# For each side face of each LOD column, Distant Horizons walks every slot of the neighbouring column to work out the
# face's lighting: all 16 slots at the finest level although real columns hold one or two points, and every point below
# the face, which only copies the light list unchanged. The walk now stops after the neighbour's last point and passes
# over points that lie wholly below the face. The faces, their light and their order stay the same.
# Measured: offline on Distant Horizons' own classes: identical render data for 30,000 single faces (broken and unsorted
# columns included) and for 111 LOD sections of the test world; building the render data of a section 5.1-6.0 -> 4.0-4.5
# ms at the finest levels and 4.5-6.1 -> 3.9-5.4 ms further out with this switch alone, 3.1-4.4 ms together with the next
# one. In the test flight these faces took about 23% of the LOD loader threads.
distanthorizons_adjacent_face_skip=true

# ---- Added in 1.0.29: Distant Horizons sorts LOD faces as plain numbers
# ----------------------------------------------------------------------------------------------
# Distant Horizons: LOD faces are sorted by their position numbers before merging
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.29
# Before merging neighbouring LOD faces, Distant Horizons sorts each direction's faces with a comparison that opens both
# face objects every time. Every face already carries its position as one number, so the faces are now sorted by those
# numbers, with their place in the list as tie-breaker, which keeps equal faces in exactly the order the original sort
# leaves them. Lists of more than 65,536 faces or anything unusual still use the original sort.
# Measured: offline on Distant Horizons' own classes: identical order and merges for 900 lists of up to 70,000 faces and
# for 111 LOD sections of the test world; the merge step 0.74-1.19 -> 0.55-0.68 ms per section, the render data of a
# section further out 4.5-6.1 -> 3.8-5.2 ms with this switch alone. In the test flight this sort took about 8% of the LOD
# loader threads.
distanthorizons_quad_sort_keys=true

# ---- Added in 1.0.29: Distant Horizons reads its saved LOD data without a lock per byte
# ----------------------------------------------------------------------------------------------
# Distant Horizons: saved LOD data is read from memory without locking for every single byte
# Target: Distant Horizons 3.3.2 | side: BOTH | since 1.0.29
# Distant Horizons reads LOD data back from its database one byte at a time (numbers, block and biome names) through a
# Java in-memory stream whose every read takes a lock, although only the reading thread ever sees that stream. That
# stream is now a version of the same Java class that reads the same bytes in the same way without the lock.
# Measured: offline on Distant Horizons' own classes: the 840 LOD sections of the test world read back identically, and
# 160,000 random reads (end of data included) gave the same results; reading a saved section 0.69 -> 0.50 ms, a stored
# block entry 0.88 -> 0.61 us (together with the name table above 1.05 -> 0.60 us).
distanthorizons_unlocked_byte_stream=true

# ---- Added in 1.0.29: Invisible animated textures advance from a copy of their frame times
# ----------------------------------------------------------------------------------------------
# Invisible animated textures advance from a copy of their frame times
# Target: Embeddium 0.3.31 (Minecraft 1.20.1) | side: CLIENT | since 1.0.29
# With Embeddium's "animate only visible textures", every animated texture that was not drawn since the last tick
# still steps its frame counter once per tick. To read the current frame's length Embeddium walks four separate objects
# (animation, frame list, its array, frame), and with a pack's 2,000-3,000 animated textures they are cold in the CPU
# cache every tick. The frame lengths never change (the list and its entries are immutable), so each texture now copies
# them once into a small array and steps from that: the same counters, in the same order, to the same values. Textures
# on screen, the option turned off, and any list that is not one of the immutable kinds still use Embeddium's code.
# Measured: offline on the transformed classes 3.6 million checks over 3,000 texture pairs and 400 ticks (423,468 steps
# on the new path) all identical; 94-138 -> 49-79 ns per texture per tick with a cold cache and 17-27 -> 6-14 ns warm
# (2,500-10,000 textures, the client's ZGC and ParallelGC), no allocation. Embeddium's step was 2.5-7.3% of the render
# thread in the 1.0.26 client recording.
embeddium_sprite_tick_frame_times=true

# ---- Added in 1.0.29: EMF model cubes transform their vertices in one reused vector
# ----------------------------------------------------------------------------------------------
# EMF model cubes transform their vertices in one reused vector
# Target: Entity Model Features 3.2.4 | side: CLIENT | since 1.0.29
# Entity Model Features draws its custom model cubes (Fresh Animations and other EMF models) by creating a new vector
# for every vertex of every cube on every frame, and in play the JVM does not optimise it away: with many mobs on screen
# it was the largest single source of the render thread's garbage. On the render thread each vertex now goes through
# one reused vector holding the same four numbers, transformed by EMF's own call, so every vertex gets the same position.
# Other threads still create their own vector.
# Measured: offline on the transformed class 1,083,028 vertex calls (60,000 cube renders, nested renders and another
# thread included) identical to the bit; 32 -> 0 bytes and 13.3 -> 11.5 ns per vertex with the client's ZGC when the JVM
# keeps the vector (as it does in play), no change when it removes it. EMF allocated 710 MB of these vectors in 38 s, 14.9%
# of the render thread's allocation, in the 1.0.26 client recording's crowded-mobs window.
emf_cube_vertex_vector=true

# ---- Added in 1.0.29: Forge's object-holder passes call only the holders of the registry being registered
# ----------------------------------------------------------------------------------------------
# Forge: after each registry is registered at startup, only that registry's object holders are updated
# Target: Forge 47.4.16 | side: BOTH | since 1.0.29
# At startup Forge registers about 300 registries one after another, and after each one it walks every object holder of
# every mod (about 100,000 in this pack, one per registered block, item, sound and so on) to update the few that belong to
# that registry. Each holder remembers which registry it belongs to, so the walk now keeps one list of the holders in
# Forge's own order and, for each registry, calls just the holders of that registry (plus any holder of an unknown kind,
# and each holder once more until its first registry check has run). The same holders are updated in the same order with
# the same errors; the list is rebuilt whenever a holder is added or removed.
# Measured: offline on Forge's own classes, 178 registry passes compared with the switch off and on from the same state
# (holders updated, errors and their order, a holder added mid-pass) were identical on both sides; 300 passes over
# 103,000 holders took 4.2-4.6 s -> 76 ms (about 150 -> 2.5 ns per holder). In this pack's profiles the walk was 7% of the
# dedicated server's startup thread (about 1.1 s) and 2.7% of the client's (about 1.5 s).
forge_object_holder_pass_index=true

# ---- Added in 1.0.29: Server-list mod data reused while the mod list is unchanged
# ----------------------------------------------------------------------------------------------
# Forge: the mod and channel part of the server-list status is reused while it is unchanged
# Target: Forge 47.4.16 | side: BOTH | since 1.0.29
# The server-list status carries every mod and network channel in a packed string. Forge rebuilt that string from
# scratch on every status update (comparing every mod with every channel), every 5 seconds normally and every tick while
# Chunk Pregenerator shows its progress in the server list. The mod list cannot change in a running game, so the last
# result is reused when the mods and channels, in the same order, are the same as last time; anything else is rebuilt.
# Measured: offline on Forge's own class, the status text came out identical for pack-sized, truncated, reordered,
# changed and empty mod lists; 4.5 ms -> 0.15 ms per status update with 440 mods. During a pregeneration it was 16.6% of
# the dedicated server thread.
forge_status_ping_memo=true

# ---- Added in 1.0.29: block states remember whether they are air
# ----------------------------------------------------------------------------------------------
# Minecraft (Forge): each block state remembers whether it is air
# Target: Minecraft 1.20.1 with Forge 47.4.16 | side: BOTH | since 1.0.29
# Forge turns the "is this block air" check into a call on the block that reads the answer back from the state. Because
# two blocks in this pack answer that call their own way, every check has to look up the block and its type first. Each
# state now keeps its answer after the first check when its block uses Forge's standard air check (a fixed property of the
# state); blocks with their own air check (Ars Nouveau's intangible air, Immersive Engineering's fake light) are asked
# every time.
# Measured: offline on the game's own block-state classes with the changes of all 23 other mods that patch them applied:
# the same answer in every case (192 kinds of state, a block whose answer changes, 8 threads racing); one check 3.2 -> 1.5
# ns with the states cached, no consistent change when they come from memory. In the test flight this check was the
