# ---- Added in 1.0.30: Touching terrain draw commands are merged
# ----------------------------------------------------------------------------------------------
# Touching terrain draw commands are merged
# Target: Embeddium 0.3.31 (Minecraft 1.20.1) | side: CLIENT | since 1.0.30
# Embeddium issues one draw command per face direction of every section, even when consecutive commands read vertex
# ranges that touch (a section's face directions are stored back to back). In the solid and cutout passes such commands
# are now issued as one, which draws the same triangles in the same order with the same vertex numbers. Sorted
# translucent passes are left alone. A shader pack that reads per-draw numbers (gl_PrimitiveID, gl_DrawID,
# gl_BaseVertex) keeps the unmerged commands; the pack's files are checked once when it is loaded. With
# embeddium_draw_batch_cache on, the merge runs only when a region's commands are rebuilt.
# Idea: Sodium 0.7 combined draw commands, idea text only
# Measured: 1,000,000 command lists (311 million commands, edge cases) and 120,701 real builds, each merge equal to an
# independent triangle-by-triangle expansion, 0 mismatches; draw commands 54,418 -> 30,680 (main view) and 93,107 ->
# 15,640 (shadow pass) per frame in the bench world; the merge costs 3.4-4.3 ns per command when it runs; in game
# with a shader pack and the graphics card at 96% load, about 1% more frames per second (ahead in all three paired runs)
embeddium_merged_draws=true

# ---- Added in 1.0.30: A section search whose inputs are all unchanged replays the previous one
# ----------------------------------------------------------------------------------------------
# A section search whose inputs are all unchanged replays the previous one
# Target: Embeddium 0.3.31 (Minecraft 1.20.1) | side: CLIENT | since 1.0.30
# Every frame Embeddium searches the chunk sections outward from the camera to find the ones to draw, and with Oculus
# shadows it searches twice (shadow pass and main view). With a still view it repeats the same walk. A search depends
# only on the section links, the sections' visibility data, the camera section, the occlusion setting, the distance
# test's inputs and the frustum's own numbers. Once a view stands still, the switch records a search (the sections it
# reported, in order, with their answers) under a key of all those inputs, bit for bit. A later search with exactly
# that key stamps the same sections with the new frame and reports them to Embeddium's own list builder in the same
# order, so render lists, rebuild queues and the translucency check come out as before. Any change, an unknown frustum
# or list builder, or another mod's mixin on these classes runs the full search; a view that keeps moving is only
# checked now and then.
# Idea: Sodium 0.6.1 graph-search gating and Iris's shadow-list reuse, idea text only
# Measured: 120,209,862 checks against the shipped class over 12,000 searches (still, moving, turning, sun steps, link
# and build-state changes, loads, switch toggles), 0 mismatches; still view 58-68% less time per search (hot 65 -> 21
# and 106 -> 37 us, cold 193 -> 78 and 378 -> 158 us); moving view +0.5-0.6 us per search hot, +4-6 us cold (1-3%);
# the search is 14.3% of the render thread with a still camera in the 1.0.26 recording (10.6% shadow pass)
embeddium_search_replay=true

# ---- Added in 1.0.30: The section search replay also serves Oculus's shadow pass
# ----------------------------------------------------------------------------------------------
# The section search replay also serves Oculus's shadow pass
# Target: Oculus 1.8.0 (Minecraft 1.20.1) | side: CLIENT | since 1.0.30
