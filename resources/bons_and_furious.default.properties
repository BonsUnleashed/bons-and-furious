# ran 424 ticks in 70 s (6.057 TPS) with eight zero-tick windows; fixed, 3,800 ticks in 189.997
# s (20 TPS); 626 fixture and 187 structural assertions. C2ME: 4,678 assertions including 2,000
# concurrent spawns; the exact 172-chunk ocean-ruin replay that crashed now completes (73.094 s)
