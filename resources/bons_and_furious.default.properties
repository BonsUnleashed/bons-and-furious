# Support for the *_item_renderer_reuse switches below: notes when a client resource reload starts (start-up,
# F3+T, resource pack changes) and when it has finished. While a reload runs, items are drawn exactly as before;
# when it ends, every reused item renderer is dropped so the next one is built from the reloaded models. Turning
