# Bons and Furious 1.0.21 - optimization and fix switches
#
# Optimizations do the same work with less effort. Entries marked [FIX] are generation compatibility fixes
# (formerly Bons Worldgen Compatibility): switching one off brings back the original problem it describes.
#
# Set a key to false to leave that mod's code exactly as shipped. Changes need a game restart because
# every optimization is a mixin applied while the target class is being loaded. Missing keys are added with
# their default (true) on the next start; unknown keys are ignored with a warning. Each optimization only
# applies when the supported version of its target is installed: a missing target mod is simply skipped,
# and when any method a switch depends on differs from the tested build, none of that switch's mixins are
# applied and the log says so in one line per class.
#
# Measurements quoted below are focused method or phase measurements from the pack this mod was built for;
# they are not whole-game FPS or TPS promises. Details: docs/OPTIMIZATIONS.md in the release.

# ----------------------------------------------------------------------------------------------
# Architectury event dispatch without MethodHandle re-resolution
# Target: Architectury API 9.2.14 | side: BOTH | since 1.0.2
# Architectury's EventFactory.invokeMethod dispatched every listener call through
# MethodHandles.lookup().unreflect(method).bindTo(listener).invokeWithArguments(args), re-
# resolving a MethodHandle for every listener on every event with no cache. The patch calls
# method.invoke(listener, args) directly and unwraps InvocationTargetException so the listener's
# own exception is rethrown unchanged.
# Measured: 19x faster dispatch: 649 -> 34 ns per invocation in a 2,000,000-call JDK 17 harness.
# Before the patch Spark attributed 4.9-10.5% of server-thread time to this dispatch (34
# dimensions x 54 LevelTick subscribers x 2 phases x 20 tps, about 73,000 invocations per
# second); after installation the client render-thread share of Architectury dispatch measured
# 0.39%.
architectury_event_dispatch=true

# ----------------------------------------------------------------------------------------------
# Structurify height cache with weak chunk keys
# Target: Structurify 2.0.34+mc1.20.1 | side: BOTH | since 1.0.2
# Structurify's per-thread chunk-generator height cache keyed every entry by a strong reference
# to the LevelHeightAccessor (the chunk being generated), so each cached height kept an
# otherwise finished chunk reachable until the LRU evicted it. The patch makes the key's
# accessor reference a WeakReference with identity semantics and drains collected keys through a
# ReferenceQueue, so generated chunks can be garbage collected while live keys keep returning
# cached results.
# Measured: A memory-retention fix rather than a throughput change: 30,114 test assertions
# including 60,000 deterministic cache operations compared with the original and an actual
# garbage collection removing 512 stale keys. How many gigabytes the original reference path
# retained in real sessions was not established.
structurify_height_cache=true

# ----------------------------------------------------------------------------------------------
# TaCZ synced-data holder resolved once per tick
# Target: Timeless and Classics Zero (TaCZ) 1.1.5 | side: BOTH | since 1.0.0
# TaCZ's server-side living-entity tick resolved the entity's synced-data capability holder
# separately for each of eight adjacent state writes every tick. The patch opens a scope around
# those writes so the holder is resolved once and reused; the handle is checked for validity, a
# different entity or an absent holder falls back to the original lookup, scopes nest, and
# exceptions clean the scope up.
# Measured: Eight holder resolutions: 128 -> 16 bytes and 0.378 -> 0.235 us per tick (medians of
# eight alternating rounds); 27,398 native dedicated-server assertions including 200 randomized
# update sequences and 4,000 parallel scope iterations.
tacz_sync_scope=true

# ----------------------------------------------------------------------------------------------
# TaCZ sync collections without stream collectors
# Target: Timeless and Classics Zero (TaCZ) 1.1.5 | side: BOTH | since 1.0.1
# DataHolder.gatherDirty/gatherAll and the per-tick packet routing in SyncedEntityDataEvent
# built their lists with stream collectors. The patch uses ordered ArrayList loops and keeps
# gather, self-send, tracking-send and clean as separate phases in the original order.
# Measured: Dirty collection 432 -> 80 bytes per call and routing 688 -> 160 bytes per call
# (77-81% less allocation); equal across 2,000 randomized sequences in the native server
# fixture.
tacz_sync_collections=true

# ----------------------------------------------------------------------------------------------
# Fowl Play flocking headings in primitive arithmetic
# Target: Fowl Play 1.1.2+1.20.1-forge | side: BOTH | since 1.0.1
# Both flocking behaviours accumulated the heading through chains of temporary Vec3 objects for
# every neighbour. The patch accumulates the same arithmetic in primitive doubles, preserving
# negate-then-add order, float reciprocals, the sqrt comparison, getter calls and the six random
# draws.
# Measured: 680-6,680 -> 40 bytes per heading for 7, 24 and 64 neighbours (94-99% less
# allocation); all 14,000 headings, 42,000 raw double components and 14,000 subsequent RNG
# states matched the original bytecode.
fowlplay_flock_vectors=true

# ----------------------------------------------------------------------------------------------
# Alex's Caves magnetism with one point-of-interest query
# Target: Alex's Caves 2.0.2 | side: BOTH | since 1.0.2
# MagnetUtil.tickMagnetism ran two nearby-magnet point-of-interest queries per eligible entity
# per tick, one for attracting and one for repelling magnets. The patch runs a single traversal
# and partitions the results in their original order before the unchanged force callbacks and
# the rest of the tick.
# Measured: 1,772 assertions equal, including 250 raw-bit force/velocity comparisons with the
# original method. The magnetism hotspot was about 3.8% of sampled server-thread busy time in
# the August 24 profile; that is a baseline cost, not a measured saving.
alexscaves_magnet_query=true

# ----------------------------------------------------------------------------------------------
# Occult bed scan only on the server, only in loaded chunks
# Target: Occult 1.0.0 (Alpha 5) | side: BOTH | since 1.0.2
# TendrilsBedProcedure scans the 3,071 positions of a 19x19x19 block sphere around every player
# on every player tick, on the client as well as the server, and reads each block through
# LevelAccessor.getBlockState. On the server that read loads, and if necessary generates, any
# chunk that is not ready, so a player standing next to unfinished terrain parks the server
# thread until that chunk has been generated. Since 1.0.2 the patch returns before the scan
# unless the level is a ServerLevel and references vanilla's minecraft:beds tag directly instead
# of allocating a tag identifier per position. Since 1.0.10 the server path takes the
# procedure's independent Math.random() < 0.001 draw before reading anything, and reads the
# block through ServerChunkCache.getChunkNow, skipping a position whose chunk is not already
# loaded instead of loading or generating it.
# Measured: 1.0.2: removes all 3,071 block reads per client invocation; across 96 server
# scenarios the original and patched code produced identical ordered queries, spawns, RNG draws
# and motion (579 assertions). 1.0.10: server block reads fall from 3,071 to about 3 per player
# tick (3,071 x 0.001), and no chunk is ever loaded by the scan. Spark 1ERXo2mTeF (2026-09-27,
# one player on fresh terrain) had caught the previous server path parked in chunk generation
# for 152 s of a 12.8-minute profile: 100% of one minute and 92% of the next.
occult_bed_scan_guard=true

# ----------------------------------------------------------------------------------------------
# Cryptic Foes Howler bone lookup cache
# Target: Cryptic Foes 1.0.4 | side: BOTH | since 1.0.2
# ModelHowler resolved animation bones by walking its part tree by name for every animated part
# on every frame. The patch overrides the descendant lookup with a per-model cache of successful
# and missing lookups (capped at 256 names) that delegates to the original method on first use;
# newly baked models start empty.
# Measured: Identical poses across all 12 animations, 10 timestamps and 3 weights (10,136
# assertions). No timing benchmark was run.
crypticfoes_howler_bone_cache=true

# ----------------------------------------------------------------------------------------------
# AmbientSounds biome regex memo
# Target: AmbientSounds 6.3.8 | side: CLIENT | since 1.0.2
# AmbientSounds re-ran every biome regex condition against the biome identifier string on each
# environment scan. The patch memoizes the pure (regex pattern, biome identifier) result with
# weak pattern keys, so live rules keep their entries, discarded rules can be collected, and
# each pattern holds at most 256 identifiers. Tags, conditions and the scan cadence are still
# evaluated live; no biome holder, world or sound decision is cached.
# Measured: In matched native windows the original executed 1,179,601 regex matches for
# 2,106,100 lookups; ambient tick p95 3.790 -> 2.029 ms and p99 6.491 -> 4.294 ms with 200,000
# results checked equal. The first 128-pattern version (1.0.2) thrashed with 131-141 live
# patterns; the weak-key memo shipped in 1.0.5 fixed that.
ambientsounds_biome_match_cache=true

# ----------------------------------------------------------------------------------------------
# Vanilla terrain density graph memo per NoiseChunk
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.2
# Vanilla re-maps the density-function graph for every NoiseChunk and transforms shared
# HolderHolder references many times per traversal. The patch wraps the visitor used during one
# NoiseChunk preparation with an identity memo so a shared node is transformed once per
# traversal. The memo belongs to one traversal and is never shared between chunks, worlds, seeds
# or workers; noise math and coordinates are untouched.
# Measured: Per-thread CPU -56.3% and allocation -59.6% (1.474 GB -> 0.595 GB) for 64 Overworld
# base-column queries in three warmed ABBA trials; 144 requested FULL chunks generated in 70.7 s
# versus 96.0 s in one host-confounded trial; 2,496,115 native assertions equal, including
# 2,457,600 block states.
terrain_density_memo=true

# ----------------------------------------------------------------------------------------------
# Vanilla /data merge skips copying an unchanged tree
# Target: Minecraft (data commands) 1.20.1 | side: BOTH | since 1.0.0
# The vanilla /data merge command copies the whole NBT tree of its target, merges and compares,
# even when a datapack function merges a single unchanged scalar every tick (Scorched and
# Incendium do this). The patch checks small scalar merges against the existing values first and
# throws the original 'nothing changed' error without copying the tree when nothing would
# change; any merge that changes data takes the original path.
# Measured: Unchanged-merge phase after serialization: 18,040 -> 0 bytes and 17.287 -> 0.085 us
# per command; 20,000 randomized NBT cases and real command outcomes equal.
vanilla_data_merge_unchanged=true

# ----------------------------------------------------------------------------------------------
# Spawn sea-life decoration ticks without a Random per tick
# Target: Spawn 4.0.7-1.20.1 | side: BOTH | since 1.0.3
# Spawn's sea-life decoration block entities created a new java.util.Random seeded from the
# block position on every tick just to draw one interval, and routed movement through boxed
# helper calls. The patch computes the same first-draw arithmetic of java.util.Random (including
# rejection sampling) for the three known classes and passes the two movement floats directly;
# unknown subclasses keep the original fresh Random and virtual call.
# Measured: Sea star tick 38.0 -> 33.6 ns, sea urchin 42.1 -> 40.6 ns, sea bunny 89.8 -> 66.2 ns
# and 80.1 -> 24.1 bytes per tick; 1,000,032 seeded interval comparisons and 192,000 paired tick
# steps identical by raw bits.
spawn_sealife_tick=true

# ----------------------------------------------------------------------------------------------
# Ryoamic Lights chunk rebuild loops without boxing
# Target: Ryoamic Lights 0.2.3+mc1.20.1 | side: CLIENT | since 1.0.3
# The tracked-chunk rebuild loops iterated a LongOpenHashSet through its boxing iterator,
# allocating a Long for every chunk position. The patch calls LongIterator.nextLong() instead;
# the world lookup, source membership, locks, brightness calculation, update interval and
# rebuild order are unchanged.
# Measured: Block-entity loop 40.3 -> 30.5 ns (-24.3%); entity loop neutral. A warmed JIT
# already removes the boxing in some runs (48 -> 0 bytes in one repeat); the interpreter-only
# loop measured 232 -> 40 bytes for eight chunks.
ryoamiclights_chunk_iteration=true

# ----------------------------------------------------------------------------------------------
# Oculus model-to-entity vertex conversion reuse
# Target: Oculus 1.8.0 | side: CLIENT | since 1.0.4
# Oculus' model-to-entity vertex conversion re-read UVs, shader ids and the runtime stride for
# every vertex of a quad and copied each vertex through a generic memCopy. The patch reuses
# those values within one quad and copies the fixed 36-byte vertex directly, keeping the
# original memCopy for overlapping ranges.
# Measured: vertex-4 60.30 -> 41.76 ns (-30.7%), vertex-64 969.72 -> 648.79 ns (-33.1%),
# vertex-256 3,920.09 -> 2,599.90 ns (-33.7%) with zero allocation both ways; random raw inputs,
# partial counts and overlapping buffers equal.
oculus_entity_vertex_reuse=true

# ----------------------------------------------------------------------------------------------
# Oculus uniform and sampler lists indexed in place
# Target: Oculus 1.8.0 | side: CLIENT | since 1.0.4
# Shader program updates iterated Guava ImmutableLists through temporary iterators on every
# program change. The patch indexes the same immutable lists in order; mutable initializer lists
# keep their iterator traversal.
# Measured: uniforms-0 3.69 -> 3.45 ns, uniforms-1 7.39 -> 6.52 ns (24 -> 0 bytes), uniforms-16
# 75.72 -> 69.19 ns (-8.6%), uniforms-64 312.24 -> 288.62 ns (-7.6%).
oculus_program_traversal=true

# ----------------------------------------------------------------------------------------------
# Distant Horizons cloud culling in scalar arithmetic
# Target: Distant Horizons 3.2.0-b | side: BOTH | since 1.0.4
# Cloud culling built private temporary vectors for each cloud corner test. The patch performs
# the same operations on scalar locals through two private helpers, keeping the original
# arithmetic, camera/look callbacks, subclass callbacks, normalization, distance and visibility
# thresholds, corner order and near-cloud exemption.
# Measured: Warmed cloud-cull 38.92 -> 37.41 ns (-3.9%, 24 bytes both); cold (interpreted)
# 906.65 -> 470.17 ns (-48.1%) and 480 -> 64 bytes. Warmed Java already removes most of these
# temporaries, so the gain is mainly on the cold path.
distanthorizons_cloud_scalars=true

# ----------------------------------------------------------------------------------------------
# Ad Astra dimension gravity as a primitive float
# Target: Ad Astra 1.15.20 | side: BOTH | since 1.0.4
# The dimension gravity lookup boxed the planet's gravity through an Optional/Float chain. The
# patch reads the current planet's primitive float directly with the original 9.807 default and
# division.
# Measured: Warmed timings are neutral to slightly slower within noise (client present 5.75 ->
# 5.83 ns, missing 3.81 -> 4.09 ns); cold 105.38 -> 47.70 ns (missing planet) and 113.41 ->
# 62.52 ns (present) with 16-32 -> 0 bytes. This is a cold-path/allocation change with no warmed
# speedup; switch it off if you prefer stock code.
adastra_gravity_primitive=true

# ----------------------------------------------------------------------------------------------
# Frame pacing: FPS limiter before the display update
# Target: Minecraft client 1.20.1 | side: CLIENT | since 1.0.5
# Vanilla waits for the FPS limiter after the display update, so variable tick and render work
# shifts the interval to the next update. The mixin runs the same limiter call once immediately
# before the display update and skips the original call, so spare frame budget absorbs the
# variable work. It only acts when an FPS cap is set; unlimited FPS bypasses limiting exactly as
# before. This is the one entry that changes timing behaviour (frame delivery) rather than being
# a pure equivalence, which is why it has its own switch.
# Measured: Equal 120 FPS cap crossovers: consecutive-interval difference p95 7.36 -> 1.47 ms
# (standalone CTM scene) and 7.63 -> 1.25 ms (Fusion scene); swap-interval p99 17.96 -> 15.01 ms
# and 17.46 -> 13.69 ms; intervals above 16.67 ms 125 -> 69 and 106 -> 59 per ~80 s; achieved
# FPS unchanged (116.2 / 116.7). These are buffer-swap return intervals, not OS scanout
# timestamps. The JVM flag -Dbons_and_furious.framePacing=false is still honoured.
frame_pacing=true

# ----------------------------------------------------------------------------------------------
# Curios entity slot lookup with one map probe
# Target: Curios API 5.14.1+1.20.1 | side: BOTH | since 1.0.6
# getEntitySlots probed its immutable entity-slot map twice (containsKey, then get). The patch
# does a single get for ImmutableMap instances and returns the same map or the same empty map;
# any other map implementation keeps the original two-probe path.
# Measured: Successful lookup with 96 entries: 12.76 -> 10.16 ns on the client; the server case
# was neutral because the JIT already removed the second probe; zero allocation both ways.
curios_slot_map_lookup=true

# ----------------------------------------------------------------------------------------------
# GeckoLib easing evaluated with primitive doubles
# Target: GeckoLib 4.8.4 | side: BOTH | since 1.0.6
# EasingType composed and evaluated easing functions through boxed Double dispatch at eight call
# sites. The patch marks GeckoLib's own 29 lambda factories with an empty marker interface and
# calls the primitive get(double) for those; custom easing functions supplied by other mods keep
# the boxed dispatch.
# Measured: Mixed easing types 67.35 -> 33.92 ns and 135.76 -> 58.67 bytes per evaluation;
# simple linear easing approximately neutral; 8,000,000 float-component comparisons equal with
# JOML FMA off and on.
geckolib_primitive_easing=true

# ----------------------------------------------------------------------------------------------
# Presence Footsteps duplicate tracking in a primitive set
# Target: Presence Footsteps 1.20.1-1.9.1-beta.1 | side: CLIENT | since 1.0.6
# The capped target selection tracked duplicates with boxed Objects.hash argument arrays and
# HashMap nodes per entity. The patch computes the same 32-bit hash in scalar arithmetic and
# tracks it in a lazily allocated primitive int set that is local to one selection.
# Measured: Duplicate tracking with cap 16: 1,635 -> 1,334 ns and 1,912 -> 224 bytes; cap 64:
# 2,218 -> 1,346 ns and 7,704 -> 1,040 bytes. The 160-entity full selection allocated less
# (6,200 -> 3,936 and 14,440 -> 5,664 bytes) but its timings varied between runs, so no full-
# query speedup is claimed.
presencefootsteps_duplicate_tracking=true

# ----------------------------------------------------------------------------------------------
# Oculus shadow frustum edge planes reuse two vectors
# Target: Oculus 1.8.0 | side: CLIENT | since 1.0.6
# Building the advanced shadow frustum allocated two Vector3f cross products per edge plane. The
# patch reuses two private truncated vectors after their original values are no longer needed.
# Measured: Interpreted edge probe 323.20 -> 297.13 ns and 176 -> 128 bytes; the warmed complete
# constructor was 222.50 -> 218.29 ns with equal allocation (1,456 bytes), so the benefit is
# limited to the pre-compilation path.
oculus_shadow_edge_vectors=true

# ----------------------------------------------------------------------------------------------
# Distant Horizons ignored-dimension suffix compared in place
# Target: Distant Horizons 3.2.0-b | side: BOTH | since 1.0.6
# Every ignored-dimension check copied the dimension-name suffix after the first '@' into a new
# String. The patch compares the suffix in place with an exact-length, case-insensitive
# regionMatches.
# Measured: Prefixed ignored-dimension hit 27.99 -> 21.15 ns and non-match 23.30 -> 10.80 ns; 72
# -> 0 bytes per check.
distanthorizons_ignored_dimension_match=true

# ----------------------------------------------------------------------------------------------
# AmbientSounds terrain scan starts at the highest possible section
# Target: AmbientSounds 6.3.8 | side: CLIENT | since 1.0.7
# AmbientSounds' terrain analysis scans 121 columns from the build ceiling down to the first
# solid, leaves or water block on a recurring cadence. The patch checks the chunk's section
# palettes from the top with a conservative predicate (canOcclude, the leaves tag or water) and
# starts the unchanged original loop at the highest section that could contain a match. Only
# loaded, in-bounds columns of an exact ClientLevel are bounded; everything else keeps the
# original start, and stale palette entries only cause extra scanning.
# Measured: Terrain analysis median 3.2833 -> 0.2772 ms and p95 5.4517 -> 0.6496 ms (-88.1%)
# over 40 analyses per condition; warmed method benchmark 26.46 -> 2.51 us per column with equal
# height sums; 3,087 native checks. Whole-frame p99 did not improve in that run (15.89 -> 16.14
# ms), so this reduces the scan cost without a proven smoothness gain. The JVM flag
# -Dbons_and_furious.ambientHeight=false is still honoured.
ambientsounds_terrain_scan_bound=true

# ----------------------------------------------------------------------------------------------
# Alex's Caves equipment enumeration without cloning
# Target: Alex's Caves 2.0.2 | side: BOTH | since 1.0.8
# isDynamicallyMagnetic called EquipmentSlot.values() for every full equipment scan; that enum
# method returns a cloned array each time. The patch keeps one private copy and iterates it in
# the same order.
# Measured: Equipment check: 64 -> 0 bytes per call in both cases; wall time miss 31.60 -> 35.31
# ns (regressed in the final sample after improving in three earlier runs), last hit 32.92 ->
# 31.12 ns. The consistent result is the removed 64-byte array, not a time saving. 3,585
# research checks plus native qualification of 1.0.8 (966,163 checks).
alexscaves_equipment_enumeration=true

# ----------------------------------------------------------------------------------------------
# Oculus sampler cleanup returns early when the cache is empty
# Target: Oculus 1.8.0 | side: CLIENT | since 1.0.8
# unbindAllSamplers scanned every texture unit's cached sampler even when the cache was already
# empty. A private conservative flag records that a non-zero sampler may be bound (set on a
# successful cache write, cleared on renderer initialization and after a complete cleanup); when
# it is clear a small guard returns immediately, otherwise it calls an exact copy of the
# original cleanup body. A failed cleanup keeps the flag conservative.
# Measured: Empty sampler cleanup 35.04 -> 1.39 ns wall (thread CPU 34.72 -> 2.48 ns); the
# occupied path (bind one sampler and clear) is unchanged at 353.15 -> 355.20 ns; 3,000 sampler
# patterns with actual OpenGL binding queries, repeated clears, invalid indices and renderer
# reinitialization.
oculus_empty_sampler_fast_return=true

# ----------------------------------------------------------------------------------------------
# Curios slot-modifier accumulator allocated only when used
# Target: Curios API 5.14.1+1.20.1 | side: BOTH | since 1.0.8
# clearCachedSlotModifiers constructed a HashMultimap with its bookkeeping and view wrappers
# even when no slot attribute would be added. The patch collects slot modifiers lazily in the
# same underlying Guava-created HashMap/HashSets (expected sizes 12/2) and skips the final
# traversal when nothing was accumulated.
# Measured: No cached modifiers 64.88 -> 20.52 ns and 392 -> 0 bytes; cached modifiers with
# empty items 219.05 -> 178.37 ns and 392 -> 0 bytes; actual slot-modifier removal 7,820.68 ->
# 7,288.03 ns and 24,904 -> 24,040 bytes; 280,852 additional comparisons against Guava
# (collisions, duplicates, nulls, iteration order).
curios_lazy_modifier_map=true

# ----------------------------------------------------------------------------------------------
# GeckoLib keyframe selection without an intermediate location object
# Target: GeckoLib 4.8.4 | side: BOTH | since 1.0.8
# getAnimationPointAtTick called a private helper that created a KeyframeLocation object only to
# unpack it immediately. The patch performs the same search at the call site and keeps the frame
# and time in locals.
# Measured: Keyframe selection 29.54 -> 25.90 ns and 120 -> 88 bytes per call; 169,933
# comparisons with the installed method equal (frame identity, output values, signed zero,
# canonical NaN) plus native boundary/NaN/infinity cases.
geckolib_keyframe_locals=true

# ----------------------------------------------------------------------------------------------
# GeckoLib animation hashes without temporary arrays
# Target: GeckoLib 4.8.4 | side: BOTH | since 1.0.8
# RawAnimation.hashCode used Objects.hash(list), which allocates a one-element varargs array,
# and Keyframe.hashCode built a five-element array and boxed its double length. The patch
# computes the identical 31-based hash directly with Objects.hashCode and Double.hashCode.
# Measured: Keyframe hash 18.97 -> 10.47 ns and 80 -> 0 bytes; RawAnimation hash warm 18.44 ->
# 19.16 ns with 64 -> 64 bytes (the warm JIT already removes its array), interpreted 80 -> 56
# bytes and Keyframe 96 -> 32 bytes; 233,363 comparisons equal (random and exceptional lengths,
# null fields, live list mutations, callback counts).
geckolib_animation_hashes=true

# ----------------------------------------------------------------------------------------------
# [FIX] Hostile Villages: no live-world spawn queue from Distant Horizons generation
# Target: Hostile Villages 1.20.1-5.7 | side: BOTH | since 1.0.12
# Hostile Villages replaces villagers created by village generation: replaceEntityOnSpawn queues
# the mob together with accessor.getLevel() (the live ServerLevel), and the next live
# LevelTickEvent adds and finalizes the replacement there. For a village generated inside a
# Distant Horizons temporary region that queue carried the temporary entity into the live world,
# where Slime.finalizeSpawn/refreshDimensions forced chunk loading on the server thread. The
# patch returns before the queue, the village state and the random draws when the accessor
# belongs to Distant Horizons' generation-region hierarchy (DhLitWorldGenRegion_forge or a
# subclass).
# Measured: Fixes a server freeze: one 84.3-second tick in the reproduction. 346 original / 352
# patched bytecode assertions, 96 identical ordinary scenarios and 12,000 concurrent Distant
# Horizons calls; the native Distant Horizons FEATURES replay (12 threads) then ran 3,700 ticks
# in 184.999 s (20 TPS) with no live-chunk waits.
hostilevillages_distant_generation_queue=true

# ----------------------------------------------------------------------------------------------
# [FIX] Ice and Fire lake guard checks structures inside the generation region
# Target: Ice and Fire 2.1.13-1.20.1-beta-5 | side: BOTH | since 1.0.12
# Ice and Fire keeps lakes out of its structures. Its lake check took the structure manager of
# the live ServerLevel even when the lake was being placed in a generation region, so each
# protection check could force live chunks to load on the server thread. Under Distant Horizons
# generation this froze the server. The patch binds the structure manager to the supplied region
# with StructureManager.forWorldGenRegion.
# Measured: Fixes a server freeze (Spark tcY7ssqYNr: 93.9% of 411.6 sampled seconds in blocking
# chunk requests; the reproduction froze for 98 s with 11 Ice and Fire and then 12 Structure Gel
# workers blocked). With this and structure_gel_lake_guard_region applied: 3,700 ticks in
# 185.001 s (20 TPS), zero live-chunk waits in 60 Distant Horizons worker observations.
iceandfire_lake_guard_region=true

# ----------------------------------------------------------------------------------------------
# [FIX] Ice and Fire pixie villages read difficulty inside the generation region
# Target: Ice and Fire 2.1.13-1.20.1-beta-5 | side: BOTH | since 1.0.12
# Pixie village placement asks the level for the local difficulty at each house. Distant
# Horizons supplies extra temporary chunks around a region, but the inherited vanilla
# WorldGenRegion.getCurrentDifficultyAt checks the base region's bounds and throws for them, so
# pixie villages failed to generate there with an exception. The patch changes that one call
# site to PixieDifficultyCompat.get, which reads the difficulty at the region's center when the
# position is outside the region.
# Measured: Fixes a generation exception. 1,663 assertions under JVM verification; on an actual
# Distant Horizons region the vanilla out-of-bounds call throws while the helper returns the
# same difficulty as bracketing center reads, and natural pixie feature calls returned through
# the repaired branch.
iceandfire_pixie_village_difficulty=true

# ----------------------------------------------------------------------------------------------
# [FIX] Scuba Gear drowned equipment uses the generation region (structure lookup and random source)
# Target: Scuba Gear 1.0.6 | side: BOTH | since 1.0.12
# Scuba Gear equips drowned that spawn near ocean ruins and shipwrecks. Its Mob.finalizeSpawn
# mixin received the ServerLevelAccessor but dropped it, so ScubaEvents searched the live
# world's StructureManager (up to 21,144 structure queries at radius 15) and drew from the live
# world's random even while the drowned was being created inside a generation region. Under
# Distant Horizons that blocked the server on live chunk loads; under C2ME the live-world random
# was read from a worker thread and C2ME's CheckedThreadLocalRandom stopped generation with a
# ConcurrentModificationException. The mixin now passes its accessor to new overloads that bind
# the structure manager to the WorldGenRegion and use WorldGenRegion.getRandom during
# generation. The two parts depend on each other (the mixin passes the accessor to the new
# overloads) and share this one switch.
# Measured: Fixes a server freeze and a C2ME crash. Distant Horizons: the ocean-ruin baseline
# ran 424 ticks in 70 s (6.057 TPS) with eight zero-tick windows; fixed, 3,800 ticks in 189.997
# s (20 TPS); 626 fixture and 187 structural assertions. C2ME: 4,678 assertions including 2,000
# concurrent spawns; the exact 172-chunk ocean-ruin replay that crashed now completes (73.094 s)
# and saves nine drowned, four wearing Scuba gear.
scuba_gear_generation_context=true

# ----------------------------------------------------------------------------------------------
# [FIX] Alex's Caves Teletor spawn setup stays inside the generation region
# Target: Alex's Caves 2.0.2 | side: BOTH | since 1.0.12
# TeletorEntity.finalizeSpawn drew from the live world's random four times and added its
# floating weapon to the live Level even when it was handed a generation region. On a C2ME
# worker thread the random read stops generation with a ConcurrentModificationException, and the
# weapon insertion reaches into the live world from generation. The patch takes both the random
# and the weapon insertion from the supplied region.
# Measured: Fixes a C2ME crash. Twelve helper boundary/error cases and 2,000 concurrent
# operations pass; the actual Forge-transformed original fails on a worker thread, while the
# patched method passes 16 Teletors and 16 snails per native test with every weapon contained
# and linked. Together with scuba_gear_generation_context the exact 172-chunk C2ME ocean-ruin
# replay completes in 65.875 s.
alexscaves_teletor_generation_context=true

# ----------------------------------------------------------------------------------------------
# [FIX] Structure Gel lake hook checks structures inside the generation region
# Target: Structure Gel API 2.16.2 | side: BOTH | since 1.0.12
# Structure Gel's lake hook, which keeps lakes out of Structure Gel structures, had the same
# defect as Ice and Fire's lake guard: it took the live ServerLevel's structure manager while a
# lake was being placed in a generation region, so its checks could force live chunks to load on
# the server thread. The patch binds the structure manager to the supplied region with
# StructureManager.forWorldGenRegion.
# Measured: Fixes a server freeze; the second of the two independent lake guards in the
# 2026-09-09 freeze (12 Structure Gel workers were blocked once Ice and Fire's guard was fixed).
# Both fixed: 3,700 ticks in 185.001 s (20 TPS), zero live-chunk waits.
structure_gel_lake_guard_region=true


