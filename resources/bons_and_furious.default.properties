# Cached default entity handlers
# The per-entity-type VS handler lookup is memoised (same handler VS created).
valkyrien_entity_handlers=true

# [FIX] Ship-edge back-off no longer produces NaN motion
# EntityDragger.backOff normalised a zero vector into NaN; a zero vector now stays zero.
valkyrien_backoff_nan=true

# Per-entity ship collision checks
# Unloaded-ship collision check and movement collision without allocation; ship chunk bounds reused while unchanged (-69% per entity move in the full pack).
valkyrien_entity_ship_collision=true

# Ship chunk-set modification counter
# Adds a transient counter to a ship's active-chunk set so the collision check can reuse its bounds; with it off the check uses the previous exact path.
valkyrien_chunk_set_version=true

# Client: skip ship interpolation for entities not on ships
# Per-frame ship interpolation is skipped for entities that have no vehicle and never stood on a ship.
valkyrien_render_interpolation=true

# Entity base tick and sealed-area checks without ships
# VS's per-entity base-tick and inside-block hooks skip their ship work when the level has no ships or air pockets are disabled.
valkyrien_entity_base_tick=true

# Standing-on-ship probe
# getOnPos / block-below probes return early when no ship is near the probe point.
valkyrien_standing_probe=true

# Entity section unloads without ships
# VS's replacement of entity-section unload processing does its shipyard work only when it can matter.
valkyrien_entity_unloads=true

# [FIX] Ship weather ticks no longer sample climate 28M blocks away
# VS pushed its "occluded" marker through the ship transform and sampled full climate noise far outside the world; the unused biome is read inside the ticking chunk.
valkyrien_weather_occlusion=true

# Mob-spawn distance wrappers
# Spawn distance checks skip the ship-space round trip for chunks no ship manages.
valkyrien_spawn_distance=true

# VS chunk load/unload bookkeeping
# Per-tick scan of newly ticketed chunks, primitive known-chunk map, memoised terrain conversion inputs.
valkyrien_chunk_bookkeeping=true

# [FIX] Sculk vibrations from ships
# VS's sculk mixin cannot inject into Minecraft's interface on Forge 1.20.1; it is retired and the three intended calls are redirected directly.
valkyrien_sculk_vibrations=true

# ---- Added in 1.0.16: vanilla world generation
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: NoiseChunk's second density-graph pass reuses the first pass's result
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.16
# Every NoiseChunk (one per generated chunk and one per single-column height query; structure placement
# issues those constantly) maps the density graph twice. The second pass walks the already mapped final density again:
# every record and spline is rebuilt, hashed down its whole subtree and looked up in the wrap table, only to get back
# the object the first pass made. The patch returns a node unchanged exactly when that lookup would return that same
# object and runs the original code for everything else (new nodes, other mods' density functions). The density graph,
# caches and wrap table come out the same, object for object; noise math is untouched. The JVM flag
# -Dbons_and_furious.finalDensityReuse=false is also honoured.
# Measured: native full-pack fixture, 22 noise dimensions. Every reused node was checked against vanilla re-mapping the
# same object in the same NoiseChunk (overworld 4,656, nether 2,028, End 264 and 19 modded dimensions): always the
# identical object, wrap table unchanged. Base columns, all six heightmaps and complete noise volumes (1.08 M overworld,
# 393 K nether, 393 K End blocks) identical with the switch off and on, including parallel queries. Overworld, ABBA,
# per item: NoiseChunk construction 10.35 -> 0.89 ms CPU (-91%) and 8.4 -> 0.40 MB allocated; one-column height query
# 17.7 -> 8.3 ms (-53%) and 9.3 -> 1.3 MB; full-chunk noise fill 77 -> 69 ms (-10%). Focused measurements, not a
# whole-server generation speed or TPS figure.
terrain_final_density_reuse=true

# ---- Added in 1.0.18: vanilla world generation
# ----------------------------------------------------------------------------------------------
# Vanilla terrain: NoiseChunks share their preliminary surface estimates
# Target: Minecraft (world generation) 1.20.1 | side: BOTH | since 1.0.18
# Aquifers (and surface rules) ask each NoiseChunk for a preliminary surface estimate of a column: a scan of the
# initial density from the top of the world down in cell-height steps. Every NoiseChunk (one per generated chunk and one
# per single-column height query; structure placement issues those constantly) keeps its own table, so while generating
# this pack the same column was scanned about 25 times. This shares the results between NoiseChunks of the same world
# generator in a bounded table (2^16 entries per world) and runs the original scan on a miss. It only shares where the
# result cannot depend on the NoiseChunk: no terrain blending, only vanilla density function types, and every
# flat_cache / cache_2d reads x and z only; each world generator is audited once and otherwise keeps the original code
# (in this pack the Nether is kept, its router has a cache_2d that reads y). Surface estimates, aquifers and terrain come
# out the same; noise math is untouched. The JVM flag -Dbons_and_furious.surfaceEstimateShare=false is also honoured.
# Measured: native full-pack fixture, 22 noise dimensions; sharing is active in 3 (overworld, afterdark, graveyard:past) and
# the rest keep the original code (aquifers off, or the audit refused: the Nether's cache_2d reads y). A value served
# from the shared table always equalled a fresh vanilla scan by a differently placed NoiseChunk, and complete noise
# volumes (1.08 M overworld, 393 K nether and End blocks), base columns and all six heightmaps were identical with
# sharing on and off, including parallel queries. Overworld generation of 144 chunks: 349,843 surface scans became
# 16,488 (95.3% served from the table); wall time 161.8 s -> 88.5 s on a shared machine. Clustered height queries
# (structure placement), ABBA thread CPU: -44 to -45%. Chunk noise fills alone: unchanged. Focused measurements, not a
# TPS figure.
terrain_surface_estimate_share=true

# ---- Added in 1.0.19: Spawn
# ----------------------------------------------------------------------------------------------
# Spawn zombified flowers: the ground search stops at the bottom of the world  [FIX]
# Target: Spawn 4.0.7-1.20.1 | side: BOTH | since 1.0.19
# ZombifiedFlowerFeature walks down "while the block is replaceable" to find ground, with no lower limit. Inside Distant
# Horizons' generation region every block below the loaded terrain reads as air, so the walk ran to y -1,000,001 (about a
# million block reads and a new Vec3i each step) until DH's bounds check threw, aborting that chunk's whole feature step.
# The loop now also stops at the level's minimum build height. In normal generation bedrock or ground always stops it first,
# so the placed flowers are the same; in an empty column it ends at the floor and places nothing, as the original would
# have if it had terminated.
# Measured: native full-pack server fixture, 2026-09-28. Six seeded placements of spawn:patch_zombified_flower on a grass
# platform produced the identical 18 flower blocks with the switch on and off (same block-state hash). Over the End's empty
# void, where the original walk never ends, the patched feature reached the floor and returned in 476 ms (including
# generating that chunk); at the floor it finds no dirt, so it places nothing there.
spawn_zombified_flower_floor=true

# ---- Added in 1.0.19: Better Combat
# ----------------------------------------------------------------------------------------------
# Better Combat: skip the two-handed weapon lookups on every non-offhand equipment read
# Target: Better Combat 1.8.6+1.20.1-forge | side: BOTH | since 1.0.19
# Better Combat's HEAD hook on Player.getItemBySlot looks up the weapon attributes of both hands (registry key, map lookup
# and, for items with NBT, a JSON parse) on every call, for every slot, and only then checks whether the slot is the offhand -
# the only slot it ever changes. The patch returns at once for the other slots; the offhand path is untouched.
# Measured: native full-pack server fixture, 2026-09-28, a player holding a two-handed weapon with a shield in the offhand
# (and a one-handed one): every equipment slot read the same with the switch on and off - the shield still hidden behind
# the two-handed weapon, still visible behind the one-handed one. A non-offhand getItemBySlot call took about 6 ns with the
# switch on vs about 61 ns off (10 million calls each).
bettercombat_offhand_lookup=true

# ---- Added in 1.0.21: Distant Horizons
# ----------------------------------------------------------------------------------------------
# Distant Horizons: LOD buffer render parameters reuse their matrix inverses within a pass
# Target: Distant Horizons 3.3.2 | side: CLIENT | since 1.0.21
# For every LOD buffer it draws, DH updates one shared DhApiBeforeBufferRenderEvent parameter object, and each update
# inverts two 4x4 matrices and multiplies two more although the inputs are the same for every buffer of a render pass.
# Each of those three operations now remembers its last inputs (exact float bits) and result per parameter object and
# copies the result when the inputs are identical. invert and multiply are deterministic, so every field of the parameter
# object gets exactly the value the original update computes, including DH's own result for singular matrices.
# Measured: real DH 3.3.2 classes in a plain JVM, 40,000 randomized frames (singular, NaN, infinite and -0.0 inputs,
# parents changed between buffers, listeners writing the output matrices): every field bit-identical. One buffer update
# took 83 -> 38 ns. In two client spark captures the inversions were 0.47% / 0.46% of the render thread.
distanthorizons_render_param_inverse_reuse=true

# ---- Added in 1.0.21: Ryoamic Lights
# ----------------------------------------------------------------------------------------------
# Ryoamic Lights: block-entity light checks skip the lock while no block entity is a light source
# Target: Ryoamic Lights 0.2.3+mc1.20.1 | side: CLIENT | since 1.0.21
# With block-entity light sources enabled, every ticking block entity asks containsLightSource twice per client tick,
# and each call takes and releases the global read lock to look in the light-source set. A sticky flag now records that a
# block entity is about to be added (set before the write lock in addLightSource, the only way into the set). While it is
# clear, the check answers false for a block entity whose class compares by identity without taking the lock. The world
# check still runs first; entities, and everything after the first block-entity light source, keep the original path.
# Measured: 2,000 randomized add/remove traces (including a block-entity class with an unusual equals) gave the same
# answers; an uncontended check took 6.3 -> 3.0 ns (two per block-entity tick). In two client spark captures the check was
# 0.31% / 0.25% of the render thread, almost all of it from block-entity ticks.
ryoamiclights_block_entity_lock_skip=true

# ---- Added in 1.0.21: Curios API
# ----------------------------------------------------------------------------------------------
# Curios: the capability provider answers other capabilities before the slot lookup
# Target: Curios API 5.14.1+1.20.1 | side: BOTH | since 1.0.21
# Curios' provider sits on living entities, and Forge asks it about every capability queried on such an entity. It
# looked up the entity's slot map first and only then checked whether the query was for the Curios inventory, so every
# other mod's capability query paid a slot lookup. A query for any other capability now returns LazyOptional.empty() at
# once: the original returns that same empty singleton on both of its paths for such a query. Curios inventory queries run
# unchanged.
# Measured: all eight capability / slot-map combinations return the same object; only Curios inventory queries still
# look up slots. The lookup was 0.25% of the server thread and 0.09% of the client render thread in spark captures.
curios_foreign_capability_fast_path=true

# ---- Added in 1.0.21: Cryptic Foes
# ----------------------------------------------------------------------------------------------
# Cryptic Foes: the sound listeners test the sound once, not once per entity
# Target: Cryptic Foes 1.0.4 | side: BOTH | since 1.0.21
# Cryptic Foes wakes sleeping Howlers when a bell rings or a goat horn sounds nearby. Its two sound listeners run for every
# sound played in a level, walk every entity of that level and test the sound again for each entity, although the sound
# does not depend on the entity. The walk now stops after the first entity when that sound test is false (every later
# iteration would only skip); bell and goat horn sounds walk every entity exactly as before. The first entity is still
# visited, so any exception happens at the same point.
# Measured: 3,000 randomized cases (empty levels, null sounds, sleeping Howlers in and out of range) gave the same
# wake-ups and exceptions; a non-bell sound with 3,000 entities took 1,185 -> 20 ns in the model. The listener was 0.21% of
# the server thread in a spark capture.
crypticfoes_sound_listener_invariant=true

# ---- Added in 1.0.21: Embeddium
# ----------------------------------------------------------------------------------------------
# Embeddium: vertex serializer lookups without the read lock
# Target: Embeddium 0.3.31+mc1.20.1 | side: CLIENT | since 1.0.21
# Every copy between two vertex formats (text glyphs, entity cuboids, sprite expanders) looks up its serializer, and each
# lookup took and released a StampedLock read lock. Entries are only ever added, never replaced or removed, so a hit is now
# answered from an immutable copy of the cache published through a volatile field. A miss runs the original locked lookup,
# which also refreshes the copy when the cache has grown (Oculus writes its four serializers straight into the cache).
# Measured: real fastutil map and StampedLock, 400 randomized traces plus a four-reader / one-writer stress test (8
# million lookups): always the same serializer object; a warm lookup took 7.2 -> 4.2 ns uncontended. In two client spark
# captures the lookup was 0.17% / 0.21% of the render thread.
embeddium_serializer_lookup_snapshot=true

# ---- Added in 1.0.21: Minecraft (client models)
# ----------------------------------------------------------------------------------------------
# Vanilla: keyframe-animation bone lookup without stream pipelines
# Target: Minecraft 1.20.1 (client models) | side: CLIENT | since 1.0.21
# Keyframe animations look up every animated bone every frame through HierarchicalModel.getAnyDescendantWithName, which
# streamed the whole part tree (nested Stream.concat and flatMap) to find the part that has a child with that name. That
# part is now found by a plain depth-first walk in the same order (the stream's own source order) and handed to the rest
# of the method unchanged. A part class that overrides getAllParts or hasChild sends the lookup back to the stream.
# Measured: real ModelPart trees in a plain JVM, 30,000 random trees over five children-map types (including null
# children): the same part or the same exception every time. One 47-part model with 18 animated bones took 120 -> 10 us per
# frame. Used by vanilla sniffers, frogs, camels and wardens and by modded mobs on the vanilla animation system.
vanilla_model_bone_lookup=true

# ---- Added in 1.0.21: Entity Model Features
# ----------------------------------------------------------------------------------------------
# EMF: block-entity type string built once per type
# Target: Entity Model Features 3.2.4 | side: CLIENT | since 1.0.21
# EMF looks up the model variation roots of every rendered block entity by a type string, which for block entities it
# rebuilt every frame as BlockEntityType.toString() (class name, '@', identity hash) and then hashed again. The string is
# fixed for the lifetime of the type, so it is now built once per type and the same equal string is returned. Entities and
# any block entity or type class with its own toString, equals or hashCode keep EMF's method.
# Measured: identical strings and map results; 69 -> 10 ns per rendered block entity. 0.19% of the render thread in a
# storage-heavy client spark capture.
emf_block_entity_type_string=true

# ---- Added in 1.0.21: Entity Texture Features
# ----------------------------------------------------------------------------------------------
# ETF: each sprite's texture id derived once
# Target: Entity Texture Features 7.1 | side: CLIENT | since 1.0.21
# ETF's hook on Material.buffer (chests, signs, beds, banners, shields, bells, decorated pots) derived the sprite's
# texture id on every call: a string build and a newly validated ResourceLocation. While this switch applies, ETF's
# MixinSpriteIdentifier is replaced by an identical handler that takes the id from a memo keyed by the sprite name. A name
# that already ends in .png is still returned as itself; an id that fails validation is never remembered, so it fails the
# same way every time. The variant lookup and render-type swap that follow are ETF's own code, unchanged.
# Measured: real ResourceLocation in a plain JVM, identical ids, hashes and strings; 95 -> 4 ns per call. The hook was
# 0.43% of the render thread in a storage-heavy client spark capture (0.27% constructing ids).
etf_sprite_texture_id_memo=true

# ---- Added in 1.0.21: Oculus
# ----------------------------------------------------------------------------------------------
# Oculus: render-phase debug labels built once per phase
# Target: Oculus 1.8.0 | side: CLIENT | since 1.0.21
# setPhase runs whenever the render state changes phase (entities, block entities, particles, terrain layers, sky:
# hundreds of times a frame) and rebuilt the phase's GL debug-group label each time with toLowerCase, replace and
# capitalize. The 24 labels are now built once, with the same expression, and the same debug-group calls happen in the
# same order.
# Measured: real WorldRenderingPhase, all 24 labels equal; 32 -> 1.4 ns per phase change. 0.14% / 0.06% of the render
# thread in two client spark captures.
oculus_phase_labels=true
