# [FIX] Ships no longer fall through freshly loaded terrain
# VS core could bake a sparse terrain update before the initial chunk snapshot and lose all unchanged ground under a ship; updates now wait for the snapshot.
valkyrien_terrain_snapshot_order=true

# Ship lookups, shipyard range and chunk-load terrain conversion
# Static shipyard claim-range check before ship lookups, one-pass ship queries, and chunk-load terrain conversion that reads block ids in bulk (-65% per section on real terrain).
