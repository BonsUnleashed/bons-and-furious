[[mods]]
modId="bons_pure_optimizations"
version="1.0.15"
displayName="Bons and Furious"
authors="BonsUnleashed"
description='''Behaviour-preserving performance patches and generation compatibility fixes for specific mod versions, each with its own switch in config/bons_pure_optimizations.properties. Formerly Bons Pure Optimizations; also carries the former Bons Worldgen Compatibility fixes (Distant Horizons and C2ME generation context for Ice and Fire, Scuba Gear, Alex's Caves, Structure Gel and Hostile Villages). Targets that are missing are skipped; targets at an unsupported version are left untouched. Also carries the former Bons Valkyrien Fixes ("Bons to Be Afloat") for Valkyrien Skies 2.4.11: ship collision, lookup and chunk-conversion optimizations plus terrain, weather, back-off and sculk fixes, each with its own switch.'''

